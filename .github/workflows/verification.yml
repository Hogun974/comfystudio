# Verification automatique de ComfyStudio.
#
# Il n'y a pas de suite de tests unitaires dans ce depot, et ce fichier n'essaie
# pas d'en inventer une. Il verifie ce qui casse REELLEMENT ici, et qui casse
# silencieusement : un fichier qui ne compile plus, un JSON malforme que
# personne ne relit, un script shell qu'on ne lance qu'une fois par machine, et
# surtout l'aiguilleur — dont la justesse peut chuter sans qu'aucune ligne de
# code n'ait bouge, simplement parce que le corpus a change.
#
# Tout est commente en francais, comme le reste du projet.

name: Verification

# Sur chaque poussee et chaque pull request : une erreur decouverte a la fusion
# coute bien plus cher qu'une erreur decouverte au push.
on:
  push:
  pull_request:

jobs:
  verification:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperer le depot
        uses: actions/checkout@v4

      # PAS actions/setup-python. Cette action interroge un catalogue de versions
      # heberge chez GitHub ; sur une forge auto-hebergee qui ne l'atteint pas,
      # elle echoue en repondant « The version '3.12' with architecture 'x64' was
      # not found for this operating system » — et le travail s'arrete la.
      #
      # Ce n'est pas une hypothese : les SOIXANTE-DIX premieres executions de
      # cette verification ont echoue a cette etape, sans en franchir une seule
      # des suivantes, pendant que les commits parlaient de tests qui passent.
      # Une CI qui n'a jamais rien verifie est pire qu'une CI absente : elle
      # rassure.
      #
      # On prend donc le python3 de l'image, dans un environnement virtuel — sans
      # lui, Debian 12 refuse toute installation par pip. Le venv fournit
      # « python » autant que « python3 », ce qui laisse les etapes suivantes
      # inchangees. La version y est 3.11 et non 3.12 : c'est plus severe pour ce
      # que fait cette verification, qui est de la syntaxe.
      #
      # DEUX FORGES, DEUX ENVIRONNEMENTS. Sur le runner auto-heberge, le travail
      # tourne dans un conteneur en root et « apt-get » passe. Sur les runners
      # de GitHub, l'utilisateur n'est PAS root : la meme ligne echoue, et tout
      # le travail avec. Corriger l'une en cassant l'autre est arrive — d'ou ces
      # trois lignes qui ne supposent rien.
      #
      # On essaie d'abord de creer l'environnement virtuel : la ou python3-venv
      # est deja installe, ce qui est le cas chez GitHub, il n'y a rien a faire.
      - name: Installer Python et aiohttp
        run: |
          if ! python3 -m venv /tmp/venv 2>/dev/null; then
            if [ "$(id -u)" = 0 ]; then
              apt-get update -qq && apt-get install -y -qq python3-venv python3-pip
            else
              sudo apt-get update -qq && sudo apt-get install -y -qq python3-venv python3-pip
            fi
            python3 -m venv /tmp/venv
          fi
          /tmp/venv/bin/pip install --quiet --upgrade pip aiohttp
          echo /tmp/venv/bin >> "$GITHUB_PATH"

      # Le depot n'a pas de requirements.txt, et c'est voulu : aiohttp est la
      # SEULE dependance obligatoire, installee juste au-dessus. huggingface_hub
      # et av sont facultatifs, le code retombe sur du HTTPS direct sans eux — on
      # ne les installe donc pas, ce qui verifie au passage que rien ne les exige
      # en douce.

      # serveur.py fait 250 ko : une faute de syntaxe dans une branche rarement
      # prise ne se voit qu'au demarrage, c'est-a-dire chez l'utilisateur.
      # compileall les lit tous, y compris installer.py, qui doit rester lisible
      # par un Python tres ancien pour pouvoir afficher son message de version.
      - name: Tous les fichiers Python compilent
        run: python -m compileall -q .

      # aiguilleur.json est un modele entraine (0,19 Mo) et noeuds.exemple.json
      # est copie tel quel par l'utilisateur : un JSON casse ne se voit qu'a
      # l'execution, et se traduit par « aiguilleur absent » ou « registre
      # illisible » — un message qui ne dit pas ou chercher.
      # Les .jsonl sont verifies ligne par ligne : ce sont le corpus et les
      # bancs, et une seule ligne fautive fait echouer l'entrainement plus bas
      # avec une trace qui ne nomme pas le fichier.
      - name: Les fichiers JSON sont valides
        run: |
          python - <<'PY'
          import glob, json, sys

          mauvais = 0
          for chemin in sorted(glob.glob("**/*.json", recursive=True)):
              try:
                  with open(chemin, encoding="utf-8") as f:
                      json.load(f)
              except Exception as e:
                  print(f"  INVALIDE  {chemin} — {e}")
                  mauvais += 1
              else:
                  print(f"  ok        {chemin}")

          for chemin in sorted(glob.glob("**/*.jsonl", recursive=True)):
              fautes = 0
              with open(chemin, encoding="utf-8") as f:
                  for n, ligne in enumerate(f, 1):
                      if not ligne.strip():
                          continue
                      try:
                          json.loads(ligne)
                      except Exception as e:
                          print(f"  INVALIDE  {chemin}:{n} — {e}")
                          fautes += 1
              mauvais += fautes
              if not fautes:
                  print(f"  ok        {chemin}")

          sys.exit(1 if mauvais else 0)
          PY

      # noeud.sh et installer.sh sont poses sur des machines qu'on ne reverra
      # pas : une faute de syntaxe s'y decouvre au pire moment, sur le NAS de
      # quelqu'un d'autre. `sh -n` analyse sans executer — indispensable, ces
      # scripts installent des choses.
      # POSIX sh et non bash : ces fichiers doivent tourner sur un NAS ou
      # /bin/sh est un dash minimal.
      - name: Les scripts shell passent l'analyse syntaxique
        run: |
          echec=0
          for f in $(find . -name '*.sh' -not -path './.git/*'); do
            if sh -n "$f"; then
              echo "  ok        $f"
            else
              echo "  SYNTAXE   $f"
              echec=1
            fi
          done
          exit $echec

      # Un nom pose deux fois au niveau du module ecrase le premier, en
      # silence. Le 31 aout, un « REGLAGES » ajoute pour un delai de pause a
      # ecrase la table des parametres PAR MOTEUR qui portait le meme nom : toute
      # generation qui la lisait mourait sur un KeyError, et l'utilisateur l'a vu
      # avant la CI. Trois secondes de verification valent mieux que cela.
      # CE PAS A FAIT ECHOUER LA CI DE GITHUB PENDANT DES JOURS, sur QUATORZE
      # faux positifs et pas un seul vrai. Il refusait toute reaffectation au
      # niveau d'un module, ce qui condamnait l'ecriture ordinaire d'un script
      # lineaire : « choisi = S.choisir_noeud(CLE) » onze fois dans
      # banc_repartition, « boucle » cinq fois dans banc_cout, et le raffinage
      # « CODE = re.sub(..., CODE) » sur trois lignes de suite dans banc_page.
      # Aucune n'etait un defaut ; toutes rendaient la CI rouge, donc illisible,
      # donc ignoree — le mal exact que l'en-tete de ce fichier decrit a propos
      # des soixante-dix premieres executions.
      #
      # LA REGLE VISE MAINTENANT LE DEFAUT QU'ELLE NOMME, et lui seul :
      #   - un « def » ou un « class » ecrit deux fois : le premier disparait
      #     en silence, et c'est du code mort que personne ne voit ;
      #   - une CONSTANTE (nom en majuscules) reecrite sans relire sa propre
      #     valeur : « SEUIL = 3 » puis « SEUIL = 5 » deux cents lignes plus
      #     bas. Le raffinage « CODE = f(CODE) » relit la sienne, donc il passe.
      #
      # ET IL S'EPROUVE LUI-MEME AVANT DE JUGER LE DEPOT. Un filet qu'on n'a
      # jamais vu se fermer ne garde rien : il commence par se lancer sur deux
      # bouts de code ecrits ici, l'un fautif et l'autre non, et s'arrete si
      # l'un des deux le prend en defaut. Sans cela, une regle trop laxiste se
      # compterait verte sur tout le depot sans que personne ne le sache —
      # exactement la symetrie de la faute qu'on repare.
      # CE FICHIER ENUMERE SES BANCS UN PAR UN, et cette liste a ROUILLE DEUX
      # FOIS en deux jours : le 2 septembre il manquait banc_traductions,
      # banc_mfa et banc_comptes — 109 verifications que rien ne levait — et le
      # 3 il a fallu y ajouter banc_qr, puis banc_agent. A chaque fois, le banc
      # neuf etait vert en local et jamais lance ici.
      #
      # C'est le defaut que CONTRIBUTING.md vient de corriger DANS SA PROSE en
      # nommant le motif « banc_*.py » plutot que la liste ; ici, la liste est
      # necessaire — chaque banc a son nom d'etape, qui dit ce qu'il garde — et
      # ce sont donc les DEUX qui doivent s'accorder. On ne remplace pas
      # l'enumeration, on la CONFRONTE au repertoire : un banc pose sans etape
      # rougit, et le message dit lequel.
      #
      # Le fichier se relit lui-meme par GITHUB_WORKFLOW_REF, sans nom ecrit en
      # dur : renomme, deplace, il continue de se mesurer.
      - name: Chaque banc du depot a son etape dans cette verification
        run: |
          python - <<'PY'
          import glob, os, re, sys

          ici = os.environ.get("GITHUB_WORKFLOW_REF", "")
          # « owner/depot/.github/workflows/x.yml@refs/heads/main » -> le chemin
          chemin = ici.split("@")[0].split("/", 2)[-1] if ici else ""
          if not chemin or not os.path.exists(chemin):
              chemin = ".github/workflows/verification.yml"
          texte = open(chemin, encoding="utf-8").read()

          lances = set(re.findall(r"python\s+(banc_[a-z_]+\.py|verifier_[a-z_]+\.py)",
                                  texte))
          poses = set(glob.glob("banc_*.py")) | set(glob.glob("verifier_*.py"))
          # banc_mutations lance les autres : il est dans les deux ensembles et
          # ne demande rien de particulier.
          manquants = sorted(poses - lances)
          fantomes = sorted(lances - poses)
          for b in manquants:
              print(f"  SANS ETAPE  {b} — ecrit, vert en local, jamais lance ici")
          for b in fantomes:
              print(f"  FANTOME     {b} — une etape le lance, le fichier n'existe pas")
          if not manquants and not fantomes:
              print(f"  ok          les {len(poses)} bancs du depot ont leur etape")
          # Sans ce plancher, un glob qui ne trouverait plus rien rendrait les
          # deux ensembles vides et cette verification serait vraie DE RIEN.
          if len(poses) < 10:
              print(f"  SEUL {len(poses)} banc(s) trouve(s) : le releve ne mesure plus rien")
              sys.exit(1)
          sys.exit(1 if manquants or fantomes else 0)
          PY

      - name: Aucun nom n'est defini deux fois au niveau d'un module
        run: |
          python - <<'PY'
          import ast, collections, glob, sys

          def doublons(source, chemin="<essai>"):
              """(nom, genre, lignes) pour chaque nom REELLEMENT ecrase."""
              arbre = ast.parse(source)
              poses = collections.defaultdict(list)
              for n in arbre.body:
                  if isinstance(n, (ast.FunctionDef, ast.AsyncFunctionDef,
                                    ast.ClassDef)):
                      poses[n.name].append(("def", n.lineno, False))
                  elif isinstance(n, ast.Assign):
                      # « relit » : la nouvelle valeur cite l'ancienne, donc ce
                      # n'est pas un ecrasement mais un raffinage.
                      lus = {x.id for x in ast.walk(n.value)
                             if isinstance(x, ast.Name)}
                      for c in n.targets:
                          if isinstance(c, ast.Name):
                              poses[c.id].append(
                                  ("valeur", n.lineno, c.id in lus))
              rendu = []
              for nom, faits in sorted(poses.items()):
                  if len(faits) < 2:
                      continue
                  genres = {g for g, _, _ in faits}
                  if "def" in genres:
                      rendu.append((nom, "def/class", [l for _, l, _ in faits]))
                  elif nom.isupper() and not any(r for _, _, r in faits[1:]):
                      rendu.append((nom, "constante", [l for _, l, _ in faits]))
              return rendu

          # ── le filet s'eprouve avant de juger ────────────────────────────
          FAUTIF = "def a():\n    pass\n\n\ndef a():\n    pass\n"
          SAIN = "X = 1\nX = X + 1\nb = 2\nb = 3\n"
          if not doublons(FAUTIF):
              print("  LE FILET NE VOIT PLUS un def ecrit deux fois")
              sys.exit(1)
          if doublons(SAIN):
              print(f"  LE FILET REFUSE du code sain : {doublons(SAIN)}")
              sys.exit(1)
          print("  ok        le filet distingue l'ecrasement du raffinage")

          fautes = 0
          for chemin in sorted(glob.glob("*.py")):
              vus = doublons(open(chemin, encoding="utf-8").read(), chemin)
              for nom, genre, lignes in vus:
                  print(f"  ECRASE    {chemin}:{lignes} — {nom} ({genre})")
                  fautes += 1
              if not vus:
                  print(f"  ok        {chemin}")
          sys.exit(1 if fautes else 0)
          PY

      # Les bancs du classifieur ne couvrent PAS ce chemin : ils mesurent ce que
      # le modele bayesien decide, pas ce que les expressions regulieres
      # court-circuitent avant lui. Or c'est la qu'une faute est la plus
      # sournoise — le studio rend une image, simplement pas la bonne.
      #
      # Ce banc existe pour une faute qui a eu lieu : « enleve le fond »,
      # formulation du detourage depuis le premier jour, s'est mise a remplacer
      # le SUJET quand les moteurs de retouche sont arrives. Aucune tolerance
      # ici : ce ne sont pas des statistiques mais des decisions ecrites a la
      # main, et une seule qui change est une regression.
      - name: Les formulations reconnues a l'ecrit partent au bon endroit
        run: python verifier_formulations.py

      # Les deux motifs de surete du projet, eprouves dans les DEUX sens. Ils se
      # sont trompes deux fois le meme jour, le 31 aout : d'abord en mordant sur
      # « nuit » et « nuage », ce qui envoyait chaque traduction sur un modele
      # local a cent soixante secondes ; puis, en corrigeant cela, en laissant
      # tomber les formes anglaises derivees — « a child in a sexual pose »
      # n'etait plus refuse. Un motif de surete ne se relit pas, il s'eprouve.
      # Aucune tolerance : chaque ligne du banc est une decision, pas une
      # statistique.
      - name: Ce qui reste a la maison, et ce qui est refuse
        run: python banc_adulte.py

      # Les trois regles de repartition posees par l'utilisateur : une machine
      # en pause ne pense pas, une carte libre passe devant une carte occupee,
      # et a egalite c'est la plus petite. Plus une regle de surete : une image
      # a lire ne part jamais sur une machine sans modele de vision, parce
      # qu'une description inventee ne se signale pas. Aucun Ollama n'est
      # joignable dans la CI — le banc remplit le cache a la main.
      - name: Le studio choisit le bon Ollama
        run: python banc_cerveaux.py

      # Le devis annonce, avant de lancer, ce que les rendus precedents ont
      # coute. Deux facons de se tromper, aussi graves l'une que l'autre :
      # promettre un chiffre tire d'un seul rendu, et se taire alors qu'on sait.
      - name: Le devis dit ce qu'il sait, et se tait sinon
        run: python banc_durees.py

      # Une demande qui reclame une carte EN PAUSE patiente, puis reste ARMEE et
      # repart toute seule au reveil. Trois portes de reveil, une expiration, et
      # une survie au redemarrage : autant d'endroits ou un oubli laisse une
      # demande dormir pour toujours sans que rien ne le dise.
      - name: Une demande armee repart au reveil de la machine
        run: python banc_attente.py

      # Le journal des appels distants. Ce qu'il compte n'est jamais estime :
      # un nombre de jetons inconnu reste vide plutot que devine, sans quoi le
      # plafond couperait sur un chiffre invente.
      - name: Ce que le nuage a coute est compte, jamais devine
        run: python banc_cout.py

      # N variantes sont N demandes dans la file, et non un batch : une carte de
      # 5,9 Go ne tient pas quatre images a la fois. Le lien entre les tours et
      # le rang affiche s'etaient deja perdus une fois.
      - name: Les variantes sont des demandes distinctes
        run: python banc_variantes.py

      # Compose ne transmet que ce qu'il nomme. Dix reglages etaient lus hors
      # conteneur et ignores en silence dedans, pendant que la documentation les
      # donnait pour reconnus — et le studio du reseau tourne en conteneur. Ce
      # banc relit serveur.py et refuse tout nom qui n'arriverait pas jusque-la.
      - name: Tout ce que le studio lit arrive au conteneur
        run: python banc_conteneur.py

      # Le studio n'avait aucune notion de version, et le modele d'issue
      # reclamait pourtant « Version du studio (commit, ou date) » — impossible
      # a remplir pour qui a installe par executable ou par conteneur, soit
      # DEUX chemins sur quatre. Ce banc garde l'identifiant et, surtout, la
      # moitie qu'on perd sans s'en apercevoir : quand aucune source ne repond,
      # le studio ecrit « inconnue » et non une chaine vide ni une date
      # inventee. Il garde aussi le piege de git, qui REMONTE les dossiers
      # parents et fait annoncer le commit du depot voisin.
      - name: Le studio sait dire ce qu'il est, ou qu'il l'ignore
        run: python banc_version.py

      # La page est un seul fichier : HTML, CSS et JS ensemble, et rien ne
      # relisait l'ensemble. « .puce.moteur » colorait une pastille du nom du
      # panneau des machines, deux regles dormaient sans element, et les deux
      # tables des reglages peuvent deriver l'une de l'autre sans qu'aucune
      # erreur ne se leve — c'est ainsi que les reglages par conversation sont
      # morts le 31 aout. Statique : ce banc ne voit pas un rendu, il voit une
      # contradiction.
      - name: La feuille et le script de la page s'accordent
        run: python banc_page.py

      # QUI GARDE LES GARDIENS. Trois fois cette semaine, un banc vert a couvert
      # une fonctionnalite entierement morte : banc_page.py, ecrit expres pour
      # empecher un defaut de revenir, ne voyait pas ce defaut — il cherchait
      # « priorite: $("#priorite").value » quand le code portait l'abreviation
      # ES6, « priorite, ». La ligne fautive restauree, le banc restait vert.
      # Un banc ne se relit pas, il s'eprouve : ce banc-ci mute le code et exige
      # que le banc vise rougisse, sur la ligne nommee et pas une autre. Deux
      # secondes, aucune dependance, et le depot n'est jamais touche — tout se
      # passe sur des copies dans un dossier temporaire.
      - name: Les bancs rougissent encore sur les pannes qu'ils gardent
        run: python banc_mutations.py

      # L'installeur annonce « ~N Go a prendre » avant un telechargement de
      # plusieurs dizaines de minutes, et c'est la seule chose sur laquelle
      # quelqu'un decide. Le chiffre est une somme : un fichier absent de la
      # table des tailles y compte pour zero, en silence. C'est arrive —
      # « fluidifier » annonçait « ~0 Go a prendre » pour un fichier qu'il
      # allait bel et bien telecharger.
      - name: Le catalogue promet ce qu'il va telecharger
        run: python banc_catalogue.py

      # QUELLE MACHINE RECOIT LE TRAVAIL. Le studio du reseau tourne sans GPU
      # et ne fait que repartir — mais trois endroits supposaient qu'il pouvait
      # calculer, et aucun ne posait la question. La tolerance RAM lui inventait
      # une carte de 2 a 5 Go, la dispense d'inventaire le retenait pour des
      # moteurs qu'il n'a pas, et choisir_noeud le preferait sans condition : il
      # gagnait contre la 2080 Ti et le rendu attendait dans le vide. Signale
      # par l'utilisateur, et aucun banc ne regardait la repartition.
      - name: Le studio sans carte laisse travailler les noeuds
        run: python banc_repartition.py

      # LA ROUTE LA PLUS FRAGILE DU DEPOT, et rien ne l'eprouvait : trois
      # defauts d'affilee en deux jours sur /api/refaire, dont un de SURETE. Le
      # plan qu'elle reconstruit vient d'un tour ecrit il y a peut-etre des
      # semaines, donc tout ce que le tour ne porte pas est perdu en silence —
      # « classement » l'etait, et adulte() le lit : un rendu marque explicite
      # pouvait repartir chez un fournisseur distant, contre la regle « ce qui
      # est adulte ne sort pas de la maison ». Les deux gardes qui le retiennent
      # sont eprouvees SEPAREMENT, parce qu'elles se recouvrent et que la
      # premiere suffit a elle seule. Le banc verifie aussi qu'un moteur retire
      # du catalogue et un rendu confie a un fournisseur reçoivent une phrase et
      # non « ERREUR : 'sdxl_vieux' », qu'un tour d'avant le 31 aout — sans
      # champ « taille » — rend encore une image au lieu d'un KeyError, et
      # qu'un refait rate REND SON BOUTON.
      - name: « Refaire » refait la meme demande, et rien d'autre
        run: python banc_refaire.py

      # UNE DEMANDE ETRANGERE SUR QUATRE ETAIT EXECUTEE DE TRAVERS SANS QU'UN
      # MOT LE DISE. Bayes naif ne sait pas dire « je ne connais pas ces
      # mots » : quand presque aucun trait de la phrase n'est au corpus, le
      # lissage de Laplace departage les classes tout seul, et la marge — le
      # seul chiffre que le studio consultait pour trancher sans appeler le
      # modele — peut etre grande pour de mauvais motifs. Le court-circuit
      # tirait PLUS souvent sur de l'etranger que sur du francais et se
      # trompait la moitie du temps : 26 pannes silencieuses sur 345 demandes,
      # une par-dessus lesquelles aucun autre banc du depot ne passe.
      #
      # CE BANC EST LE SEUL QUI VOIE LA GARDE. Les onze autres ne bougent pas
      # d'un cas quand on la retire — c'est ce qui la rendrait facile a enlever
      # « pour simplifier ». Il rejoue les 460 cas (les deux bancs du depot
      # traduits a la main) par le VRAI chemin, aiguiller(), et compare deux
      # politiques : avec la garde et sans. Aucune carte, aucun reseau, 2,3 s.
      - name: Une demande etrangere n'est pas executee de travers en silence
        run: python banc_multilingue.py

      # UNE TRADUCTION NE PLANTE PAS, ELLE MENT. Un « {titre} » oublie dans la
      # version anglaise ne leve aucune exception : la phrase s'affiche,
      # entiere, sans le nom du moteur qu'elle annonce. Une cle qui manque dans
      # une langue ne casse rien non plus — le repli rend le francais, et
      # l'utilisateur anglais voit une phrase francaise au milieu de son
      # interface sans que personne au studio ne l'apprenne jamais. Ce banc
      # mesure ce qui ne se voit pas, des deux cotes du dictionnaire : il lit
      # aussi serveur.py par l'arbre de syntaxe, pour qu'un site de panne ne
      # s'ajoute pas sans sa cle.
      - name: Aucune traduction ne ment
        run: python banc_traductions.py

      # LE SECOND FACTEUR, MESURE CONTRE LA RFC 6238 ET NON CONTRE LUI-MEME. Un
      # TOTP maison peut etre parfaitement coherent et refuser tous les codes
      # que les applications d'authentification produisent — un pas de temps
      # decale, le bit de signe oublie. Les six vecteurs de la RFC repondent de
      # l'arithmetique ; le second banc repond du stockage, du rejeu, et de ce
      # qu'un appelant distrait obtient.
      #
      # LES TROIS BANCS CI-DESSUS N'ETAIENT DANS AUCUNE CI jusqu'au 2 septembre
      # 2026 au soir : 109 verifications que rien ne lançait. C'est le defaut
      # que ce fichier existe pour empecher — un filet qu'on ne leve jamais ne
      # garde rien — et il s'est glisse par le chemin le plus banal, trois
      # bancs neufs ecrits le meme jour.
      - name: Le second facteur, l'arithmetique
        run: python banc_mfa.py

      - name: Le second facteur, le stockage et la porte
        run: python banc_comptes.py

      # L'ENCODEUR QR, MESURE CONTRE SEGNO ET CONTRE L'ALGEBRE. Le depot n'a
      # aucune dependance, ni serveur ni page : le QR code de l'enrolement est
      # donc calcule par du Python nu ecrit ici. Un encodeur QR maison peut etre
      # parfaitement coherent avec lui-meme et produire une image qu'aucun
      # telephone ne lit — un masque mal choisi, un octet de correction dans le
      # mauvais ordre, un motif d'alignement a un pixel pres. Rien de tout cela
      # ne leve, et l'image ressemble a un QR code dans tous les cas.
      #
      # Ce banc compare les 6364 modules de quatre matrices produites par segno,
      # une implementation independante capturee le 3 septembre 2026
      # (etalons_qr.py) — meme raisonnement que les vecteurs de la RFC 6238 pour
      # le TOTP. Et il ne s'arrete pas la : il recalcule les syndromes de
      # Reed-Solomon avec sa PROPRE arithmetique, ce qui prouve les blocs de
      # correction sans rien connaitre de segno, et permettra d'ajouter un cas
      # sans etalon. Segno n'est pas au depot et n'y entrera pas.
      - name: Le QR code de l'enrolement, module par module
        run: python banc_qr.py

      # L'AGENT, QUI NE TOURNE PAS DANS LE STUDIO ET N'ETAIT DONC SOUS AUCUN
      # FILET. agent_noeud.py vit sur la machine a carte : il n'importe pas
      # serveur.py, aucun banc ne le copiait, et banc_mutations.py rendait
      # « MUTATION PERIMEE » aux deux mutations qui le visaient. On pouvait
      # couper « free_memory » du corps de /free — la moitie du garde-fou que
      # le studio ne peut pas tenir a sa place — et les dix-sept bancs
      # restaient verts.
      #
      # Il n'a aucune dependance et TROIS portes sur le monde : appeler() pour
      # le HTTP ordinaire, urllib.request.urlopen pour le depot multipart des
      # entrees, socket.create_connection pour la websocket de progression. Un
      # faux a ces trois endroits fait tourner le VRAI code contre un faux
      # ComfyUI et un faux studio. Cette ligne annonçait « une seule porte »,
      # recopiee de l'en-tete du banc : c'etait faux, et les deux portes
      # oubliees etaient justement celles par lesquelles l'agent ECRIT sur le
      # disque de la machine a carte.
      #
      # CE QU'IL COUVRE DEPUIS LE 3 SEPTEMBRE 2026 AU SOIR, dans l'ordre de la
      # consequence : la MISE A JOUR — le studio distribue le code de l'agent,
      # l'agent le telecharge et l'EXECUTE sur la machine de quelqu'un d'autre,
      # et ses trois gardes (empreinte epinglee, ast.parse, marqueur
      # anti-boucle) n'etaient pas exercees ; puis executer(), le depot des
      # entrees, le registre des sorties et la websocket de progression.
      # Aucun reseau, aucune carte, un quart de seconde.
      - name: L'agent de noeud, contre un faux ComfyUI
        run: python banc_agent.py

      # LES BOUTONS DE /admin, ET NON L'ETAT QU'ILS POSENT. Un releve du
      # 5 septembre 2026 a compte VINGT-DEUX routes sur soixante-quatre
      # qu'aucun banc ne nommait ; celles-ci agissent sur le parc — pause,
      # jeton d'une machine, retrait, pilotage de ComfyUI.
      #
      # La pause dit tout du manque : son EFFET etait mesure depuis longtemps
      # par banc_attente.py, mais a partir d'un registre ou l'on avait pose
      # « pause » a la main. Que le clic l'ECRIVE sur le disque — la seule
      # chose qui empeche un studio relance de reprendre la carte de quelqu'un
      # qui joue — n'etait garde par personne. C'est la lecon de
      # recette_chemin_page.py : un etat qu'on pose soi-meme n'est pas un
      # bouton qu'on clique.
      - name: Les boutons de la console d'administration
        run: python banc_console.py

      # SORTIR, CHANGER DE FIL, ET CE QU'UN INCONNU APPREND. Les trois routes
      # du meme releve que la page appelle — pas la console. Le cas qui les
      # justifie a lui seul : « sortir » efface le biscuit avec « path="/" », le
      # chemin ou la connexion l'a pose. Sans ce mot, le navigateur garde le
      # sien, la page affiche « deconnecte », et la requete suivante repart
      # connectee — le pire des deux etats.
      - name: La seance : sortir, changer de fil
        run: python banc_seance.py

      # LE POUCE, LE JOURNAL DES RETOURS, ET LE REENTRAINEMENT. Un pouce en bas
      # finit dans le corpus, et le bouton de /admin remplace le classifieur qui
      # decide de l'intention de CHAQUE demande. Un aiguilleur casse fait
      # derailler tout le studio, en silence.
      - name: Les avis, et le reentrainement de l'aiguilleur
        run: python banc_avis.py

      # CE QUI ENTRE, CE QUI SORT. /api/noeud/{quoi} sert aux machines le code
      # qu'elles vont EXECUTER ; /api/televerser accepte ce qu'on lui donne ;
      # /api/fichier ressert ce qui a ete produit. Trois protections
      # differentes, et aucune n'est un nettoyage de chemin : une liste blanche
      # exacte, un nom REGENERE — celui du client est jete —, et une liste
      # d'autorisation batie sur les conversations de l'appelant.
      - name: Les fichiers servis, deposes et resservis
        run: python banc_fichiers.py

      # LES SIX FONCTIONS QUE banc_agent.py A NOMMEES EN LAISSANT DEHORS. Son
      # en-tete les enumere : « boucle(), qui ne rend jamais la main […]
      # insister(), servir_le_langage(), trouver_ollama() et main() », plus
      # modeles_comfy(). Ce sont celles qui DECIDENT — boucle() prend le
      # travail, declare la machine occupee, livre les fichiers et choisit
      # l'instant ou l'agent se remplace ; insister() est tout ce qui separe un
      # rendu de trois minutes deja fait d'un « echec » affiche a
      # l'utilisateur ; main() est la porte de l'enrolement.
      #
      # « INJOIGNABLE D'ICI » ETAIT UNE CONCLUSION TROP RAPIDE, et c'est la
      # meme lecon que « une seule porte sur le monde » deux etapes plus haut :
      # banc_agent.py declarait la fermeture « dire » hors de portee, alors que
      # boucle() la PASSE a executer(), qui est un global du module. Elle est
      # exercee ici, frein de 1,5 s compris, avec sa regle « on ne jette pas un
      # rendu sur un doute ».
      #
      # Le monde est faux a quatre endroits — appeler(), le module time
      # (l'horloge est SIMULEE : insister() attend dix minutes pour de vrai),
      # threading, et PREMIERE_ANNONCE. Aucun reseau, aucune carte, aucun fil
      # reellement lance : un quart de seconde.
      - name: La boucle de l'agent, son horloge et sa porte d'entree
        run: python banc_boucle.py

      # LA MISE EN SERVICE D'UNE MACHINE, QUE « sh -n » CROYAIT GARDER. Le pas
      # « analyse syntaxique » ci-dessus lit noeud.sh sans jamais l'executer :
      # il ne peut donc pas voir une fonction DEFINIE DANS UNE BRANCHE NON
      # PRISE. C'est exactement ce qui s'y cachait — ecrire_reglages() etait
      # ecrite dans le « if [ -z "$JETON" ] » et appelee dehors, si bien que la
      # commande que /admin distribue (« bash noeud.sh --studio ... --jeton
      # ... ») lancait l'agent SANS configuration et echouait a tous les coups.
      # Toute premiere mise en service d'un noeud etait perdue ; les machines
      # deja enrolees survivaient parce que leur agent_noeud.json existait, et
      # c'est ce qui a cache le defaut. Aucun banc ne lancait ce fichier.
      #
      # Celui-ci le LANCE, contre un faux curl et un faux nvidia-smi poses en
      # tete de PATH, et il exige un TEMOIN : l'agent qu'il fait distribuer par
      # le faux studio ecrit ce qu'il a trouve dans agent_noeud.json. Un cas qui
      # verifierait seulement le code de sortie serait vrai d'un script qui ne
      # fait rien.
      #
      # Il lui faut bash — present sur cette image, et le banc ROUGIT plutot que
      # de se declarer vert s'il ne l'est pas. Les deux .bat, eux, ne peuvent pas
      # etre lances ici : cmd.exe n'est pas sur un runner Ubuntu, et le banc dit
      # lui-meme quelle moitie n'est alors qu'un releve de texte.
      - name: La mise en service d'une machine a carte, pour de vrai
        run: python banc_noeud.py

      # L'entrainement complet : trois centiemes de seconde, aucune dependance,
      # aucun reseau. On le lance d'abord pour son affichage — c'est lui qu'on
      # lira dans le journal de l'action quand un chiffre bougera.
      # conversations/ n'existe pas ici, donc aucune demande reelle n'est
      # moissonnee : la CI mesure le corpus du depot, et rien d'autre.
      - name: Entrainer l'aiguilleur
        run: python entrainer_aiguilleur.py

      # Le garde-fou qui compte. Les bancs ne sont JAMAIS appris ; leur justesse
      # est donc la seule mesure honnete de ce qu'un changement de corpus a
      # fait.
      #
      # Seuils retenus : 75 % de justesse globale, 80 % sur les cas tranches
      # d'office. Mesures actuelles : 94 % / 98 % sur banc_aiguillage.jsonl et
      # 86 % / 90 % sur banc_neuf.jsonl (les tournures indirectes, le banc dur).
      # Soit environ onze points de marge sous le banc le plus faible.
      #
      # POURQUOI si bas : un banc de 44 cas se deplace de 2,3 points des qu'une
      # seule demande change de camp. Un seuil colle a 85 % virerait au rouge au
      # premier exemple ajoute au corpus — et une CI qui rougit pour rien finit
      # par etre ignoree, ce qui la rend pire qu'absente. Ce seuil ne cherche
      # pas a defendre les 86 % : il cherche a attraper un effondrement (un
      # corpus tronque, une classe disparue, un classifieur casse), qui fait
      # tomber ces chiffres de dizaines de points, pas de deux.
      #
      # Les deux chiffres sont verifies separement parce qu'ils disent des
      # choses differentes : le premier mesure le classifieur, le second mesure
      # ce qu'on le laisse decider seul — les cas incertains, eux, partent au
      # modele de langage et ne coutent que du temps.
      - name: La justesse sur les bancs ne s'est pas effondree
        run: |
          python - <<'PY'
          import sys

          import entrainer_aiguilleur as e
          from aiguilleur import Aiguilleur

          SEUIL = 0.75          # justesse globale
          SEUIL_SUR = 0.80      # justesse sur les seuls cas tranches d'office

          # corpus() rend (exemples, du_reel) depuis qu'un entrainement melant des
          # demandes reelles ecrit dans un fichier separe. Ne pas le lire faisait
          # passer un tuple a apprendre() : la verification etait ROUGE a chaque
          # commit depuis, et personne ne regardait.
          exemples, _ = e.corpus()
          aiguilleur = Aiguilleur().apprendre(exemples)
          echec = False

          for nom in e.BANCS:
              banc = e._lire(nom)
              if not banc:
                  # Un banc absent est un echec, pas un succes silencieux :
                  # sans lui il n'y a plus rien qui mesure quoi que ce soit.
                  print(f"  BANC ABSENT  {nom}")
                  echec = True
                  continue
              bons, total, bons_surs, surs = e.mesurer(aiguilleur, banc)
              juste = bons / total
              juste_sur = bons_surs / max(surs, 1)
              ok = juste >= SEUIL and juste_sur >= SEUIL_SUR
              print(f"  {'ok      ' if ok else 'SOUS SEUIL'}  {nom} : "
                    f"{bons}/{total} justes ({juste:.0%}, seuil {SEUIL:.0%}) — "
                    f"tranches d'office {bons_surs}/{surs} "
                    f"({juste_sur:.0%}, seuil {SEUIL_SUR:.0%})")
              if not ok:
                  echec = True

          if echec:
              print("\n  La justesse est tombee sous le seuil. Si c'est voulu, "
                    "dis dans la pull request ce qu'on gagne en echange, et "
                    "deplace le seuil ici avec le chiffre qui le justifie.")
          sys.exit(1 if echec else 0)
          PY
