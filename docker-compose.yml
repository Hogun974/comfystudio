# ComfyStudio en conteneur.
#
# Trois facons de s'en servir, sans jamais modifier ce fichier :
#
#   docker compose up -d
#       Le studio seul. ComfyUI et Ollama tournent ailleurs — sur l'hote, ou
#       sur une autre machine. C'est le montage le plus frequent : la carte
#       graphique est deja prise par un ComfyUI qu'on ne veut pas deranger.
#
#   docker compose --profile complet up -d
#       Le studio, ComfyUI et Ollama, ensemble. Exige une carte NVIDIA et le
#       nvidia-container-toolkit sur l'hote (voir plus bas).
#
#   docker compose --profile moteur up -d
#       Le studio et ComfyUI, sans Ollama : pour qui pilote le studio avec une
#       cle d'API plutot qu'un modele local.
#
# Les reglages se font dans un fichier .env a cote de celui-ci — copier
# .env.exemple en .env et l'ajuster. Aucune raison d'editer ce YAML.

services:
  comfystudio:
    build:
      context: .
      args:
        # QUELLE VERSION L'IMAGE PORTE. Un conteneur ne peut pas la mesurer :
        # « .git/ » est dans .dockerignore et doit y rester. Sans cet argument,
        # le studio annonce « inconnue » — honnete, mais inutilisable dans un
        # rapport de bogue. Cable ici, il suffit de le poser devant la commande
        # d'installation du README, qui construit et demarre d'un seul geste :
        #
        #   VERSION=$(git rev-parse --short HEAD) docker compose up -d --build
        #
        # « docker compose up --build » n'accepte pas « --build-arg » : sans
        # cette ligne, il fallait construire en deux temps pour nommer sa
        # version, et personne ne l'aurait fait.
        VERSION: "${VERSION:-}"
    # Le nom et le tag se laissent changer. Figes, ils rendaient toute seconde
    # installation impossible sur la meme machine : « docker compose -p autre »
    # ne les touche pas, et un « --build » naif retaguait l'image d'un studio EN
    # SERVICE. Constate en installant a blanc a cote du studio du reseau.
    image: "${STUDIO_IMAGE:-comfystudio:latest}"
    container_name: "${STUDIO_NOM:-comfystudio}"
    restart: unless-stopped
    ports:
      - "${STUDIO_PORT:-8199}:8199"
    environment:
      # Par defaut, ComfyUI et Ollama sont cherches sur la machine hote.
      # AVEC les profils « complet » ou « moteur », il faut les faire pointer
      # sur les conteneurs voisins — Compose ne sait pas changer une valeur
      # selon le profil actif. Deux lignes a decommenter dans .env, c'est dit
      # dans .env.exemple.
      COMFY_URL: "${COMFY_URL:-http://host.docker.internal:8188}"
      OLLAMA_URL: "${OLLAMA_URL:-http://host.docker.internal:11434}"
      STUDIO_HOTE: "0.0.0.0"
      # Connexion obligatoire par defaut : le conteneur publie un port, et une
      # installation neuve resterait sinon ouverte a qui l'atteint. « libre »
      # retablit l'ancien comportement, en connaissance de cause.
      STUDIO_AUTH: "${STUDIO_AUTH:-}"
      # Mot de passe du compte « admin » cree au premier demarrage. Sans lui il
      # est tire au sort et affiche UNE fois dans le journal du conteneur — ce
      # qui est facile a manquer. A changer depuis l'interface ensuite.
      STUDIO_ADMIN_MDP: "${STUDIO_ADMIN_MDP:-}"
      STUDIO_LLM: "${STUDIO_LLM:-}"
      STUDIO_VISION: "${STUDIO_VISION:-}"
      STUDIO_LLM_ECRITURE: "${STUDIO_LLM_ECRITURE:-}"
      # Le conteneur ecoute TOUJOURS sur 8199 ; c'est le compose qui publie ce
      # port ailleurs. Sans cette ligne, la banniere de demarrage annonçait 8199
      # alors que le studio repond sur STUDIO_PORT — et sur une machine qui en
      # heberge deja un, cette adresse repond : c'est le studio d'a cote. On lui
      # dit donc sur quel port l'hote le publie.
      STUDIO_PORT_HOTE: "${STUDIO_PORT:-8199}"
      # Le reste des reglages du studio. Compose ne transmet QUE ce qui est
      # nomme ici : sans ces lignes, une variable posee dans .env etait lue par
      # le studio hors conteneur et ignoree en silence dedans — le pire des
      # deux, parce que la documentation la donnait pour reconnue.
      # Vide = le studio garde sa propre valeur par defaut ; chaque lecture
      # dans serveur.py le prevoit.
      STUDIO_TRAVAILLEURS: "${STUDIO_TRAVAILLEURS:-}"
      STUDIO_ATTENTE_CARTE: "${STUDIO_ATTENTE_CARTE:-}"
      STUDIO_PAUSE_PROPOSE: "${STUDIO_PAUSE_PROPOSE:-}"
      STUDIO_ARMEE_HEURES: "${STUDIO_ARMEE_HEURES:-}"
      STUDIO_VRAM_REPOS: "${STUDIO_VRAM_REPOS:-}"
      STUDIO_PLAFOND_NUAGE: "${STUDIO_PLAFOND_NUAGE:-}"
      STUDIO_ANALYSE_PETITE: "${STUDIO_ANALYSE_PETITE:-}"
      STUDIO_ANALYSE_MAX: "${STUDIO_ANALYSE_MAX:-}"
      STUDIO_LLM_GARDER: "${STUDIO_LLM_GARDER:-}"
      STUDIO_PURGE_ORPHELINS: "${STUDIO_PURGE_ORPHELINS:-}"
      STUDIO_ADMIN: "${STUDIO_ADMIN:-}"
      # Ces trois-la ne servent QU'AVEC le montage /comfy plus bas ; les
      # chemins sont ceux vus du conteneur.
      COMFY_MODELES: "${COMFY_MODELES:-}"
      COMFY_ENTREE: "${COMFY_ENTREE:-}"
      COMFY_LANCEUR: "${COMFY_LANCEUR:-}"
    extra_hosts:
      # Necessaire sous Linux ; sans effet sous Docker Desktop, qui le fournit.
      - "host.docker.internal:host-gateway"
    volumes:
      # Conversations, comptes, cles d'API, registre des televersements : sans
      # ce volume, tout disparait au redemarrage du conteneur.
      - comfystudio-donnees:/donnees
      # Si ComfyUI tourne sur la MEME machine mais HORS conteneur, monter son
      # dossier permet au studio d'y telecharger les modeles manquants et d'y
      # ecrire les images d'entree. Sans ce montage, le studio le traite comme
      # une machine distante : tout passe par HTTP, et les modeles s'installent
      # a la main. L'image pose COMFY_DIR=/comfy, monter le dossier entier
      # suffit — models/ et input/ en decoulent. A decommenter et adapter :
      # - /chemin/vers/ComfyUI:/comfy

  # ── ComfyUI, pour les profils « complet » et « moteur » ─────────────────
  #
  # Exige le nvidia-container-toolkit sur l'hote, sans quoi la carte n'est pas
  # visible du conteneur :
  #   sudo apt install nvidia-container-toolkit
  #   sudo nvidia-ctk runtime configure --runtime=docker
  #   sudo systemctl restart docker
  comfyui:
    profiles: ["complet", "moteur"]
    build:
      context: .
      dockerfile: Dockerfile.comfyui
      args:
        # ATTENTION, mesure du 29 aout 2026 : la roue cu128 ne contient QUE
        # sm_75 et au-dela. Une GTX 10xx (Pascal, sm_61) rend alors « no kernel
        # image is available for execution on the device » a la premiere
        # generation — la carte est vue, le conteneur demarre, et rien ne
        # fonctionne. cu126 embarque sm_50 a sm_90 et couvre ces cartes.
        #   cu128  RTX 20xx et plus recentes
        #   cu126  GTX 10xx / TITAN X (Pascal), et tout ce qui precede la RTX
        #   cpu    sans carte : demarre et repond, mais genere tres lentement
        ROUE: "${ROUE:-cu128}"
    image: "${COMFY_IMAGE:-comfystudio-comfyui:latest}"
    container_name: "${COMFY_NOM:-comfyui}"
    restart: unless-stopped
    ports:
      - "${COMFY_PORT:-8188}:8188"
    environment:
      # Sur une petite carte : --lowvram sous 8 Go, --novram sous 4 Go.
      COMFY_ARGS: "${COMFY_ARGS:-}"
    volumes:
      - comfyui-modeles:/opt/ComfyUI/models
      - comfyui-entrees:/opt/ComfyUI/input
      - comfyui-sorties:/opt/ComfyUI/output
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  # ── Ollama, pour le profil « complet » ──────────────────────────────────
  #
  # Inutile si le studio est pilote par une cle d'API : dans ce cas, le profil
  # « moteur » suffit et l'on economise plusieurs gigaoctets.
  ollama:
    profiles: ["complet"]
    image: ollama/ollama:latest
    container_name: "${OLLAMA_NOM:-ollama}"
    restart: unless-stopped
    ports:
      - "${OLLAMA_PORT:-11434}:11434"
    volumes:
      - ollama-modeles:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  comfystudio-donnees:
  comfyui-modeles:
  comfyui-entrees:
  comfyui-sorties:
  ollama-modeles:
