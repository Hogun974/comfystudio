/* Les reglages restent replies, mais jamais silencieux : ce qui s'ecarte du
   defaut s'affiche en clair, et se retire d'un clic. Un reglage applique sans
   etre visible donne le sentiment de ne pas etre ecoute.

   LE LIBELLE COURT EST UN ATTRIBUT, PAS UN MORCEAU DU LIBELLE VISIBLE. Chaque
   entree portait son propre lecteur, et trois d'entre eux decoupaient le texte
   affiche d'une <option> sur le tiret cadratin : « o.textContent.split(" — ")
   [0] ». Le separateur d'un texte d'interface devenait ainsi le contrat d'un
   bout de code, sans que rien ne le dise nulle part — reformuler « rapide —
   moins d'étapes », ou l'ecrire avec un tiret ordinaire, et la pastille
   affichait la phrase entiere en silence.

   Plus de lecteur par entree, donc : un seul, courtDe(), et l'attribut
   « data-court » que chaque option porte (voir les menus, plus haut). Les deux
   menus construits en JavaScript le posent depuis le titre que le serveur SERT
   — /api/modeles, /api/machines — au lieu de redecouper ce qu'ils viennent
   d'assembler. banc_page.py exige les deux moities : l'attribut sur toute
   option qui porte une valeur, et une lecture qui ne recoupe plus rien. */
const REGLAGES = [
  // « nom » est une CLE du dictionnaire, plus un mot francais : la pastille
  // ecrivait « moteur FLUX.1 » avec le mot recopie ici, dans du code
  // d'interface.
  { sel: "#forcer", nom: "page.moteur" },
  { sel: "#machine", nom: "page.machine" },
  { sel: "#priorite", nom: "" },
  { sel: "#taille", nom: "" },
  // « geste » : ce menu-ci ne s'ecrit PAS sur la conversation. Il n'a ni entree
  // dans MENU_REGLAGE ni dans CLE_REGLAGE — les envoyer a
  // /api/conversation/{cid}/reglages serait poster une cle que le serveur ne
  // lit pas, et le murmure promis ne viendrait jamais. Il est ici pour une
  // seule raison : la pastille. Sans elle, « 4 variantes » ne se verrait que
  // le tiroir ouvert, et le tiroir est replie par defaut — on repartirait en
  // quatre exemplaires sans rien voir venir, ce qui est exactement le degat
  // que le serveur refuse de retenir sur la conversation.
  { sel: "#variantes", nom: "", geste: true },
];

/* Le libelle court d'une option. Le repli sur le libelle entier n'est pas une
   tolerance : c'est le seul comportement qui ne MENTE pas quand l'attribut
   manque. Une pastille vide dirait « aucun reglage actif », ce qui est faux, et
   c'est exactement le genre de silence qu'on ferme ici ; le libelle entier,
   lui, est laid et se voit. banc_page.py rougit sur l'attribut manquant, de
   sorte que ce repli ne serve jamais. */
function courtDe(o) {
  return (o && (o.dataset.court || o.textContent)) || "";
}

function peindreActifs() {
  const zone = document.querySelector("#actifs");
  zone.innerHTML = "";
  for (const r of REGLAGES) {
    const el = document.querySelector(r.sel);
    if (!el || !el.value) continue;
    const mot = document.createElement("span");
    mot.className = "oter";
    mot.textContent = (r.nom ? T(r.nom) + " " : "") + courtDe(el.selectedOptions[0]);
    mot.title = T("page.actifs.oter");
    mot.onclick = () => { el.value = ""; accorderTaille(); peindreActifs();
                          if (!r.geste) retenirReglages(CLE_REGLAGE[r.sel]); };
    zone.appendChild(mot);
  }
}
/* Choisir dans un menu, c'est deja decider : le reglage part tout de suite sur
   la conversation, sans attendre qu'une demande soit envoyee. Sans cette route,
   on ouvrait le tiroir, on prenait FLUX.1 en 1920x1080, on passait voir une
   autre conversation, et le choix n'existait plus au retour. */
/* La valeur d'un reglage, lue dans SON menu. Elle etait tiree de
   reglagesDemandes(), qui ne porte plus les reglages depuis qu'ils vivent sur
   la conversation : « modele », « taille » et « noeud » y valaient donc
   « undefined », JSON.stringify les supprimait, le serveur recevait un corps
   vide — rien n'etait retenu et rien n'etait murmure. Seule la priorite
   survivait, parce qu'elle etait ajoutee a part. Constate par l'utilisateur :
   « il n'y a que priorite soigne qui est apparu dans le chat ».

   Et reglagesDemandes() remet « moteurChoisi » a faux au passage : chaque
   changement de menu CONSOMMAIT donc le drapeau avant que la demande puisse
   s'en servir. Un effet de bord n'a rien a faire dans une lecture. */
const MENU_REGLAGE = { modele: "#forcer", noeud: "#machine",
                       priorite: "#priorite", taille: "#taille" };

function valeurReglage(cle) {
  const el = $(MENU_REGLAGE[cle]);
  if (!el) return null;
  return el.value || null;
}

function retenirReglages(cle) {
  if (!convActive) return;
  // SEULEMENT LA CLE QUI VIENT DE CHANGER. Envoyer les quatre a chaque geste
  // faisait deux degats : un second onglet reste ouvert sur la meme
  // conversation effaçait le moteur regle depuis le premier — le serveur
  // raisonne sur la PRESENCE, et une cle presente et vide efface — et il
  // ecrivait un murmure « moteur : automatique » que personne n'avait demande.
  const corps = cle
    ? { [cle]: valeurReglage(cle) }
    : Object.fromEntries(Object.keys(MENU_REGLAGE).map(k => [k, valeurReglage(k)]));
  reglagesVoulus = { ...reglagesVoulus, ...corps };
  const ou = convActive;
  reglageEnVol = fetch("/api/conversation/" + ou + "/reglages", {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(corps)
  }).then(r => r.json()).then(d => {
    // Seulement si l'on est encore dans la meme conversation : le murmure
    // appartient a celle qu'on reglait, pas a celle qu'on regarde.
    if (d && d.murmure && ou === convActive) { ajouterMurmure(d.murmure); auBas(); }
  }).catch(() => {});   // du confort : la demande les reporte de toute facon
}

const CLE_REGLAGE = { "#forcer": "modele", "#machine": "noeud",
                      "#priorite": "priorite", "#taille": "taille" };
REGLAGES.forEach(r => {
  const el = document.querySelector(r.sel);
  if (el) el.addEventListener("change", () => {
    if (r.sel === "#forcer") moteurChoisi = true;
    peindreActifs();
    // Un geste ne s'ecrit pas sur la conversation : CLE_REGLAGE[r.sel] vaudrait
    // « undefined », et retenirReglages(undefined) renvoie les QUATRE reglages
    // d'un coup — c'est-a-dire le degat que la table a ete decoupee pour
    // eviter, declenche par un menu qui n'a rien a voir.
    if (!r.geste) retenirReglages(CLE_REGLAGE[r.sel]);
  });
});
document.querySelector("#plier").onclick = e => {
  const outils = document.querySelector("#outils");
  const ouvert = outils.classList.toggle("replie") === false;
  e.target.classList.toggle("ouvert", ouvert);
  e.target.setAttribute("aria-expanded", String(ouvert));
};
/* La taille ne s'applique qu'aux images : la laisser active pour un moteur
   audio ou vidéo ferait croire que la consigne est prise en compte. */
const SANS_TAILLE = ["wan5b", "wan14b", "audio", "audioplus", "edition", "objet3d"];
function accorderTaille() {
  const m = $("#forcer").value;
  const inerte = SANS_TAILLE.includes(m);
  $("#taille").disabled = inerte;
  $("#taille").title = inerte ? T("page.taille.inerte") : "";
}
$("#forcer").addEventListener("change", accorderTaille);
PRET.then(accorderTaille);

PRET.then(peindreActifs);

/* Le champ grandit en tapant. La fonction existait, mais plus rien ne
   l'appelait a la frappe : elle ne jouait qu'a l'ouverture d'une conversation,
   et le champ restait sur une ligne quelle que soit la longueur du texte. */
$("#txt").addEventListener("input", ajuster);
ajuster();

/* Le compteur de l'en-tete, et le releve des demandes armees qui va avec.
   Appele tout de suite ET toutes les 2,5 s : la premiere passe attendait le
   premier tour de minuteur, si bien qu'une page rechargee sur une demande armee
   la montrait « en cours », chronometre qui monte, pendant deux secondes et
   demie — juste assez pour la lire et la croire. */
async function releverFile() {
  try {
    const f = await (await fetch("/api/file")).json();
    // « occupe ? 1 : 0 » etait juste du temps ou un seul travail pouvait
    // courir. Depuis qu'il y en a plusieurs, le compteur annonçait « 1 en file »
    // pendant que le panneau en montrait trois.
    const n = (f.en_attente || 0) + (f.en_vol || 0);
    const moi = f.a_moi || 0;
    // Les demandes armees ne sont NI dans la file NI sur une carte : elles
    // attendent le retour d'une machine en pause, pendant des heures. Le
    // compteur les ignorait, donc il restait vide — et comme c'est lui qui
    // ouvre le panneau, et le panneau qui porte le bouton « retirer », une
    // demande armee toute seule etait invisible ET irretirable jusqu'au
    // lendemain. Le serveur sert « armees » exactement pour cette ligne.
    const dort = f.armees || 0;
    // Le ⏸ plutot qu'une phrase : c'est le signe que la meme demande porte deja
    // a la place de son rang dans le panneau, et l'en-tete tient sur une ligne
    // de telephone.
    const bouts = [];
    if (n) bouts.push(T("page.file.compteur", { n }));
    if (dort) bouts.push(`⏸ ${dort}`);
    if (moi && moi < n + dort) bouts.push(T("page.file.a_moi", { n: moi }));
    const etat = $("#etatFile");
    etat.innerHTML = bouts.length
      ? `<span class="file-vive">${ech(bouts.join(" · "))}</span>` : "";
    // « demande(s) attendent » : la page ecrivait les parentheses. La regle
    // du pluriel appartient a la langue.
    etat.title = dort ? T("page.file.armees.title", { n: dort }) : "";
    // Releve au passage : la bulle de la conversation s'en sert pour ne pas
    // faire courir un chronometre sur une demande qui ne calcule pas.
    armees.clear();
    for (const l of f.lignes || []) if (l.armee) armees.set(l.tid, l.reste_h || 0);
  } catch (e) { /* sans effet */ }
}
PRET.then(() => { releverFile(); setInterval(releverFile, 2500); });

/* ── tiroir des conversations sur petit ecran ──────────────────────
   La barre laterale etait simplement masquee sous 820 px : sur telephone,
   ni la liste des conversations, ni le bouton d'en creer une, ni l'etat du
   moteur n'etaient atteignables. */
const basculerTiroir = ouvrir =>
  document.body.classList.toggle("ouvert",
    ouvrir === undefined ? !document.body.classList.contains("ouvert") : ouvrir);
$("#tiroir").onclick = () => basculerTiroir();
$("#voile").onclick = () => basculerTiroir(false);

$("#img").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  $("#alerte").textContent = "";
  try {
    const fd = new FormData(); fd.append("f", f);
    const r = await fetch("/api/televerser", { method: "POST", body: fd });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.image) throw new Error(d.erreur || T("page.televerser.echec"));
    imageJointe = d.image;
    if (apercuURL) URL.revokeObjectURL(apercuURL);
    apercuURL = URL.createObjectURL(f);
    // Une video dans une balise <img> ne montre rien : chaque famille a son
    // apercu, et un signe suffit pour un son qu'on ne regarde pas.
    const zone = $("#apercu-zone");
    zone.innerHTML = "";
    if (EXT_VID.test(f.name)) {
      const v = document.createElement("video");
      v.src = apercuURL; v.muted = true; zone.appendChild(v);
    } else if (EXT_SON.test(f.name)) {
      zone.innerHTML = '<span class="genre">\u266A</span>';
    } else {
      const i = document.createElement("img");
      i.src = apercuURL; i.alt = T("page.apercu.alt"); zone.appendChild(i);
    }
    $("#nomimg").textContent = f.name;
    $("#jointe").style.display = "flex";
  } catch (err) {
    detacher();
    $("#alerte").textContent = T("page.joindre.echec", { quoi: err.message });
  }
};
function detacher() {
  imageJointe = null;
  if (apercuURL) { URL.revokeObjectURL(apercuURL); apercuURL = null; }
  $("#apercu-zone").innerHTML = "";
  $("#jointe").style.display = "none";
  $("#img").value = "";
}
$("#retirer").onclick = detacher;

/* Un seul chemin d'envoi pour la fleche et pour « brouillon » : seule la
   priorite change. Deux copies auraient diverge des la premiere correction —
   c'est deja arrive avec la reponse a une precision, qui a longtemps oublie la
   taille choisie. */
/* Ce qu'une demande emporte, ecrit UNE fois.

   Le formulaire de reponse a une precision n'envoyait que la taille et la
   priorite : le moteur impose et la machine choisie disparaissaient des qu'on
   repondait a une question. Deux chemins d'envoi, deux listes de champs, et la
   seconde avait oublie la moitie de la premiere. Il n'y en a plus qu'une.

   Le serveur les retient sur la conversation : une demande qui tait un reglage
   herite du sien. Envoyer les quatre a chaque fois reste le bon geste — c'est
   ce que l'utilisateur a sous les yeux qui fait foi. */
function reglagesDemandes() {
  // PLUS LES REGLAGES. Ils vivent sur la conversation, et le menu les y pose
  // des qu'il change. Les repeter dans la demande refaisait le degat qu'on
  // croyait avoir ferme : le serveur raisonne sur la PRESENCE, donc un second
  // onglet reste ouvert avec ses menus d'avant effaçait le moteur du premier —
  // simplement au moment d'envoyer un message au lieu de bouger un menu. Ne
  // part ici que ce qui appartient a CETTE demande.
  const c = { modele_choisi: moteurChoisi };
  moteurChoisi = false;
  // LE NOMBRE DE VARIANTES PART ICI, avec les deux chemins d'envoi a la fois.
  // Le menu ne le pose pas sur la conversation — le serveur ne le retient pas —
  // donc s'il ne partait pas dans le corps, il ne partirait nulle part.
  // Absent quand le menu est sur « une seule » : le serveur traite le champ
  // absent, la chaine vide et zero comme « une seule » sans message, mais un
  // corps qui ne dit rien est ce qu'envoie une demande ordinaire, et c'est ce
  // qu'on veut envoyer.
  const n = parseInt($("#variantes").value, 10);
  if (n > 1) c.variantes = n;
  return c;
}

/* Remet les menus dans l'etat de la conversation ouverte. Une conversation
   travaille en FLUX.1 1920x1080, une autre en RealVis 1024x720 : les menus
   etaient a la fenetre, donc partages par toutes, et changer de conversation
   emportait le reglage de la precedente. */
let reglagesVoulus = {};
// Le moteur a-t-il ete choisi POUR LA PROCHAINE DEMANDE ? Seule la page le
// sait : le menu poste son reglage des qu'il change, donc au moment de
// l'envoi la conversation porte deja la valeur et le serveur ne peut plus
// distinguer « choisi » de « herite ». Pose au changement, efface a l'envoi.
let moteurChoisi = false;
// La derniere ecriture de reglage en vol. La demande l'attend : sans cela une
// demande envoyee dans la foulee d'un changement de menu partait avec l'ancien
// reglage de la conversation.
let reglageEnVol = null;
function poserReglages(r) {
  reglagesVoulus = r || {};
  const mettre = (sel, val) => {
    const el = $(sel);
    if (!el) return;
    const v = val || "";
    // Le menu des moteurs se remplit apres coup : tant que l'option n'existe
    // pas, on ne pose rien plutot que d'ecraser par du vide — poserReglages est
    // rappele quand la liste arrive.
    if (!v || [...el.options].some(o => o.value === v)) el.value = v;
  };
  mettre("#forcer", reglagesVoulus.modele);
  // PLUS DE REPLI SUR LE NAVIGATEUR. Une machine memorisee dans le
  // localStorage remontait dans les menus, puis dans le corps de la demande, et
  // la conversation se voyait epingler une machine que personne n'avait choisie
  // pour elle — avec un murmure « machine : PC » comme si c'etait une decision,
  // et un echec le jour ou cette machine est eteinte. Depuis que les reglages
  // appartiennent a la conversation, une conversation neuve part sur
  // « automatique », et c'est la reponse la moins surprenante.
  mettre("#machine", reglagesVoulus.noeud);
  mettre("#priorite", reglagesVoulus.priorite);
  mettre("#taille", reglagesVoulus.taille);
  // accorderTaille() est cable sur l'evenement « change » du menu des moteurs,
  // et poser .value par programme ne le declenche pas. Sans cet appel, une
  // conversation quittee sur « Wan 5B » — qui grise les tailles — laissait le
  // menu des tailles grise dans la conversation SUIVANTE, dont le moteur est
  // pourtant « automatique ». Il fallait changer de moteur et revenir pour le
  // debloquer.
  if (typeof accorderTaille === "function") accorderTaille();
  if (typeof peindreActifs === "function") peindreActifs();
}

async function lancerDemande(priorite) {
  const texte = $("#txt").value.trim();
  if (!texte && !imageJointe) return;
  $("#alerte").textContent = "";
  const monConv = convActive;
  ajouterDemande(texte);
  const bloc = ajouterReponse();
  auBas();
  $("#txt").value = ""; ajuster();
  try {
    // Le reglage qu'on vient de changer doit etre arrive avant la demande,
    // sinon elle part avec celui d'avant.
    if (reglageEnVol) { try { await reglageEnVol; } catch (e) {} }
    const r = await fetch("/api/generer", {
      method: "POST", headers: { "Content-Type": "application/json" },
      // « priorite » N'EST PAS un reglage de la demande : il vit sur la
      // conversation comme les trois autres, et le menu l'y pose des qu'il
      // change. L'envoyer ici refaisait le degat qu'on croyait ferme pour
      // « modele », « taille » et « noeud » — le serveur raisonne sur la
      // PRESENCE, donc un second onglet reste ouvert avec ses menus d'avant
      // effaçait le cran du premier, simplement en envoyant un message. Il ne
      // part que quand il vaut pour CETTE demande, c'est-a-dire au brouillon.
      body: JSON.stringify({ texte, image: imageJointe,
                             ...(priorite ? { priorite } : {}),
                             ...reglagesDemandes(), conversation: monConv })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.id) throw new Error(d.erreur || T("page.refus.demande"));
    if (priorite === "brouillon") esquissesLancees.add(d.id);
    detacher();
    // La conversation remonte tout de suite : le tour est deja enregistre cote
    // serveur, et attendre la fin du rendu laissait croire que rien n'etait
    // parti.
    listerConversations();
    suivre(d.id, bloc, monConv);
  } catch (err) {
    garnirReponse(bloc, { etat: ETAT.erreur, erreur: err.message, fichiers: [] });
    $("#alerte").textContent = err.message;
    auBas();
  }
}
// Rien a passer : le cran choisi dans le menu est deja sur la conversation.
$("#go").onclick = () => lancerDemande(null);
// Le brouillon l'emporte sur le cran de priorite choisi dans les reglages : on
// vient de le demander explicitement, c'est le geste le plus recent.
$("#lancerBrouillon").onclick = () => lancerDemande("brouillon");

/* LE DEVIS, ET LE CHAMP PAR LEQUEL LE STUDIO LE DONNE.

   Le studio l'annonce des qu'il a retenu une machine : la mediane de ses
   rendus comparables (duree_typique, serveur.py — rien du tout en dessous de
   trois mesures). Elle n'apparaissait que dans le depliant « details », ferme
   — c'est-a-dire nulle part au moment ou la question se pose, devant la barre
   qui avance.

   ELLE ETAIT RELUE DANS LA PHRASE DU JOURNAL, par une expression reguliere sur
   « d'apres tes 6 rendus precedents, compte 4 min », avec son
   « parseFloat(m[1].replace(",", ".")) » pour la virgule decimale française.
   Le contrat etait donc un texte ecrit pour l'oeil : muet a la premiere
   reformulation, et surtout FAUX de naissance, puisque la phrase arrondit —
   « compte 2 min » pour une mediane de 90 s faisait afficher 120 s, soit 33 %
   de trop. Le seuil des minutes avait du etre repousse a 300 s
   (DEVIS_EN_SECONDES_JUSQUA, serveur.py) rien que pour borner cet ecart a
   9,1 %.

   /api/etat sert le chiffre depuis le debut, et il porte meme le mot a mot :
   { secondes, mesures, mot, rendus, total_s }. On lit le champ. Aucun arrondi,
   aucune arithmetique, aucune phrase.

   Declare ici et nomme : banc_variantes.py releve CETTE ligne pour savoir quel
   champ exiger de la route, exactement comme banc_refaire.py releve
   MARQUE_DEJA. Le jour ou ce nom change d'un cote seulement, le banc rougit au
   lieu de laisser la pastille disparaitre en silence. */
const MARQUE_DEVIS = "devis";

/* Le devis de CETTE demande, ou null. « secondes » ET « mot » : le premier
   decide de « plus long que d'habitude », le second s'affiche. Un champ a
   moitie ecrit mettrait « ≈ undefined » a cote de la barre, ce qui est pire
   que pas de pastille. */
function lireDevis(t) {
  const d = (t || {})[MARQUE_DEVIS];
  return d && d.secondes && d.mot ? d : null;
}

/* Le seul recours sur une demande armee, pose la ou l'utilisateur regarde. Le
   panneau de file en a un depuis toujours, mais il faut l'ouvrir, et l'on n'y
   pense pas quand on attend devant sa bulle. */
function boutonRetirerArmee(id) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "retirer-armee";
  b.textContent = T("page.retirer");
  b.title = T("page.retirer_armee.title");
  b.onclick = async () => {
    b.disabled = true;
    try {
      await fetch("/api/file/" + encodeURIComponent(id),
                  { method: "DELETE", credentials: "same-origin" });
      // Rien a repeindre ici : le sondage voit l'etat « erreur » au tour
      // suivant et garnit la bulle avec « retiree de la file », bouton
      // « relancer » compris.
    } catch (e) { b.disabled = false; }
  };
  return b;
}

/* Le champ par lequel le studio dit « cet arret est une PROMESSE, pas un fait
   — une ligne viendra le confirmer », et le SEUL contrat de ce cas-la. Il a
   remplace un test sur le TEXTE du message — « /^arret demande a /.test(
   t.erreur) » — pire encore que celui du « deja refait » : le texte teste
   venait d'etre ECRASE deux lignes plus haut par la derniere ligne du journal,
   si bien que le contrat traversait deux fichiers ET une substitution.
   Reformuler la phrase de serveur.py, ou seulement journaliser une ligne de
   plus apres elle, coupait la relecture differee en silence — et la bulle
   restait sur « arret demande » pendant que la carte du NAS s'arretait pour de
   bon. C'est le mensonge du 29 aout, pris par l'autre bout.

   Declare ici et nomme : banc_variantes.py releve CETTE ligne pour savoir quel
   champ exiger de DELETE /api/file/{tid}, comme banc_refaire.py releve
   MARQUE_DEJA. */
const MARQUE_ARRET_DIFFERE = "arret_differe";

/* LE CHAMP PAR LEQUEL LE STUDIO DIT CE QUI A ECHOUE, ET DANS QUELLE LANGUE LE
   DIRE. La bulle affichait la DERNIERE LIGNE DE JOURNAL apres une panne —
   « if (t.etat === "erreur" && derniere) t.erreur = derniere.msg » — c'est-a-
   dire que ce que l'utilisateur lit apres un echec n'etait pas un message
   d'API mais du journal, et le journal ne se traduit pas : il est ECRIT, garde
   sur la tache, relu plus tard par quelqu'un d'autre (docs/plusieurs-langues.md).

   Le serveur pose donc, A COTE de la ligne francaise, une MARQUE :
   { "cle": "panne.…", "valeurs": { … } } — serveur.MARQUE_PANNE, et /api/etat
   la sert telle quelle. rendrePanne() la met en phrase, et traductions.rendre()
   est cette meme lecture ecrite en Python : c'est la specification, et
   banc_traductions.py l'exerce sans navigateur.

   Declare ici et nomme, comme MARQUE_DEJA, MARQUE_DEVIS et
   MARQUE_ARRET_DIFFERE : le jour ou ce nom change d'un cote seulement, un banc
   rougit au lieu de laisser la bulle se vider. */
const MARQUE_PANNE = "panne";

/* Le sondage est indexe par tache : plusieurs demandes peuvent courir
   en parallele, y compris dans des conversations differentes. */
function suivre(id, bloc, cid) {
  const depart = Date.now();
  // L'instant ou le devis est apparu, et non « depart » : entre les deux il y a
  // la file et l'analyse, qui ne sont pas comptees dans la mediane. Compare a
  // depart, un rendu parti quatrieme aurait ete declare « plus long que
  // d'habitude » avant meme d'avoir commence.
  let vuDevis = 0;
  const ancien = suivis.get(id);
  if (ancien) { clearInterval(ancien.minuteur); suivis.delete(id); }
  const minuteur = setInterval(async () => {
    try {
      const r = await fetch("/api/etat/" + id);
      if (!r.ok) throw new Error(T("page.tache.inconnue"));
      const t = await r.json();
      if (!Array.isArray(t.etapes)) throw new Error(T("page.reponse.inattendue"));
      const visible = cid === convActive && document.body.contains(bloc);

      if (visible && t.etat === ETAT.cours && armees.has(id)) {
        // ARMEE : ni dans la file, ni sur une carte. Le chronometre et la
        // derniere ligne de journal n'ont plus rien a dire — ils diraient meme
        // le contraire de ce qui se passe. On repeint la pastille une seule
        // fois : le bouton « retirer » se trouverait sinon remplace toutes les
        // 1,2 s, et un clic tombe entre deux remplacements ne part jamais.
        const puces = bloc.querySelector(".bandeau-tech");
        let p = puces.querySelector(".puce.armee");
        if (!p) {
          puces.innerHTML = (esquissesLancees.has(id)
              ? `<span class="puce esquisse">${ech(T("page.brouillon"))}</span>` : "")
            + '<span class="puce armee"></span>';
          p = puces.querySelector(".puce.armee");
          puces.appendChild(boutonRetirerArmee(id));
        }
        const h = armees.get(id) || 0;
        // « encore 11 h » : sans cela, « attend une machine » ne dit pas si
        // l'on parle de dix minutes ou d'une nuit — donc pas si l'on peut
        // aller se coucher. Meme formulation que dans le panneau de file, et
        // desormais le meme calcul : dureeRestante() etait recopie ici.
        p.textContent = T("page.armee.attend")
          + (h > 0 ? " — " + T("page.armee.reste", { duree: dureeRestante(h) }) : "");
      } else if (visible && t.etat === ETAT.cours) {
        const derniere = t.etapes[t.etapes.length - 1];
        const puces = bloc.querySelector(".bandeau-tech");
        // Le pourcentage existait deja — dans le panneau de file, qu'il faut
        // ouvrir. Ici, la bulle n'affichait que la derniere ligne de journal :
        // « travail confie a NAS ZimaOS — en attente de sa reponse », figee 150
        // des 157 secondes d'un rendu mesure. On voyait un studio en panne.
        //
        // Les secondes ecoulees s'affichent MEME sans pourcentage : les 27
        // premieres secondes n'en ont pas, et un ecran ou rien ne bouge est
        // exactement ce qui fait recharger la page au milieu d'un rendu.
        const pct = t.avance && t.avance.total
          ? Math.round(t.avance.fait * 100 / t.avance.total) : null;
        // LE COMPTE VIENT DU SERVEUR. « Date.now() - depart » comptait depuis
        // l'instant ou CETTE page s'etait mise a suivre : un rechargement
        // remettait le compteur a zero, et « 89 % · 6 s » s'affichait sur un
        // rendu qui durait depuis une minute. Le repli local ne sert qu'aux
        // vieilles reponses, qui ne portent pas encore le champ.
        const secondes = t.ecoule != null ? Math.round(t.ecoule)
                                          : Math.round((Date.now() - depart) / 1000);
        // « Combien de temps ? » est la question qu'on se pose EN REGARDANT la
        // barre : la reponse se met a cote, pas dans le depliant.
        const devis = lireDevis(t);
        if (devis && !vuDevis) vuDevis = Date.now();
        // « Depasse » se compare au temps du RENDU, et non au temps total : le
        // devis est une mediane de rendus, pas d'attentes. Comparer au total
        // faisait rougir la pastille des la premiere image de la barre pour une
        // demande qui avait patiente dans la file — et une demande armee onze
        // heures se reveillait avec le devis rouge d'emblee.
        const ecoule_rendu = t.ecoule_rendu != null ? t.ecoule_rendu : secondes;
        const depasse = devis && ecoule_rendu > devis.secondes;
        // Deux rendus peuvent courir de front ; savoir lequel est l'esquisse dit
        // lequel va revenir dans une minute et lequel dans quatre.
        // LA LIGNE DE JOURNAL RESTE FRANCAISE, ET C'EST LA DECISION DU DEPOT :
        // elle est ECRITE, gardee sur la tache, relue plus tard, parfois par
        // quelqu'un d'autre que celui qui a lance la demande. Ce qui se
        // traduit, c'est la PANNE — la marque que le serveur pose a cote,
        // plus bas.
        // « devis.mot » vient du serveur (« 4 min ») : il se place, il ne se
        // traduit pas.
        puces.innerHTML = (esquissesLancees.has(id)
            ? `<span class="puce esquisse">${ech(T("page.brouillon"))}</span>` : "")
          + (t.position
              ? `<span class="puce attente">${
                   ech(T("page.file.position", { n: t.position }))}</span>`
              : `<span class="puce cours">${ech((derniere ? derniere.msg : "…").slice(0, 64))}`
                + `${pct === null ? "" : " · " + ech(T("page.pourcent", { n: pct }))}`
                + ` · ${ech(T("page.duree.s", { n: secondes }))}</span>`
                + (devis
                   ? `<span class="puce devis${depasse ? " depasse" : ""}" title="${
                        ech(devis.mesures
                            ? T("page.devis.title", { n: devis.mesures,
                                                      mesures: devis.mesures,
                                                      mot: devis.mot })
                            : T("page.devis.title.court", { mot: devis.mot }))
                      }">${depasse ? ech(T("page.devis.depasse"))
                                   : ech(T("page.devis.estime", { mot: devis.mot }))}</span>`
                   : "")
                + (pct === null ? ""
                   : `<span class="avance"><i style="width:${pct}%"></i></span>`));
      }
      if (t.etat === ETAT.question) {
        clearInterval(minuteur); suivis.delete(id);
        if (visible) { garnirQuestion(bloc, t, cid); auBas(); }
        listerConversations();
        annoncerFin(t, cid);   // ronde 6 : onglet cache, titre et notification
        return;
      }
      if (t.etat === ETAT.fini || t.etat === ETAT.erreur) {
        clearInterval(minuteur); suivis.delete(id);
        const derniere = t.etapes[t.etapes.length - 1];
        // LA MARQUE D'ABORD, LA LIGNE DE JOURNAL ENSUITE, ET LE REPLI EST
        // OBLIGATOIRE. Le serveur pose « panne » a cote de la ligne francaise
        // (serveur.MARQUE_PANNE) et /api/etat la sert ; c'est elle qui se met
        // en phrase dans la langue du lecteur. Mais une tache relue apres
        // redemarrage n'a PAS de marque — et trois arguments de echouer() sur
        // cinq n'en avaient pas le 2 septembre : une page qui n'aurait su lire
        // que la marque aurait affiche du VIDE la ou il y avait une phrase.
        // Un studio qui repond en francais est genant, un studio qui ne repond
        // rien est casse.
        if (t.etat === ETAT.erreur)
          t.erreur = rendrePanne(t[MARQUE_PANNE])
                  || (derniere && derniere.msg) || t.erreur;
        if (visible) { garnirReponse(bloc, t); auBas(); }
        listerConversations();
        annoncerFin(t, cid);   // ronde 6 : onglet cache, titre et notification
        // Le compte d'appels distants n'avance qu'ici : une demande finie est le
        // seul moment ou « nuage 118/120 » peut etre devenu faux. Sans ce
        // rappel, la mention et les interrupteurs restaient sur l'etat du
        // chargement de la page, et l'on retombait sur le bouton qui « ne fait
        // rien » — cette fois avec une mention qui affirme qu'il reste de la
        // marge.
        peindreNuages();
        // Une machine a agent confirme l'arret de sa carte une a deux secondes
        // plus tard, par une ligne de journal de plus. Le sondage s'arrete
        // juste au-dessus et ne la verrait jamais : la bulle resterait sur
        // « arret demande », c'est-a-dire sur une promesse. Le 29 aout, c'est
        // exactement ce mecanisme qui a fait lire « interrompue » a
        // l'utilisateur pendant que le NAS calculait encore.
        //
        // Le champ et non le message : « t.erreur » vient d'etre remplace six
        // lignes plus haut, et le serveur leve lui-meme la marque quand il
        // ecrit le mot final — une machine deja silencieuse n'aura pas de suite
        // a nous donner, et on ne relit pas pour rien.
        if (t.etat === ETAT.erreur && t[MARQUE_ARRET_DIFFERE])
          setTimeout(async () => {
            try {
              const r2 = await fetch("/api/etat/" + id);
              if (!r2.ok) return;
              const t2 = await r2.json();
              const suite = (t2.etapes || [])[(t2.etapes || []).length - 1];
              // LA MEME LECTURE QU'AU-DESSUS, et il le faut : compare a la
              // seule ligne de journal, le mot final aurait paru different a
              // chaque fois pour un lecteur anglais — sa bulle porte la panne
              // MISE EN PHRASE, pas la ligne — et la relecture aurait
              // repeint le francais par-dessus l'anglais.
              const phrase = rendrePanne(t2[MARQUE_PANNE]) || (suite && suite.msg);
              if (!phrase || phrase === t.erreur) return;
              t2.erreur = phrase;
              if (cid === convActive && document.body.contains(bloc))
                garnirReponse(bloc, t2, cid);
            } catch (e) { /* la bulle garde la promesse : elle etait vraie */ }
          }, 8000);
      }
    } catch (err) {
      clearInterval(minuteur); suivis.delete(id);
      if (document.body.contains(bloc))
        garnirReponse(bloc, { etat: ETAT.erreur, erreur: err.message, fichiers: [] });
    }
  }, 1200);
  suivis.set(id, { bloc, minuteur });
}

/* ── ronde 6 : en-tete compact ────────────────────────────────────────
   Le menu du compte : un bouton au nom du compte, un panneau, et le motif
   « menu button » du W3C (APG) pour le clavier — Entree ou Espace ouvrent et
   posent le focus sur la premiere entree, les fleches circulent, Echap ferme
   et REND LE FOCUS AU BOUTON. Sans ce dernier point, un utilisateur au
   clavier qui referme le menu se retrouve en haut de la page, et doit
   retabuler depuis le debut pour retrouver ou il etait. */
const boutonCompte = $("#boutonCompte");
const panneauCompte = $("#panneauCompte");

/* Appelee par peindreCompte(), une fois ses elements crees : elle les RANGE,
   elle ne les refait pas. « sortir » et la ligne du nom sortent de #compte
   pour aller la ou le menu les veut ; leurs gestionnaires voyagent avec eux,
   puisque ce sont les memes noeuds. Ce que peindreCompte() montre ou cache
   (#lienAdmin selon « admin », #lienDemarrage selon « demarrage ») n'est pas
   relu ici : une seconde regle, posee a cote, finirait par contredire la
   premiere. */
function rangerMenuCompte(d, qui, sortir) {
  if (d.connecte) {
    $("#nomCompte").textContent = d.nom;
    // Le nom entier au survol : sur la ligne il est coupe en « … » des qu'il
    // depasse la place, et la ligne du panneau ne se lit qu'apres un clic.
    boutonCompte.title = d.nom;
    boutonCompte.classList.add("connecte");
  }
  $("#quiCompte").replaceChildren(...(qui ? [qui] : []));
  $("#sortieCompte").replaceChildren(...(sortir ? [sortir] : []));
  $("#separeCompte").hidden = !sortir;
  for (const b of document.querySelectorAll("#compte button, #sortieCompte button"))
    b.setAttribute("role", "menuitem");
}

/* LES ENTREES VISIBLES SEULEMENT. #lienAdmin et #lienDemarrage restent dans
   le menu quand peindreCompte() les cache ; une fleche qui s'y poserait
   mettrait le focus sur un element invisible, et le clavier semblerait mort
   une fois sur deux. */
const entreesMenuCompte = () =>
  [...document.querySelectorAll('#listeCompte [role="menuitem"]')]
    .filter(el => el.getClientRects().length > 0);

function ouvrirMenuCompte(versLaFin) {
  panneauCompte.hidden = false;
  boutonCompte.setAttribute("aria-expanded", "true");
  const liste = entreesMenuCompte();
  const cible = versLaFin ? liste[liste.length - 1] : liste[0];
  if (cible) cible.focus();
}

function fermerMenuCompte(rendreLeFocus) {
  if (panneauCompte.hidden) return;
  panneauCompte.hidden = true;
  boutonCompte.setAttribute("aria-expanded", "false");
  if (rendreLeFocus) boutonCompte.focus();
}

// Le clic suffit pour Entree et Espace : un <button> le declenche deja pour
// les deux touches, et le gerer une seconde fois l'ouvrirait puis le fermerait.
boutonCompte.addEventListener("click", () =>
  panneauCompte.hidden ? ouvrirMenuCompte(false) : fermerMenuCompte(true));
boutonCompte.addEventListener("keydown", e => {
  if (e.key !== "ArrowDown" && e.key !== "ArrowUp") return;
  e.preventDefault();
  ouvrirMenuCompte(e.key === "ArrowUp");
});

$("#menuCompte").addEventListener("keydown", e => {
  if (e.key === "Escape") {
    if (panneauCompte.hidden) return;
    e.preventDefault();
    fermerMenuCompte(true);
    return;
  }
  // Seulement depuis une entree : sur le <select> de la langue, une fleche
  // doit rester a lui — c'est elle qui change la valeur.
  const ici = e.target.closest('[role="menuitem"]');
  if (!ici || panneauCompte.hidden) return;
  const liste = entreesMenuCompte();
  const i = liste.indexOf(ici);
  let j = null;
  if (e.key === "ArrowDown") j = (i + 1) % liste.length;
  else if (e.key === "ArrowUp") j = (i - 1 + liste.length) % liste.length;
  else if (e.key === "Home") j = 0;
  else if (e.key === "End") j = liste.length - 1;
  // Espace active un menuitem, lien compris (APG) ; un lien, seul, ferait
  // defiler la page.
  else if (e.key === " " && ici.tagName === "A") { e.preventDefault(); ici.click(); }
  if (j === null || !liste.length) return;
  e.preventDefault();
  liste[j].focus();
});

// Une entree choisie ferme le menu. Le gestionnaire de l'entree a deja joue
// (il est sur la cible, celui-ci ecoute la remontee) : le formulaire du second
// facteur est ouvert quand le panneau se referme.
$("#listeCompte").addEventListener("click", e => {
  if (e.target.closest('[role="menuitem"]')) fermerMenuCompte(false);
});
// Le clic dehors, et le focus qui sort par la tabulation : dans les deux cas
// on regarde ailleurs, et un panneau reste ouvert couvrirait la conversation.
document.addEventListener("click", e => {
  if (!e.target.closest("#menuCompte")) fermerMenuCompte(false);
});
$("#menuCompte").addEventListener("focusout", e => {
  if (e.relatedTarget && !$("#menuCompte").contains(e.relatedTarget))
    fermerMenuCompte(false);
});

/* SUR TELEPHONE, LES NUAGES PASSENT DANS LE PANNEAU. Cinq interrupteurs et
   « nuage 118/120 » ne tiennent pas a cote du logo sur 375 px : laisses sur la
   ligne, ils la cassaient en deux, exactement ce que ce bloc existe pour
   empecher. C'est le meme noeud qui se deplace — peindreNuages() le retrouve
   par son id ou qu'il soit — et il revient a sa place des que l'ecran
   s'elargit. Un repere vide garde cette place. */
const ecranEtroit = matchMedia("(max-width:640px)");
const repereNuages = document.createComment(" nuages ");
$("#nuages").before(repereNuages);
function rangerNuages() {
  if (ecranEtroit.matches) $("#nuagesMenu").appendChild($("#nuages"));
  else repereNuages.after($("#nuages"));
}
rangerNuages();
ecranEtroit.addEventListener("change", rangerNuages);

// Le mot court de la mediatheque, lu par la feuille de style sous 640 px.
PRET.then(() => { $("#ouvrirMedia").dataset.abrege = T("page.entete.media.court"); });

/* ── ronde 6 : la saisie ──────────────────────────────────────────────
   Coller une image, envoyer au clavier, et etre prevenu quand un rendu finit
   pendant qu'on regarde ailleurs. */

/* UN FICHIER COLLE OU DEPOSE PREND LE CHEMIN DU SELECTEUR, ET AUCUN AUTRE. On
   le pose dans #img et l'on declenche « change » : c'est le gestionnaire du
   selecteur qui televerse, montre l'apercu et rapporte le refus du serveur
   (famille, plafond de taille). Une seconde copie du televersement aurait
   diverge a la premiere retouche — c'est arrive a l'envoi, quand la reponse
   a une precision oubliait la moitie des champs (voir reglagesDemandes()).
   banc_page.py exige qu'un seul endroit de la page poste
   sur /api/televerser.

   LE NOM COMPTE : le serveur range le fichier selon son EXTENSION
   (famille_du_fichier), et une capture d'ecran collee peut arriver sans nom.
   On lui en donne un tire de son type — « image collée.png » —, et
   « image/svg+xml » devient « .svg+xml », que le serveur refusera avec sa
   phrase a lui, la meme que pour un fichier choisi. */
function joindreCommeSelecteur(f) {
  const ext = (f.type.split("/")[1] || "").replace(/^x-/, "").replace(/^jpeg$/, "jpg");
  const nom = /\.[a-z0-9]+$/i.test(f.name || "") ? f.name
            : T("page.saisie.colle.nom") + "." + ext;
  try {
    const dt = new DataTransfer();
    dt.items.add(nom === f.name ? f : new File([f], nom, { type: f.type }));
    $("#img").files = dt.files;
    $("#img").dispatchEvent(new Event("change"));
  } catch (err) {
    $("#alerte").textContent = T("page.joindre.echec", { quoi: err.message });
  }
}

/* Le premier fichier d'un presse-papiers ou d'un depot. « files » d'abord ;
   « items » ensuite, parce que Safari ne remplit pas toujours le premier pour
   une image copiee. */
function fichierTransporte(dt) {
  if (!dt) return null;
  if (dt.files && dt.files.length) return dt.files[0];
  for (const it of dt.items || [])
    if (it.kind === "file") { const f = it.getAsFile(); if (f) return f; }
  return null;
}

/* DU TEXTE D'ABORD. Copier des cellules d'un tableur, ou un paragraphe de
   traitement de texte, met AUSSI une image dans le presse-papiers — le rendu
   de la selection. Le prendre pour une piece jointe aurait remplace par une
   capture la phrase qu'on voulait coller. Une image copiee n'arrive qu'avec
   son ADRESSE pour tout texte, quand elle en a une — un seul mot, qui
   commence par http : celle-la ne se colle pas, l'image si. */
$("#txt").addEventListener("paste", e => {
  const cd = e.clipboardData;
  const brut = cd ? cd.getData("text/plain").trim() : "";
  const adresseSeule = brut.startsWith("http") && !brut.includes(" ")
                       && !brut.includes("\n");
  if (!cd || (brut && !adresseSeule)) return;
  const f = fichierTransporte(cd);
  if (!f) return;
  e.preventDefault();
  joindreCommeSelecteur(f);
});

/* Le glisser-deposer. Sans lui, un fichier lache sur la page n'etait pas
   « refuse » : le navigateur l'OUVRAIT a la place du studio, et la
   conversation en cours disparaissait. On prend tout le document, et l'on
   s'efface devant un gestionnaire qui l'aurait deja pris (defaultPrevented). */
const portePieces = dt => !!dt && [...(dt.types || [])].includes("Files");
document.addEventListener("dragover", e => {
  if (!portePieces(e.dataTransfer) || e.defaultPrevented) return;
  e.preventDefault();
  document.querySelector("footer").classList.add("depot");
});
document.addEventListener("dragleave", e => {
  if (!e.relatedTarget) document.querySelector("footer").classList.remove("depot");
});
document.addEventListener("drop", e => {
  document.querySelector("footer").classList.remove("depot");
  if (!portePieces(e.dataTransfer) || e.defaultPrevented) return;
  e.preventDefault();
  const f = fichierTransporte(e.dataTransfer);
  if (f && !$("#txt").disabled) joindreCommeSelecteur(f);
});

/* CTRL+ENTREE ENVOIE, ENTREE VA A LA LIGNE. Le titre de la fleche le promet
   depuis le premier jour — « Générer (Ctrl+Entrée) » — et le gestionnaire
   s'etait perdu le 29 aout, quand la saisie a change de place (508c7cf) : le
   titre mentait depuis. Entree seule reste un saut de ligne, comme avant :
   un prompt se compose sur plusieurs lignes, et l'envoyer au premier retour
   coupait la phrase. « click() » et non lancerDemande() : la fleche desactivee
   (pas connecte) ne part pas, et le clavier ne doit pas pouvoir plus qu'elle.

   LA SAISIE COMPOSEE N'EST PAS UN ENVOI. En japonais ou en chinois, Entree
   VALIDE le mot que l'IME propose ; sans ce garde, la demande partait sur un
   mot a moitie ecrit. keyCode 229 en plus : Safari envoie la touche qui
   valide le mot avec isComposing deja faux, mais ce code-la. */
$("#txt").addEventListener("keydown", e => {
  if (e.isComposing || e.keyCode === 229) return;
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) { e.preventDefault(); $("#go").click(); }
});

/* ── prevenir quand un rendu finit ─────────────────────────────────────
   Un rendu dure de quelques secondes a plusieurs minutes, et l'on va voir
   ailleurs. Rien ne disait qu'il avait fini : on revenait trop tot, ou bien
   trop tard. Deux signes, et seulement quand l'onglet est CACHE — sous les
   yeux, la bulle suffit :
     - le titre de l'onglet, toujours : il ne demande aucune permission ;
     - une notification, si l'utilisateur l'a voulue ET que le navigateur l'a
       permise. LA PERMISSION NE SE DEMANDE JAMAIS AU CHARGEMENT : une fenetre
       « autoriser les notifications ? » a la premiere visite, avant d'avoir
       rien fait, se refuse par reflexe — et un refus ne se redemande plus.
       Elle se demande au clic sur la case des reglages, et la seulement
       (banc_page.py le verifie).
   L'accroche est dans suivre(), aux deux endroits ou le sondage s'arrete. */
const MARQUE_FINI = "✓ ", MARQUE_ALERTE = "! ";
const CLE_PREVENIR = "prevenirFin";
const notesOuvertes = new Set();

function prevenirVoulu() {
  try { return localStorage.getItem(CLE_PREVENIR) === "1"; } catch (e) { return false; }
}

function marquerTitre(grave) {
  const nu = document.title.replace(/^(✓|!) /, "");
  // L'alerte l'emporte : trois rendus finis et un rate, c'est le rate qu'on
  // doit venir voir.
  const deja = document.title.startsWith(MARQUE_ALERTE);
  document.title = (grave || deja ? MARQUE_ALERTE : MARQUE_FINI) + nu;
}

function annoncerFin(t, cid) {
  if (!document.hidden) return;
  const grave = t.etat !== ETAT.fini;
  marquerTitre(grave);
  if (!prevenirVoulu() || !("Notification" in window)
      || Notification.permission !== "granted") return;
  const titre = T(t.etat === ETAT.fini ? "page.saisie.notif.fini"
                : t.etat === ETAT.question ? "page.saisie.notif.question"
                : "page.saisie.notif.erreur");
  const corps = String(t.demande || "").slice(0, 140);
  try {
    const n = new Notification(titre, { body: corps, tag: "rendu-" + (t.id || "") });
    notesOuvertes.add(n);
    n.onclose = () => notesOuvertes.delete(n);
    // Le clic ramene sur l'onglet ET sur la conversation du rendu : il a pu
    // finir dans une autre que celle qu'on avait laissee ouverte.
    n.onclick = () => {
      window.focus();
      n.close();
      if (cid && cid !== convActive) ouvrir(cid);
    };
  } catch (e) {
    // Chrome sur Android refuse le constructeur : il n'y notifie que par un
    // service worker. Le titre de l'onglet a deja parle.
  }
}

document.addEventListener("visibilitychange", () => {
  if (document.hidden) return;
  document.title = document.title.replace(/^(✓|!) /, "");
  for (const n of notesOuvertes) n.close();
  notesOuvertes.clear();
});

/* La case. Cochee seulement si les DEUX sont vrais — voulu ici, permis par le
   navigateur : une case cochee qui ne notifie pas est un mensonge. Une
   permission refusee se dit a cote, avec ce qui reste (le titre). */
function peindrePrevenir() {
  const permis = Notification.permission;
  $("#prevenir").checked = prevenirVoulu() && permis === "granted";
  $("#refusPrevenir").textContent = prevenirVoulu() && permis === "denied"
    ? T("page.saisie.prevenir.refuse") : "";
}

/* EN HTTP CLAIR, AUCUN NAVIGATEUR NE NOTIFIE. La permission est reservee aux
   contextes surs — https, ou la machine elle-meme (localhost) —, et le studio
   se sert d'ordinaire en http sur le reseau de la maison. La case reste
   visible, grisee, et dit pourquoi : cachee, on l'aurait cherchee ; active,
   elle aurait ete refusee sans fenetre ni explication. */
if (!window.isSecureContext) {
  $("#prevenirFin").hidden = false;
  $("#prevenir").disabled = true;
  PRET.then(() => { $("#refusPrevenir").textContent = T("page.saisie.prevenir.https"); });
} else if ("Notification" in window) {
  $("#prevenirFin").hidden = false;
  PRET.then(peindrePrevenir);
  $("#prevenir").addEventListener("change", async e => {
    const voulu = e.target.checked;
    try { localStorage.setItem(CLE_PREVENIR, voulu ? "1" : "0"); } catch (err) {}
    // DANS LE GESTE, avant tout « await » : passe ce point, le navigateur ne
    // tient plus le clic pour un geste et refuse de demander. L'ancienne forme
    // de Safari rend undefined et repond par un rappel ; les deux sont lues.
    if (voulu && Notification.permission === "default")
      await new Promise(fin => {
        const p = Notification.requestPermission(fin);
        if (p && p.then) p.then(fin);
      });
    peindrePrevenir();
  });
}

/* Sur Mac, la touche est Cmd : l'aide le dit avec le signe du clavier. */
PRET.then(() => {
  const plateforme = String(navigator.platform || "");
  if (plateforme.startsWith("Mac") || plateforme.startsWith("iP"))
    $("#aideSaisie").textContent = T("page.saisie.aide.mac");
});

/* ── ronde 6 : appli installable, avant / apres ──────────────────────
   AUCUN SERVICE WORKER N'EST ENREGISTRE ICI, ET C'EST VOULU (appli.py dit
   pourquoi) : les navigateurs n'en exigent plus pour installer, et un cache
   d'origine partagerait les conversations d'un compte avec le suivant sur le
   meme appareil. banc_page.py tient la regle. */

/* Les intentions dont le resultat est la MEME image, modifiee. Les valeurs
   sont celles que serveur.py ecrit dans « type » (INTENTIONS_DU_PLAN et les
   trois retouches localisees de raccourci_ecrit) ; un agrandissement ou un
   detourage changent l'image autrement, et le curseur n'y montrerait rien
   d'utile. */
const TYPES_RETOUCHE = ["edition", "retoucher_zone", "retoucher_fond",
                        "retoucher_sujet"];

/* L'original d'une retouche, sous la forme qu'attend url(), ou null.
   « entree » : ce que la demande avait joint (/api/televerser, ou une piece
   reprise de la mediatheque) — relu par type=input, que serveur.py ne rend
   qu'a son proprietaire. « reprise » : la sortie precedente, quand rien
   n'etait joint (« retouche-la ») — une sortie de mes conversations, que la
   liste d'autorisation de /api/fichier couvre deja. Rien d'autre : aucune
   devinette sur « l'image d'avant dans le fil », qui peut etre une autre. */
function origineDe(t) {
  if (!t || !TYPES_RETOUCHE.includes(t.type)) return null;
  const r = t.reprise || {};
  const f = t.entree ? { filename: t.entree, subfolder: "", type: "input" }
          : r.filename ? { filename: r.filename, subfolder: r.subfolder || "",
                           noeud: r.noeud, type: "output" }
          : null;
  // Une image seulement : une video retouchee n'a pas de curseur qui tienne.
  return f && EXT_IMG.test(f.filename) ? f : null;
}

/* Le curseur avant / apres, pose sur la premiere image du resultat.
   L'ORIGINAL EST CHARGE D'ABORD, et rien ne change tant qu'il n'est pas la :
   une entree purgee (quarante par compte), un fichier qui n'est pas a moi ou
   une machine eteinte rendent 404, et la bulle reste exactement ce qu'elle
   etait — pas de curseur qui ne devoilerait rien.
   Un <input type=range> : souris, doigt et fleches du clavier sans une ligne
   de plus, et un lecteur d'ecran l'annonce comme un curseur. */
function avantApres(sortie, t) {
  if (!t || t.etat !== ETAT.fini) return;
  const f = origineDe(t);
  const apres = sortie.querySelector(":scope > img");
  if (!f || !apres) return;
  const avant = new Image();
  avant.className = "original";
  avant.alt = T("page.appli.avant.alt");
  avant.onload = () => {
    // La bulle a pu etre repeinte entre-temps (garnirReponse vide .sortie) :
    // on ne pose rien sur une image qui n'est plus affichee.
    if (apres.parentNode !== sortie) return;
    const boite = document.createElement("div");
    boite.className = "comparaison";
    apres.replaceWith(boite);
    const trait = document.createElement("i");
    trait.className = "comparaison-trait";
    boite.append(apres, avant, trait);

    const regle = document.createElement("div");
    regle.className = "comparaison-regle";
    const curseur = document.createElement("input");
    curseur.type = "range";
    curseur.min = "0"; curseur.max = "100"; curseur.step = "1"; curseur.value = "50";
    curseur.setAttribute("aria-label", T("page.appli.comparer.aria"));
    curseur.title = T("page.appli.comparer.title");
    const poser = () => {
      boite.style.setProperty("--part", curseur.value + "%");
      // Le pourcentage seul ne dit pas DE QUOI : « 50 » annonce par un lecteur
      // d'ecran ne dit pas que la moitie gauche est l'original.
      curseur.setAttribute("aria-valuetext",
                           T("page.appli.comparer.valeur", { n: curseur.value }));
    };
    curseur.addEventListener("input", poser);
    poser();
    const gauche = document.createElement("span");
    gauche.textContent = T("page.appli.avant");
    const droite = document.createElement("span");
    droite.textContent = T("page.appli.apres");
    regle.append(gauche, curseur, droite);
    boite.after(regle);
  };
  avant.src = url(f);
}

/* ── ronde 6 : mediatheque ─────────────────────────────────────────────
   Trois choses que la grille et le fil ne savaient pas faire : dire qu'un
   fichier a disparu, passer d'une piece a la suivante en plein ecran, et
   renvoyer une image vers le champ de saisie pour la retoucher. */

/* LES FICHIERS QUI N'EXISTENT PLUS, par adresse. Un fichier purge, efface, ou
   dont la machine est eteinte affichait une image CASSEE avec son texte de
   remplacement : la carte restait, avec « telecharger » et « plein ecran »
   vivants, et rien ne disait pourquoi rien ne marchait. La grille se repeint a
   chaque lettre tapee dans la recherche : sans ce releve, chaque repeinte
   redemandait les memes fichiers absents au serveur. Il se vide a chaque
   ouverture de la mediatheque — une machine rallumee rend ses fichiers.
   SONDES : une seule verification en vol par adresse, quel que soit le nombre
   de vignettes qui echouent dessus. */
const MEDIA_ABSENTS = new Set(), SONDES = new Map();
$("#ouvrirMedia").addEventListener("click", () => {
  MEDIA_ABSENTS.clear(); SONDES.clear();
});

/* Une image qui ne se decode pas n'est pas un fichier disparu : seul le
   serveur sait lequel des deux. Une sonde d'un octet le lui demande, UNE fois :
   un refus (404 : efface, purge ; 5xx : machine eteinte) vaut absence ; un
   fichier present garde sa vignette telle que le navigateur la montre, et ses
   boutons — on peut toujours le telecharger. */
function sonderAbsence(u) {
  if (!SONDES.has(u))
    SONDES.set(u, fetch(u, { headers: { Range: "bytes=0-0" }, cache: "no-store",
                             credentials: "same-origin" })
      .then(r => { r.body?.cancel?.().catch(() => {}); return !r.ok; })
      .catch(() => true));
  return SONDES.get(u);
}

/* Branche sur une vignette (image, video, son) la reaction a son echec. Un
   seul essai par element (« once ») : l'emplacement qui la remplace n'a plus
   de source, rien ne se redemande en boucle. */
function veillerAbsence(el, zone, f) {
  if (!el || !["IMG", "VIDEO", "AUDIO"].includes(el.tagName)) return;
  const u = url(f);
  if (MEDIA_ABSENTS.has(u)) { poserAbsence(el, zone, f); return; }
  el.addEventListener("error", async () => {
    if (!(await sonderAbsence(u))) return;
    MEDIA_ABSENTS.add(u);
    poserAbsence(el, zone, f);
  }, { once: true });
}

/* L'emplacement « fichier introuvable », et les gestes qui ne peuvent plus
   servir. « telecharger » et « plein ecran » se coupent : ils n'auraient rien
   a montrer. Le bouton qui joint le fichier au champ de saisie ne peut plus
   le joindre non plus, mais ce qu'on avait DEMANDE existe encore : il devient
   « reprendre la demande », le seul geste qui reste utile devant un rendu
   perdu — le refaire. */
function poserAbsence(el, zone, f) {
  const p = document.createElement("div");
  p.className = "introuvable";
  p.title = f.filename;
  p.innerHTML = `<span class="introuvable-signe" aria-hidden="true">∅</span>`
              + `<b>${ech(T("page.media.introuvable"))}</b>`
              + `<small>${ech(T("page.media.introuvable.pourquoi"))}</small>`;
  // Une video se coupe avant de partir : retiree du document, elle
  // continuerait de chercher sa source.
  if (el.tagName !== "IMG") { el.removeAttribute("src"); el.load?.(); }
  if (el.parentNode) el.replaceWith(p);
  if (!zone) return;
  for (const b of zone.querySelectorAll('[data-geste="plein"], [data-geste="retoucher"]')) {
    b.disabled = true; b.title = T("page.media.introuvable");
  }
  for (const a of zone.querySelectorAll("a[download]")) {
    a.removeAttribute("href");
    a.setAttribute("aria-disabled", "true");
    a.title = T("page.media.introuvable");
  }
  const rep = zone.querySelector('[data-geste="joindre"]');
  if (!rep) return;
  if (!f.demande) { rep.disabled = true; return; }
  rep.textContent = T("page.media.reprendre_demande");
  rep.title = T("page.media.reprendre_demande.title");
  rep.onclick = () => reprendreDemande(f);
}

/* La demande d'un rendu perdu, remise dans le champ — sans l'envoyer : on
   la relit, on la corrige peut-etre, et c'est l'utilisateur qui la renvoie.
   /api/mediatheque coupe « demande » a 120 signes ; la conversation porte
   l'entiere, et c'est elle qu'on prend quand on peut la lire. Le moteur suit,
   comme pour « relancer » dans le fil. */
async function reprendreDemande(f) {
  let texte = f.demande || "", moteur = f.moteur;
  if (f.conversation && f.tour) {
    try {
      const r = await fetch("/api/conversation/" + encodeURIComponent(f.conversation),
                            { credentials: "same-origin" });
      const c = r.ok ? await r.json() : {};
      const t = (c.tours || []).find(x => x.id === f.tour);
      if (t && t.demande) { texte = t.demande; moteur = t.modele || moteur; }
    } catch (e) { /* la demande coupee vaut mieux qu'un champ vide */ }
  }
  $("#txt").value = texte;
  if (moteur && [...$("#forcer").options].some(o => o.value === moteur))
    $("#forcer").value = moteur;
  ajuster();
  if (typeof peindreActifs === "function") peindreActifs();
  fermerMediatheque();
  $("#txt").focus();
}

/* Une sortie du studio redevient une entree : /api/reprendre la recopie dans
   le cache d'entree de la machine — apres avoir verifie qu'elle appartient au
   demandeur, avec la meme regle que l'affichage (mes_fichiers) — et rend le nom
   sous lequel la joindre. La suite est celle d'un fichier televerse.
   Partage par « retoucher » / « reprendre » de la grille et « retoucher » de
   la visionneuse : deux copies de ces vingt lignes auraient diverge a la
   premiere correction. */
let fermerVue = null;
async function joindreSortie(f) {
  const r = await fetch("/api/reprendre", {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ filename: f.filename,
                           subfolder: f.subfolder || "", noeud: f.noeud }) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok || !d.image) throw new Error(d.erreur || T("page.reprise.impossible"));
  imageJointe = d.image;
  // L'apercu d'un fichier televerse avant celui-ci ne sert plus a rien.
  if (apercuURL) { URL.revokeObjectURL(apercuURL); apercuURL = null; }
  $("#nomimg").textContent = f.filename;
  // La vignette avec : une piece jointe sans apercu ne dit pas laquelle
  // on vient de reprendre, et on en reprend souvent plusieurs de suite.
  const zone = $("#apercu-zone");
  zone.innerHTML = "";
  if (EXT_IMG.test(f.filename)) {
    const i = document.createElement("img");
    i.src = url(f); i.alt = f.filename; zone.appendChild(i);
  } else if (EXT_VID.test(f.filename)) {
    const v = document.createElement("video");
    v.src = url(f); v.muted = true; zone.appendChild(v);
  } else {
    zone.innerHTML = '<span class="genre">♪</span>';
  }
  $("#jointe").style.display = "";
  if (fermerVue) fermerVue(false);
  fermerMediatheque();
  $("#txt").focus();
}

/* Le squelette de la visionneuse, pose une fois par ouverture ; peindreVue()
   le remplit a chaque pas. Les fleches et le compteur n'existent que s'il y a
   plus d'une piece : « 1 / 1 » et deux fleches qui ne menent nulle part
   feraient croire a une panne. */
function construireVue(voile, plusieurs) {
  voile.setAttribute("role", "dialog");
  voile.setAttribute("aria-modal", "true");
  voile.setAttribute("aria-label", T("page.media.visio.aria"));
  const scene = document.createElement("figure");
  scene.className = "visio-scene";
  const cadre = document.createElement("div");
  cadre.className = "visio-cadre";
  const legende = document.createElement("figcaption");
  legende.className = "visio-legende";
  const gestes = document.createElement("div");
  gestes.className = "visio-gestes";
  scene.append(cadre, legende, gestes);
  const compte = document.createElement("span");
  compte.className = "visio-compte";
  compte.setAttribute("aria-live", "polite");
  const fleche = (classe, cle, signe) => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "visio-pas " + classe;
    b.setAttribute("aria-label", T(cle)); b.title = T(cle);
    b.textContent = signe; b.hidden = !plusieurs;
    return b;
  };
  const prec = fleche("visio-prec", "page.media.visio.precedent", "‹");
  const suiv = fleche("visio-suiv", "page.media.visio.suivant", "›");
  compte.hidden = !plusieurs;
  voile.append(scene, compte, prec, suiv);
  return { scene, cadre, legende, gestes, compte, prec, suiv };
}

/* Une piece dans la visionneuse : le media, sa demande et son moteur en
   legende (« pourquoi celle-ci » se demande en la regardant, pas apres), le
   rang, et « retoucher » pour une image. */
function peindreVue(vue, f, rang, n) {
  const video = EXT_VID.test(f.filename);
  const el = document.createElement(video ? "video" : "img");
  if (video) { el.controls = true; el.autoplay = true; }
  else el.alt = f.demande || f.filename;
  if (!MEDIA_ABSENTS.has(url(f))) el.src = url(f);
  vue.cadre.replaceChildren(el);
  const detail = [f.a, f.moteur, f.taille && f.taille.replace("x", " × ")]
    .filter(Boolean).map(ech).join(" · ");
  vue.legende.innerHTML = `<span>${ech(f.demande || f.filename)}</span>`
                        + (detail ? `<small>${detail}</small>` : "");
  peindreOrigineVue(vue, f);
  vue.compte.textContent = T("page.media.visio.compte", { n: rang + 1, total: n });
  vue.gestes.replaceChildren();
  if (!video) {
    const b = document.createElement("button");
    b.type = "button"; b.dataset.geste = "retoucher";
    b.textContent = T("page.media.retoucher");
    b.title = T("page.media.retoucher.title");
    b.onclick = async e => {
      e.stopPropagation();
      b.disabled = true; b.textContent = "…";
      try { await joindreSortie(f); }
      catch (err) {
        // SUR LE BOUTON : la barre d'alerte est sous la visionneuse, qui
        // couvre tout l'ecran — un refus ecrit la ne serait lu par personne.
        b.disabled = false;
        b.textContent = T("page.impossible", { quoi: err.message });
      }
    };
    vue.gestes.appendChild(b);
  }
  veillerAbsence(el, vue.gestes, f);
}

/* Le focus reste dans la visionneuse tant qu'elle est ouverte : Tab apres le
   dernier bouton revenait sinon sur la grille, CACHEE dessous, et le clavier
   agissait sur des cartes qu'on ne voyait pas. */
function pieger(voile, e) {
  const prenables = [...voile.querySelectorAll("button, video[controls], a[href]")]
    .filter(x => !x.disabled && !x.hidden);
  if (!prenables.length) return;
  const premier = prenables[0], dernier = prenables[prenables.length - 1];
  const ici = document.activeElement;
  if (e.shiftKey && (ici === premier || !voile.contains(ici))) {
    e.preventDefault(); dernier.focus();
  } else if (!e.shiftKey && (ici === dernier || !voile.contains(ici))) {
    e.preventDefault(); premier.focus();
  }
}

/* Le doigt : un trait franchement horizontal passe a la piece voisine, comme
   dans toute galerie de telephone. Pas sur une video — glisser sur sa barre de
   lecture, c'est chercher un instant du film, pas changer de film — ni a deux
   doigts, qui agrandissent. */
function balayer(voile, montrer) {
  let x0 = null, y0 = 0;
  voile.addEventListener("touchstart", e => {
    const t = e.touches[0];
    x0 = e.touches.length === 1 && e.target.tagName !== "VIDEO" ? t.clientX : null;
    y0 = t.clientY;
  }, { passive: true });
  voile.addEventListener("touchend", e => {
    if (x0 === null) return;
    const t = e.changedTouches[0];
    const dx = t.clientX - x0, dy = t.clientY - y0;
    x0 = null;
    if (Math.abs(dx) > 50 && Math.abs(dx) > 1.5 * Math.abs(dy))
      montrer(dx < 0 ? 1 : -1);
  }, { passive: true });
}

/* ── ronde 8 : la page sait ou elle est servie ─────────────────────────
   LE MEME STUDIO A DEUX ADRESSES, ET L'UNE NE SAIT PAS TOUT FAIRE. Il est
   servi en http sur le reseau de la maison et, derriere un reverse proxy TLS,
   sous un nom en https. Notifier et s'installer comme application ne se font
   qu'en contexte sur — https, ou la machine elle-meme : depuis l'adresse
   http, la case se grisait (ronde 6) et le navigateur ne proposait aucune
   installation, sans dire ou aller. La page ne devine pas l'autre adresse :
   rien dans une page http ne la dit. Le studio la connait si l'operateur l'a
   posee (STUDIO_ADRESSE_PUBLIQUE, validee par serveur.py), et /api/compte la
   sert — la route que la page lit deja au chargement, ouverte sans session,
   et qui porte deja ce qu'est l'installation (« obligatoire »,
   « comptes_existent »). /api/textes, lu plus tot encore, est un
   dictionnaire par langue : une adresse n'y a pas sa place.

   EN CONTEXTE SUR, RIEN NE CHANGE : peindreHorsHttps() s'arrete a sa
   premiere ligne. Le lien vise la MEME page — chemin, requete et ancre —, pas
   l'accueil : on veut retrouver de l'autre cote ce qu'on regardait. */
let ADRESSE_PUBLIQUE = "";

/* L'accroche de peindreCompte(), des que /api/compte a repondu. */
function retenirAdresse(d) {
  ADRESSE_PUBLIQUE = String((d && d.adresse_publique) || "");
  peindreHorsHttps();
}

/* La base des adresses a coller : celle que l'operateur publie, sinon celle de
   cette page — qui marche au moins depuis la ou l'on est. */
function baseDesOutils() {
  return ADRESSE_PUBLIQUE || location.origin;
}

/* Le lien vers la meme page a l'adresse publique, ou null. SEULEMENT VERS UNE
   ADRESSE https : en http, le contexte n'y serait pas plus sur, et le lien
   promettrait ce qu'il ne tient pas. Le reste — pas de chemin, pas
   d'identifiants, des minuscules — serveur.py l'a deja exige
   (lire_adresse_publique) : une seconde validation ici, ecrite autrement,
   finirait par contredire la premiere. */
function lienHttps() {
  if (!ADRESSE_PUBLIQUE.startsWith("https://")) return null;
  const a = document.createElement("a");
  a.className = "vers-https";
  a.href = ADRESSE_PUBLIQUE + location.pathname + location.search + location.hash;
  a.textContent = T("page.brancher.https.lien");
  return a;
}

/* Les deux endroits qui ne marchent pas ici, chacun avec sa phrase et, si
   l'adresse est connue, son lien. Rejouable : peinte une premiere fois quand
   le dictionnaire est la, puis quand /api/compte a dit l'adresse. */
function peindreHorsHttps() {
  if (window.isSecureContext) return;
  // La case des notifications porte deja sa phrase (ronde 6,
  // « page.saisie.prevenir.https ») : on n'y ajoute que le lien.
  const ancien = $("#prevenirHttps");
  if (ancien) ancien.remove();
  const versNotif = lienHttps();
  if (versNotif) {
    versNotif.id = "prevenirHttps";
    $("#refusPrevenir").after(versNotif);
  }
  // L'INSTALLATION N'A PAS DE BOUTON DANS LA PAGE : c'est le navigateur qui la
  // propose, dans son menu ou sa barre d'adresse — et en http il ne la propose
  // pas. La phrase va donc la ou se regle le reste de la page, le menu, sous
  // la langue, plutot qu'en bandeau sur la conversation.
  let note = $("#appliHttps");
  if (!note) {
    note = document.createElement("div");
    note.id = "appliHttps";
    note.className = "appli-https";
    const langue = $("#panneauCompte .choix-langue");
    if (langue) langue.after(note);
    else $("#panneauCompte").append(note);
  }
  note.replaceChildren(T("page.brancher.appli"));
  const versAppli = lienHttps();
  if (versAppli) note.append(" ", versAppli);
}
PRET.then(peindreHorsHttps);

/* « Brancher un outil », dans le voile des cles d'acces : les trois adresses
   de base, chacune avec son bouton « copier » — celui des extraits de la cle
   neuve, recu de formulaireAcces(), pour qu'il n'y ait qu'une facon de
   copier. AUCUN SECRET : la cle n'y est pas, elle se donne a part ; ces
   adresses se montrent donc a chaque ouverture, cle neuve ou pas. */
function brancherUnOutil(copiable) {
  const base = baseDesOutils();
  const titre = document.createElement("h4");
  titre.textContent = T("page.brancher.titre");
  const pourquoi = document.createElement("div");
  pourquoi.className = "dit";
  pourquoi.textContent = T("page.brancher.pourquoi");
  return [titre, pourquoi,
          ...copiable("page.brancher.v1", base + "/api/v1"),
          ...copiable("page.brancher.openai", base + "/openai/v1"),
          ...copiable("page.brancher.mcp", base + "/mcp")];
}

/* ── ronde 10 : un moteur que le parc ne porte pas ─────────────────────
   GRISE, ET NON CACHE. /api/modeles le sert avec « trop_lourd » : ce qu'il
   demande, la plus grosse carte connue du parc (debordement compris), et le
   moteur qui tient a sa place. Le cacher aurait fait disparaitre klein9bhd
   sans dire qu'une carte plus grosse le rendrait ; le laisser choisissable
   menait a un refus apres l'envoi. Le suffixe se lit partout, telephone
   compris ; l'infobulle donne les chiffres. Une option desactivee reste
   posable par programme — une conversation qui l'avait retenue la garde, et
   le refus du serveur nomme alors la cause et le repli. */
function moteurTrop(o, m) {
  const t = m.trop_lourd;
  if (!t) return;
  const nombre = x => Number(x).toLocaleString(locale(), { maximumFractionDigits: 1 });
  o.disabled = true;
  o.textContent = m.titre + " " + T("page.moteurtrop.suffixe");
  o.title = t.repli
    ? T("page.moteurtrop.infobulle", { vram: nombre(t.vram), plafond: nombre(t.plafond), repli: t.repli })
    : T("page.moteurtrop.infobulle_seul", { vram: nombre(t.vram), plafond: nombre(t.plafond) });
}

/* ── ronde 10 : la mediatheque sait d'ou vient une image ───────────────
   Une demande faite par cle — n8n, Open WebUI, Claude par MCP — a sa propre
   conversation, absente de la liste de gauche ; ses images sont pourtant dans
   la mediatheque, et rien ne les distinguait de celles faites ici. Elles ne
   vivent pas pareil : leur conversation se ferme apres quelques semaines sans
   tour (GARDE_PROGRAMME, serveur.py), et ses images partent avec. Le serveur
   sert « origine » — le NOM de la cle, jamais son identifiant — et le delai
   en jours ; la page les montre, elle n'invente ni l'un ni l'autre. */

/* Les valeurs de PROTOCOLE du filtre, celles des <option> de #origineMedia :
   banc_page.py exige que les deux listes soient la meme. Vide : tout. */
const ORIGINE_MEDIA = {
  page: f => !f.origine,
  programmes: f => !!f.origine,
};

function origineGardee(f) {
  const sel = $("#origineMedia");
  const garde = sel ? ORIGINE_MEDIA[sel.value] : null;
  return !garde || garde(f);
}

/* Le filtre n'existe que s'il y a de quoi filtrer : « les programmes » sur une
   mediatheque qui n'en a aucun ferait chercher dans le vide — la regle de
   garnirChoix(). Cache, il revient a « tout » : un filtre invisible qui
   filtrerait encore ferait disparaitre des images sans raison visible. */
function peindreOrigineMedia(tous) {
  const sel = $("#origineMedia");
  if (!sel) return;
  sel.hidden = !tous.some(f => f.origine);
  if (sel.hidden) sel.value = "";
  sel.oninput = peindreGrille;
}

/* « par clé · n8n », et « (révoquée) » quand la cle n'existe plus : ses
   images restent, et plus rien n'arrivera par elle. Sans nom, « par clé »
   seul. Du TEXTE, que les appelants posent par textContent : le nom est
   choisi par le proprietaire, il n'a rien a faire dans du HTML. */
function badgeProgramme(f) {
  const o = f.origine || {};
  if (!o.cle) return T("page.mediaprog.badge.anonyme");
  return T(o.revoquee ? "page.mediaprog.badge.revoquee" : "page.mediaprog.badge",
           { nom: o.cle });
}

/* Le son et l'objet 3D n'ont pas de vignette ou poser la marque : elle va dans
   leur legende, comme celle du brouillon. */
function legendeProgramme(legende, f, vignette) {
  if (!f.origine || vignette) return;
  const s = document.createElement("small");
  s.className = "origine-media";
  s.textContent = badgeProgramme(f);
  legende.appendChild(s);
}

/* Dans la visionneuse, la marque ET ce qu'elle implique : l'image part avec sa
   conversation apres N jours sans activite. N vient du serveur
   (garde_programme_jours) ; absent — un studio d'avant —, la phrase se tait
   plutot que d'avancer un chiffre que personne n'a dit. */
function peindreOrigineVue(vue, f) {
  if (!f.origine) return;
  const qui = document.createElement("small");
  qui.className = "visio-origine";
  qui.textContent = badgeProgramme(f);
  vue.legende.appendChild(qui);
  const jours = (mediaCharge || {}).garde_programme_jours;
  if (!jours) return;
  const garde = document.createElement("small");
  garde.className = "visio-garde";
  garde.textContent = T("page.mediaprog.garde", { n: jours });
  vue.legende.appendChild(garde);
}
</script>
