<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComfyStudio</title>
<style>
/* ═══ Console d'atelier ═══════════════════════════════════════════════
   Aucune police distante : l'outil doit fonctionner hors ligne.        */
:root{
  /* Declare au navigateur la palette de ses widgets natifs : sans elle, les
     menus deroulants des selecteurs s'ouvraient en clair sur le theme
     sombre. Elle suit la meme bascule que les couleurs, plus bas. */
  color-scheme:dark;
  --nuit:#15120f; --plan:#1d1915; --creux:#120f0d; --relief:#262019;
  --trait:#2e2721; --trait-vif:#4a3f34;
  --encre:#f0e9e0; --encre-douce:#b6a999; --encre-pale:#8e8175;
  --braise:#e8a33d; --braise-sourde:#3a2a13; --braise-vive:#ffc266;
  --vert:#8fbf72; --rouge:#e07a55;
  --serif:Constantia,Georgia,"Times New Roman",serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme: light){
  :root{
    color-scheme:light;
    --nuit:#f2ede4; --plan:#fffdf9; --creux:#e8e1d5; --relief:#faf6ef;
    --trait:#ddd4c5; --trait-vif:#a3927c;
    --encre:#20180f; --encre-douce:#584c3e; --encre-pale:#6f6151;
    --braise:#a05d0a; --braise-sourde:#f6e7cd; --braise-vive:#7d4708;
    --vert:#4a6b34; --rouge:#a2431f;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow-x:hidden;background:var(--nuit);color:var(--encre);
  font:15.5px/1.65 var(--serif);display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}

header{display:flex;align-items:center;gap:14px;padding:12px 20px;
  border-bottom:1px solid var(--trait);background:var(--plan);flex:none}
.marque{font:600 15px var(--sans);letter-spacing:.02em}
.marque em{font-style:normal;color:var(--braise)}
.jauge{margin-left:auto;display:flex;gap:14px;align-items:center;
  font:11px/1 var(--mono);color:var(--encre-pale);letter-spacing:.03em}
.jauge b{color:var(--encre-douce);font-weight:400}
/* Article 13 de l'AGPL : qui utilise le service doit pouvoir obtenir la
   source. Un lien visible, discret mais present. */
.jauge .source{color:var(--encre-pale);text-decoration:none;
  border-bottom:1px dotted var(--trait-vif)}
.jauge .source:hover{color:var(--braise)}
/* Interrupteurs de cloud : un par modalite, allumes quand la demande part
   chez un fournisseur. Eteints, ils restent visibles — savoir qu'on POURRAIT
   passer au cloud vaut mieux qu'un bouton qui disparait. */
/* Le repli n'est pas un ornement : la mention du plafond s'ajoute au bout de
   la rangee, et cinq interrupteurs plus « nuage 120/120 » depassaient 375 px
   d'un bloc. La jauge qui les porte se replie deja ; encore faut-il que cette
   rangee-ci accepte de se couper. */
.nuages{display:flex;gap:4px;align-items:center;flex-wrap:wrap;
  justify-content:flex-end}
/* La file, au survol ET au clic : un telephone n'a pas de survol, et c'est la
   moitie des usages. Position fixe plutot qu'ancree au bouton — ancre, le
   panneau sortait de l'ecran a droite sur un telephone. */
.file-vive{cursor:pointer}
#panneauFile{position:fixed;top:52px;right:12px;left:auto;z-index:40;
  width:min(420px,calc(100vw - 24px));max-height:min(60vh,420px);overflow:auto;
  background:var(--plan);border:1px solid var(--trait);border-radius:12px;
  padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none}
#panneauFile.ouvert{display:block}
#panneauFile h4{margin:0 0 8px;font:600 12px var(--sans);color:var(--encre-douce);
  text-transform:lowercase;letter-spacing:.4px}
.tache{display:flex;gap:9px;align-items:flex-start;padding:7px 0;
  border-top:1px solid var(--trait)}
.tache:first-of-type{border-top:0}
.tache .rang{font:11px var(--mono);color:var(--encre-pale);min-width:2.2em}
.tache .quoi{flex:1;font:12.5px var(--sans);word-break:break-word}
.tache .quoi small{display:block;font:10.5px var(--mono);color:var(--encre-pale)}
.tache.autrui .quoi{color:var(--encre-pale);font-style:italic}
.tache button{background:transparent;border:1px solid var(--trait-vif);
  border-radius:6px;padding:2px 7px;font:11px var(--mono);color:var(--encre-pale);
  cursor:pointer}
.tache button:hover{border-color:var(--rouge);color:var(--rouge)}
.tache .encours{color:var(--braise);font:10.5px var(--mono)}
/* Barre de progression : elle ne s'affiche QUE si ComfyUI a annonce un total.
   Une barre qui avance sans rapport avec le calcul est pire qu'aucune barre,
   parce qu'on lui fait confiance. */
.avance{height:4px;background:var(--creux);border-radius:3px;margin-top:5px;
  overflow:hidden}
.avance i{display:block;height:100%;background:var(--braise);
  transition:width .3s ease}
/* Dans le bandeau de la bulle, le bandeau est un flex : sans largeur imposee la
   barre serait un point. Elle prend donc la place qui reste, et perd la marge
   haute qui la decalerait de la ligne. */
.bandeau-tech .avance{flex:1 1 90px;min-width:90px;margin-top:0}
.etat-tache{font:10.5px var(--mono);margin-top:3px}
.etat-tache.attente{color:var(--encre-pale)}
.etat-tache.cours{color:var(--braise)}
/* « termine » et non « fini » : « fini » est AUSSI la valeur de protocole que
   le serveur ecrit sur la tache, et la table des etiquettes rangeait les deux
   dans la meme ligne. Un nom de classe qui se confond avec une valeur de
   protocole ne rougit nulle part le jour ou l'on traduit l'une des deux. */
.etat-tache.termine{color:var(--vert)}
.etat-tache.rate{color:var(--rouge)}
@media (max-width:640px){
  /* Sur telephone la barre est etroite : le panneau prend toute la largeur et
     s'ancre sous l'entete plutot que sur un bouton qui a pu passer a la ligne. */
  #panneauFile{right:8px;left:8px;width:auto;top:auto;
    top:calc(env(safe-area-inset-top, 0px) + 52px)}
  /* Cibles tactiles : mesurees a 19 px de haut pour « mediatheque » et
     « sortir », 12 pour le lien « source ». Un doigt n'est pas un curseur — on
     ne change pas le dessin, on ajoute de la hauteur cliquable. */
  .compte button,.lien-admin,.jauge .source{min-height:34px;
    display:inline-flex;align-items:center}
  .nuages button{min-height:32px}
  /* Meme mesure pour la barre sous le champ et pour la rangee sous une
     esquisse : une cible plus petite que 34 px se manque au pouce. */
  .barre button,.au-propre button{min-height:34px}
  /* Meme regle pour « retirer » dans la bulle : c'est le seul geste possible
     sur une demande armee, et le manquer au pouce la laisse armee douze heures
     de plus. */
  .bandeau-tech .retirer-armee{min-height:34px}
  /* « joindre un fichier » est un <label>, pas un <button> : sans cette ligne il
     restait a 26 px a cote de deux boutons montes a 34, et la barre paraissait
     de travers. */
  .barre .joindre{min-height:34px;display:inline-flex;align-items:center}
  /* Les familles de la mediatheque defilaient lateralement, sans rien pour
     l'annoncer : « objets 3D » etait coupe et personne ne pouvait deviner qu'il
     fallait glisser. Sur telephone elles passent a la ligne — six etiquettes
     courtes tiennent en deux rangees, et plus rien n'est cache. */
  .onglets-media{flex-wrap:wrap;overflow-x:visible}
}
/* Sans survol, un bouton qui n'apparait qu'au survol n'apparait jamais. La
   croix qui ferme une conversation etait en opacity:0 : sur telephone, elle
   etait purement inatteignable, et fermer une conversation impossible. */
@media (hover:none){
  .conv .jeter{opacity:1;color:var(--encre-douce);padding:6px 8px;top:2px}
}
.nuages button{background:transparent;border:1px solid var(--trait);
  border-radius:20px;padding:1px 7px;font:13px/1.4 var(--sans);cursor:pointer;
  color:var(--encre-pale);transition:color .12s,border-color .12s,opacity .12s}
.nuages button:hover{border-color:var(--trait-vif);color:var(--encre)}
.nuages button.allume{color:var(--braise);border-color:var(--braise)}
.nuages button.eteint{opacity:.45}
/* PLAFOND DU MOIS. nuage_actif() refuse tant que le quota n'est pas repasse au
   mois suivant : l'interrupteur se repeignait donc eteint apres chaque clic, et
   un bouton qui ne repond pas se lit « en panne », pas « plafond atteint ». Le
   trait discontinu et le curseur ordinaire disent que ce bouton-la n'attend pas
   de clic, et la mention a cote dit pourquoi — une infobulle n'existe pas sous
   un doigt, et c'est justement sur telephone qu'on rouvre le studio le soir. */
.nuages button.plafonne{opacity:.3;border-style:dashed;cursor:default}
.nuages .plafond{border:1px solid var(--trait);border-radius:20px;padding:1px 8px;
  font:10.5px/1.6 var(--mono);color:var(--encre-pale);white-space:nowrap}
.nuages .plafond.atteint{color:var(--rouge);border-color:var(--rouge)}
/* Compte : discret, a droite de la barre. Rien ne s'affiche tant qu'aucun
   compte n'existe sur cette installation. */
.compte{display:flex;align-items:center;gap:6px;font:11px var(--mono)}
.compte button{background:transparent;border:1px solid var(--trait);
  border-radius:7px;padding:2px 8px;font:11px var(--mono);color:var(--encre-douce);
  cursor:pointer}
.compte button:hover{border-color:var(--braise);color:var(--braise)}
.compte b{color:var(--braise);font-weight:400}
/* « background:transparent » n'est pas un ornement : sans lui le navigateur
   applique son « buttonface » gris clair, et le bouton « mediatheque » ressortait
   en clair sur le theme sombre — contraste mesure 2,02:1, illisible, des le
   premier ecran. Le « sortir » d'a cote etait correct parce que sa classe le
   declare, elle. */
.lien-admin{font:11px var(--mono);color:var(--encre-douce);text-decoration:none;
  background:transparent;
  border:1px solid var(--trait);border-radius:7px;padding:2px 8px}
.lien-admin:hover{border-color:var(--braise);color:var(--braise)}
/* LE GLOBE ET SON MENU, d'un seul tenant. Le <select> n'a ni bordure ni fond
   propres : c'est l'ensemble qui porte le cadre, sinon on voyait deux boites
   emboitees a cote des boutons voisins qui n'en ont qu'une.
   « appearance:none » retire la fleche que le systeme ajoute — a onze pixels
   elle mangeait la moitie de la largeur — et le globe la remplace. */
.choix-langue{display:inline-flex;align-items:center;gap:4px;
  border:1px solid var(--trait);border-radius:7px;padding:1px 6px}
.choix-langue:hover{border-color:var(--braise)}
.choix-langue label{cursor:pointer;font-size:12px;line-height:1}
.choix-langue select{font:11px var(--mono);color:var(--encre-douce);
  background:transparent;border:0;padding:1px 0;cursor:pointer;
  appearance:none;-webkit-appearance:none}
.choix-langue:hover select{color:var(--braise)}
/* Le focus clavier doit rester VISIBLE : « appearance:none » efface aussi
   l'anneau que le systeme dessinait, et sans cette regle on ne sait plus ou
   l'on est en naviguant a la tabulation. */
.choix-langue select:focus-visible{outline:2px solid var(--braise);
  outline-offset:2px;border-radius:4px}
.voile-entree{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;
  align-items:center;justify-content:center;z-index:50}
.entree{background:var(--plan);border:1px solid var(--trait);border-radius:12px;
  padding:20px;width:min(320px,90vw);display:flex;flex-direction:column;gap:10px}
.entree h3{margin:0;font:600 14px var(--sans)}
.entree input{background:var(--creux);border:1px solid var(--trait);border-radius:7px;
  padding:8px 10px;color:var(--encre);font:13px var(--sans)}
.entree input:focus{outline:none;border-color:var(--braise)}
.entree .rang{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.entree .mal{color:var(--rouge);font:11px var(--mono);min-height:14px}
/* ── le second facteur ─────────────────────────────────────────────
   LE QR CODE NE SUIT PAS LE THEME, ET C'EST LA REGLE LA PLUS IMPORTANTE DE
   CE BLOC. Un QR se lit sur fond CLAIR avec des modules SOMBRES. Dessine avec
   « var(--encre) » sur « var(--plan) », il serait juste en theme clair et
   INVERSE en theme sombre — qui est le defaut de cette page — et beaucoup de
   lecteurs echouent alors en silence : l'appareil photo ne montre rien, aucun
   message, et l'utilisateur croit que son telephone est en cause. Le blanc et
   le noir sont donc ecrits en clair ici ET dans les attributs « fill » du SVG,
   des deux cotes, parce qu'une seule des deux ecritures suffirait a etre
   oubliee au prochain remaniement du theme.
   LA ZONE DE SILENCE EST DANS LE DESSIN, PAS DANS LA MISE EN PAGE : quatre
   modules de marge blanche, ce que la norme exige, poses dans le viewBox du
   SVG. Une marge CSS ne la donnerait pas — un « padding » se supprime, se
   recouvre, et disparait quand la boite retrecit, alors que le viewBox
   l'emporte partout avec l'image.
   240 px de cote : le code le plus grand qu'un enrolement produise est un
   9-M, soit 53 modules avec sa marge, ce qui fait 4,5 px par module. En
   dessous de trois, les appareils photo de telephone decrochent.
   « line-height:0 » sur la boite : sans lui, la ligne de base ajoute quatre
   pixels sous le SVG et la marge blanche n'est plus symetrique. */
.entree .qr{width:min(240px,100%);margin:0 auto;background:#fff;
  border-radius:7px;line-height:0}
.entree .qr svg{display:block;width:100%;height:auto}
/* LE SECRET RESTE ECRIT EN TOUTES LETTRES SOUS LE CODE, et ce n'est pas de la
   redondance : un QR ne se recopie pas a la main quand l'appareil photo ne
   marche pas, et c'est le SEUL chemin pour quelqu'un qui enrole depuis la
   machine meme qui affiche l'ecran — le telephone ne peut pas se photographier.
   « user-select:all » fait qu'un seul clic prend les trente-deux caracteres au
   lieu du groupe de quatre sous le curseur, et « word-break » evite qu'ils
   sortent de la boite sur un telephone. */
.entree .secret{font:600 14px var(--mono);letter-spacing:.06em;user-select:all;
  background:var(--creux);border:1px solid var(--trait);border-radius:7px;
  padding:8px 10px;word-break:break-all}
/* Deux colonnes : dix codes en une seule font une liste qu'on recopie de
   travers, et la grille les aligne pour qu'on voie tout de suite qu'il y en a
   dix. */
.entree .secours{display:grid;grid-template-columns:1fr 1fr;gap:4px 14px;
  margin:0;padding:0;list-style:none;font:13px var(--mono);user-select:all}
.entree .avertit{color:var(--braise);font:11px var(--sans);line-height:1.45}
.entree .dit{color:var(--encre-douce);font:11px var(--sans);line-height:1.45}
.entree .otp{color:var(--braise);font:11px var(--mono);word-break:break-all}
.file-vive{color:var(--braise);border:1px solid var(--braise);border-radius:20px;
  padding:3px 10px}

.corps{flex:1;display:flex;min-height:0}

/* ── colonne des conversations ───────────────────────────────────── */
aside{width:236px;flex:none;background:var(--plan);border-right:1px solid var(--trait);
  display:flex;flex-direction:column;min-height:0}
.neuve{margin:12px;padding:8px;border:1px dashed var(--trait-vif);border-radius:8px;
  background:transparent;color:var(--encre-douce);font:12px var(--mono);cursor:pointer}
.neuve:hover{border-style:solid;border-color:var(--braise);color:var(--braise)}
.convs{flex:1;overflow-y:auto;padding:0 8px 12px}
.moteur{border-top:1px solid var(--trait);padding:10px 12px;font:11px var(--mono);
  color:var(--encre-douce);display:flex;flex-direction:column;gap:7px}
.moteur .ligne{display:flex;align-items:center;gap:7px}
.pastille{width:8px;height:8px;border-radius:50%;background:var(--trait-vif);flex:none}
.pastille.vif{background:#5da271;box-shadow:0 0 6px #5da27188}
.pastille.mort{background:#a2545d}
.moteur .detail{color:var(--encre-tres-douce,var(--encre-douce));opacity:.75;font-size:10px}
.moteur button{flex:1;padding:5px;border:1px solid var(--trait-vif);border-radius:6px;
  background:transparent;color:var(--encre-douce);font:11px var(--mono);cursor:pointer}
.moteur button:hover:not(:disabled){border-color:var(--braise);color:var(--braise-vive)}
.moteur button:disabled{opacity:.35;cursor:default}
.conv{position:relative;padding:8px 26px 8px 11px;border-radius:7px;cursor:pointer;
  font-size:13.5px;line-height:1.4;color:var(--encre-douce);margin-bottom:2px}
.conv:hover{background:var(--relief)}
.conv.active{background:var(--braise-sourde);color:var(--encre)}
.conv.active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;
  background:var(--braise);border-radius:2px}
.conv small{display:block;font:10px var(--mono);color:var(--encre-pale);margin-top:2px}
.conv .jeter{position:absolute;right:5px;top:6px;border:0;background:transparent;
  color:var(--encre-douce);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;
  opacity:0;border-radius:4px}
.conv:hover .jeter{opacity:1}
.conv .jeter:hover{color:var(--rouge);background:var(--creux)}

/* ── fil ─────────────────────────────────────────────────────────── */
main{flex:1;overflow-y:auto;min-width:0}
.fil{max-width:880px;margin:0 auto;padding:26px 22px 30px;
  display:flex;flex-direction:column;gap:26px}
.vide{text-align:center;padding:64px 20px;color:var(--encre-pale)}
.vide h1{font:400 27px/1.3 var(--serif);color:var(--encre-douce);margin:0 0 10px;
  letter-spacing:-.01em}
.vide p{margin:0 auto;max-width:44ch;font-size:14.5px}

.demande{align-self:flex-end;max-width:74%;background:var(--braise-sourde);
  border:1px solid var(--trait-vif);border-radius:12px 12px 3px 12px;
  padding:11px 15px;font-size:15px}
.demande .heure{display:block;font:10.5px var(--mono);color:var(--encre-pale);
  margin-top:5px;letter-spacing:.04em}

.reponse{position:relative;padding-left:20px}
.reponse::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:3px;
  border-radius:2px;background:linear-gradient(var(--braise),transparent)}
.reponse.rate::before{background:var(--rouge)}
.bandeau-tech{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:11px;
  font:11px var(--mono);letter-spacing:.02em}
.puce{border:1px solid var(--trait-vif);border-radius:20px;padding:2px 9px;
  color:var(--encre-douce);background:var(--creux);white-space:nowrap}
/* PAS de « .puce.moteur » ici. La regle existait, n'etait posee sur aucun
   element, et portait le nom d'une autre : « .moteur » est le panneau des
   machines dans la colonne de gauche (border-top, colonne flex, gap 7px). Une
   pastille qui aurait porte les deux classes en aurait herite « display:flex ;
   flex-direction:column », plus les regles descendantes « .moteur button » et
   « .moteur .ligne ». Le nom d'une classe de MISE EN PAGE ne se reprend pas
   comme couleur de pastille — banc_page.py le refuse desormais. */
.puce.rate{color:var(--rouge);border-color:var(--rouge)}
/* « en cours » porte jusqu'a 64 caracteres du journal — « NAS ZimaOS (GTX
   1060) calcule deja pour quelqu'un… ». En 11 px mono, cela fait plus de
   400 px : a 375 px de large, la pastille sortait de « main » et poussait une
   barre de defilement horizontale sur toute la page. Le meme remede que
   « .puce.armee », qui portait deja un texte long : on autorise le retour a la
   ligne. « anywhere » en plus, parce qu'un nom de fichier ou une adresse n'a
   aucune espace ou se couper. */
.puce.cours{color:var(--braise-vive);border-color:var(--braise-vive);
  white-space:normal;overflow-wrap:anywhere}
.puce.attente{color:var(--encre-pale);border-style:dashed}
/* LE DEVIS. Ni la braise (qui dit « ça se passe maintenant ») ni le vert (qui
   dit « c'est acquis ») : c'est une mediane de rendus passes, donc une
   indication. Le pointille le dit sans un mot de plus, et il se distingue du
   tirete de « en attente » aussi bien sur le creux clair que sur le sombre. */
.puce.devis{color:var(--encre-pale);border-style:dotted}
/* Passe le temps annonce, garder « ≈ 4 min » sous les yeux d'un rendu qui en
   est a six ferait mentir le studio. La braise reprend la main : quelque chose
   sort de l'ordinaire, sans pour autant etre une panne. C'est « braise-vive »
   et non « braise » : sur le creux clair, la seconde mesure 3,97:1 — sous les
   4,5:1 qu'un texte de 11 px reclame — la que la vive donne 5,8:1. Le pointille
   reste, il suffit a distinguer la pastille de celle du travail en cours. */
.puce.devis.depasse{color:var(--braise-vive);border-color:var(--braise)}
/* Armee : la demande n'est ni en cours ni dans la file, elle attend le retour
   d'une machine en pause. Le meme tirete pale que « en attente » — c'est bien
   une attente — mais avec le ⏸ que le panneau de file lui donne deja a la place
   de son rang, pour qu'on reconnaisse la meme demande aux deux endroits. */
.puce.armee{color:var(--encre-pale);border-style:dashed;white-space:normal}
/* Le seul recours de l'utilisateur, la ou il regarde. Il existait deja dans le
   panneau de file, qu'il faut ouvrir — et le compteur qui l'ouvre restait vide
   quand la seule demande en jeu etait armee : le recours etait donc
   inatteignable pendant douze heures. */
.bandeau-tech .retirer-armee{background:transparent;border:1px solid var(--trait-vif);
  border-radius:7px;padding:2px 9px;font:11px var(--mono);color:var(--encre-pale);
  cursor:pointer}
.bandeau-tech .retirer-armee:hover:not(:disabled){border-color:var(--rouge);
  color:var(--rouge)}
.bandeau-tech .retirer-armee:disabled{opacity:.4;cursor:default}
/* Un brouillon reussi n'a aucune marque propre : meme cadre, meme legende
   qu'une image finie. Le trait discontinu dit « pas encore fini » sans mot de
   plus, et il tient dans les deux themes — la braise est la seule couleur qui
   soit lisible sur le creux clair comme sur le creux sombre. */
.puce.esquisse{color:var(--braise);border-color:var(--braise);border-style:dashed}
/* Le brouillon a montre le sujet et l'ambiance ; la question suivante est « et
   en soigne ? ». Elle se pose sous l'image, pas au fond du depliant des
   details. Le nom « au-propre » est celui de la route et reste tel quel ; le
   LIBELLE, lui, dit « refaire » — parce qu'on n'obtient pas cette image en
   mieux, on obtient le meme sujet autrement cadre. */
.au-propre{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px;
  font:11px var(--mono);color:var(--encre-pale)}
.au-propre button{background:transparent;border:1px solid var(--braise);
  border-radius:8px;padding:4px 11px;font:11.5px var(--mono);color:var(--braise);
  cursor:pointer}
.au-propre button:hover:not(:disabled){background:var(--braise-sourde)}
.au-propre button:disabled{opacity:.45;cursor:default}
.au-propre .fait{color:var(--vert)}
.au-propre .mal{color:var(--rouge)}
/* Quatre variantes sont quatre bulles qui se suivent : meme demande, meme
   prompt, meme moteur, meme minute. Sans leur rang, on ne sait plus laquelle
   on regarde — c'est le meme aveuglement que la mediatheque avait avant
   d'afficher « variante 2 sur 4 ». Le rang se lit SOUS l'image, avec le geste
   qui la designe, parce que c'est la qu'on compare ; au fond du depliant
   « details » il ne servirait a personne. */
.variante{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:9px;
  font:11px var(--mono);color:var(--encre-pale)}
.variante .rang{border:1px solid var(--trait-vif);border-radius:20px;
  padding:2px 9px;background:var(--creux)}
/* Creux et gris la ou « refaire en soigne » est braise : deux boutons braise
   sous la meme image poseraient « lequel je presse ? » a chaque variante, et
   celui-ci ne lance aucun rendu — il ne fait que designer. */
.variante button{background:transparent;border:1px solid var(--trait-vif);
  border-radius:8px;padding:4px 11px;font:11.5px var(--mono);
  color:var(--encre-douce);cursor:pointer}
.variante button:hover:not(:disabled){border-color:var(--braise);color:var(--braise)}
.variante button:disabled{opacity:.45;cursor:default}
.variante .fait{color:var(--vert)}
.variante .mal{color:var(--rouge)}
/* L'ENCADRE, et pas seulement un mot. De quatre images empilees, celle que
   « la » designe doit se reconnaitre en parcourant la colonne, sans lire — la
   phrase « agrandis-la » se tape sans remonter le fil. Le filet de gauche
   passe du degrade au plein pour la meme raison : il se voit du coin de l'oeil
   quand l'image est deja sortie de l'ecran. */
.reponse.retenue::before{background:var(--braise)}
.reponse.retenue .sortie img,.reponse.retenue .sortie video{
  outline:2px solid var(--braise);outline-offset:2px}
.sortie img,.sortie video{display:block;max-width:100%;border-radius:9px;
  border:1px solid var(--trait);background:var(--creux)}
.sortie audio{width:100%;margin-top:4px}
.sortie a{color:var(--braise)}
/* La vue plein ecran : fond opaque, media borne a l'ecran, rien d'autre. */
.plein{position:fixed;inset:0;z-index:60;background:#000000e6;display:flex;
  align-items:center;justify-content:center;padding:18px}
.plein img,.plein video{max-width:100%;max-height:100%;border-radius:6px}
.plein .fermer{position:absolute;top:12px;right:14px;background:#0006;
  border:1px solid #fff4;color:#fff;border-radius:9px;padding:6px 11px;
  font:13px var(--mono);cursor:pointer}
.plein .fermer:hover{background:#0009}
/* La mediatheque prend tout l'ecran : on vient y chercher quelque chose, pas
   jeter un oeil en passant. */
#mediatheque{position:fixed;inset:0;z-index:50;background:var(--nuit);
  display:flex;flex-direction:column}
#mediatheque[hidden]{display:none}
#mediatheque > header{display:flex;align-items:center;gap:12px;padding:12px 18px;
  border-bottom:1px solid var(--trait);background:var(--plan);flex:none}
#mediatheque > header > b{font:600 14px var(--sans)}
#mediatheque > header > button:last-child{margin-left:auto;background:transparent;
  border:1px solid var(--trait);border-radius:8px;padding:4px 10px;cursor:pointer;
  color:var(--encre-douce);font:12px var(--mono)}
.onglets-media{display:flex;gap:5px;overflow-x:auto}
.onglets-media button{background:transparent;border:1px solid var(--trait);
  border-radius:8px;padding:4px 10px;font:11.5px var(--mono);cursor:pointer;
  color:var(--encre-douce);white-space:nowrap}
.onglets-media button.ouvert{border-color:var(--braise);color:var(--braise)}
.onglets-media button:disabled{opacity:.35;cursor:default}
/* La barre de tri : une ligne qui se replie, jamais une colonne de reglages.
   Trois cents pieces sans moyen de chercher, c'est un dossier, pas une
   mediatheque. */
#filtresMedia{display:flex;flex-wrap:wrap;gap:7px;align-items:center;
  padding:10px 18px 0;font:11.5px var(--mono)}
#filtresMedia input,#filtresMedia select{background:transparent;
  color:var(--encre-douce);border:1px solid var(--trait-vif);border-radius:7px;
  padding:5px 9px;font:11.5px var(--mono);min-width:0}
#filtresMedia input{flex:1 1 220px}
#filtresMedia input:focus-visible,#filtresMedia select:focus-visible{
  outline:2px solid var(--braise);outline-offset:1px}
.detail-media{color:var(--encre-pale);margin-left:auto}
/* Le prompt reellement envoye, replie. Il explique un rendu qu'on ne
   s'explique pas, et il n'etait visible nulle part. */
.media .envoye{display:block;margin-top:4px;color:var(--encre-pale);
  font:10px var(--mono);white-space:pre-wrap;word-break:break-word}
.media details summary{cursor:pointer;color:var(--encre-pale);font:10px var(--mono)}
/* Regarder la production de tout le monde ne doit jamais se faire sans le
   savoir : la mention est a cote des familles, pas cachee en bas. */
.vue-admin{font:10.5px var(--mono);color:var(--braise);align-self:center}
#grilleMedia{flex:1;overflow:auto;padding:16px 18px 40px;display:grid;gap:16px;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));align-content:start}
.media{margin:0;background:var(--plan);border:1px solid var(--trait);
  border-radius:11px;padding:10px;display:flex;flex-direction:column;gap:7px}
.media img,.media video{width:100%;border-radius:7px;display:block}
.media audio{width:100%}
.media .cube{font-size:38px;text-align:center;color:var(--encre-pale);padding:18px 0}
/* Trois jours plus tard, rien ne distinguait une esquisse d'une image finie :
   meme vignette, meme legende, et l'on croit avoir deja fait ce qu'on n'a
   qu'essaye. La marque est posee SUR la vignette, la ou l'oeil arrive en
   parcourant la grille, et non dans la legende qu'on ne lit qu'apres avoir
   choisi. « pointer-events:none » : le clic doit continuer d'agrandir. */
.cadre-media{position:relative;display:block}
.cadre-media .marque-esquisse{position:absolute;left:7px;top:7px;
  background:var(--braise);color:var(--nuit);border-radius:6px;padding:1px 7px;
  font:10.5px/1.7 var(--mono);letter-spacing:.04em;pointer-events:none}
/* Meme raison que la marque de brouillon, et a l'oppose pour qu'une esquisse
   retenue porte les deux sans qu'elles se recouvrent. Vert et non braise : la
   braise dit « pas encore fini », celle-ci dit un choix fait. */
.repartir{display:block;margin-top:5px;padding:2px 9px;border:1px solid var(--trait-vif);
  border-radius:20px;background:transparent;color:var(--encre-douce);
  font:11px var(--mono);cursor:pointer}
.repartir:hover:not(:disabled){border-color:var(--braise);color:var(--braise)}
.repartir:disabled{opacity:.5;cursor:default}
.cadre-media .marque-retenue{position:absolute;right:7px;top:7px;
  background:var(--vert);color:var(--nuit);border-radius:6px;padding:1px 7px;
  font:10.5px/1.7 var(--mono);letter-spacing:.04em;pointer-events:none}
.media figcaption{font:12.5px var(--serif);display:flex;flex-direction:column;gap:2px}
.media figcaption small{font:10.5px var(--mono);color:var(--encre-pale)}
.vide-media{color:var(--encre-pale);font-style:italic}
.actions-sortie{display:flex;gap:7px;margin-top:7px}
.actions-sortie a,.actions-sortie button{font:11px var(--mono);
  color:var(--encre-douce);background:transparent;text-decoration:none;
  border:1px solid var(--trait);border-radius:7px;padding:3px 9px;cursor:pointer}
.actions-sortie a:hover,.actions-sortie button:hover{border-color:var(--braise);
  color:var(--braise)}
.actions-sortie button:disabled{opacity:.4;cursor:default}
.lecture{font-size:15px;white-space:pre-wrap;color:var(--encre-douce);
  border-left:2px solid var(--trait-vif);padding-left:14px}
.echec{color:var(--rouge);font:13.5px var(--sans)}
.echec button{margin-left:10px;background:transparent;border:1px solid var(--rouge);
  border-radius:7px;padding:2px 9px;font:11.5px var(--mono);color:var(--rouge);
  cursor:pointer}
.echec button:hover{background:var(--rouge);color:var(--plan)}
.question{border:1px solid var(--braise);border-radius:9px;background:var(--braise-sourde);
  padding:13px 15px}
.question p{margin:0 0 4px;font-size:14.5px}
.question ul{margin:0 0 11px;padding-left:19px}
.question li{margin:3px 0;font-size:14.5px}
.question .repondre{display:flex;gap:9px;align-items:flex-end}
.question input{flex:1;background:var(--creux);border:1px solid var(--trait-vif);
  border-radius:8px;color:var(--encre);padding:9px 12px;font:14.5px var(--serif)}
.question input:focus-visible{outline:2px solid var(--braise);outline-offset:1px}
.question button{background:var(--braise);border:1px solid var(--braise);color:var(--nuit);
  border-radius:8px;padding:9px 15px;font:12px var(--mono);cursor:pointer;font-weight:600}
.question button:hover{filter:brightness(1.12)}
.nomfic{font:10.5px var(--mono);color:var(--encre-pale);margin-top:6px}
/* Le moteur employe se lit, mais ne se dispute pas la place avec l'image. */
.signature{font:10.5px var(--mono);color:var(--encre-pale);margin-top:8px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.signature .sep{opacity:.5}
.signature .avis{margin-top:0}
.signature .refaire-grand{margin-left:6px;padding:2px 9px;border:1px solid var(--braise);
  border-radius:20px;background:transparent;color:var(--braise);
  font:11px var(--mono);cursor:pointer}
.refaire-grand:hover:not(:disabled){border-color:var(--braise-vive);
  color:var(--braise-vive)}
.refaire-grand:disabled{opacity:.5;cursor:default}
.avis button{padding:1px 7px;font-size:13px}
/* Avis : discret tant qu'on n'a rien dit, franc une fois le pouce pose. */
.avis{display:flex;align-items:center;gap:6px;margin-top:12px}
.avis button{background:transparent;border:1px solid var(--trait);border-radius:7px;
  padding:3px 9px;font:14px/1.2 var(--sans);color:var(--encre-pale);cursor:pointer;
  transition:color .12s,border-color .12s}
.avis button:hover{color:var(--encre);border-color:var(--trait-vif)}
.avis button.pris.haut{color:var(--vert);border-color:var(--vert)}
.avis button.pris.bas{color:var(--rouge);border-color:var(--rouge)}
.avis .merci{font:11px var(--mono);color:var(--encre-pale)}
.avis-note{display:flex;gap:6px;margin-top:7px}
.avis-note input{flex:1;background:var(--creux);border:1px solid var(--trait);
  border-radius:7px;padding:6px 9px;color:var(--encre);font:12.5px var(--sans)}
.avis-note input:focus{outline:none;border-color:var(--braise)}
.avis-note button{font:12px var(--mono)}
details.detail{margin-top:10px}
details.detail summary{cursor:pointer;font:11px var(--mono);color:var(--encre-pale);
  letter-spacing:.05em;text-transform:uppercase;list-style:none}
details.detail summary::-webkit-details-marker{display:none}
details.detail summary::before{content:"▸ ";color:var(--braise)}
details.detail[open] summary::before{content:"▾ "}
details.detail summary:hover{color:var(--encre-douce)}
.corps-detail{margin-top:9px;padding:11px 13px;background:var(--creux);
  border:1px solid var(--trait);border-radius:8px;
  font:11.5px/1.75 var(--mono);color:var(--encre-douce);
  max-height:230px;overflow:auto;white-space:pre-wrap}


/* ── saisie ──────────────────────────────────────────────────────── */
footer{flex:none;border-top:1px solid var(--trait);background:var(--plan)}
.saisie{max-width:880px;margin:0 auto;padding:14px 22px 17px}
.champ{display:flex;gap:11px;align-items:flex-end}
textarea{flex:1;min-height:50px;max-height:190px;resize:none;padding:12px 14px;
  background:var(--creux);color:var(--encre);border:1px solid var(--trait-vif);
  border-radius:10px;font:15.5px/1.5 var(--serif)}
textarea::placeholder{color:var(--encre-pale)}
textarea:focus-visible{outline:2px solid var(--braise);outline-offset:1px;
  border-color:var(--braise)}
.envoyer{flex:none;width:50px;height:50px;border-radius:10px;cursor:pointer;
  background:var(--braise);border:1px solid var(--braise);color:var(--nuit);
  font-size:19px;line-height:1;display:grid;place-items:center;
  transition:transform .12s ease,filter .12s ease}
.envoyer:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
.envoyer:disabled{opacity:.4;cursor:default}
.envoyer:focus-visible{outline:2px solid var(--braise-vive);outline-offset:2px}
/* Le brouillon a cote de la fleche, et non dans la barre : c'est le geste qu'on
   repete quand on cherche, il doit etre sous le pouce. Creux la ou l'envoi est
   plein — deux boutons pleins cote a cote poseraient « lequel je presse ? » a
   chaque demande. Le signe « ≈ » dit le a-peu-pres, ce qu'un brouillon est. */
.envoyer.esquisser{background:transparent;color:var(--braise);
  border:1px dashed var(--braise);font-size:22px;width:44px}
.envoyer.esquisser:hover:not(:disabled){background:var(--braise-sourde);
  border-style:solid}
.outils{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px}
/* Barre repliee : joindre, reglages, et ce qui est actif. */
.barre{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:9px}
.barre button{background:transparent;border:1px solid var(--trait);border-radius:8px;
  padding:4px 10px;font:11.5px var(--mono);color:var(--encre-douce);cursor:pointer}
.barre button:hover{border-color:var(--braise);color:var(--braise)}
.barre button.ouvert{border-color:var(--braise);color:var(--braise)}
.actifs{font:11px var(--mono);color:var(--braise);display:flex;gap:7px;flex-wrap:wrap}
/* Un changement de reglage n'est pas un echange : ni bulle, ni auteur, ni
   horodatage en evidence. Il se glisse entre deux tours a la maniere d'une
   didascalie — assez pale pour qu'on le lise seulement quand on le cherche,
   assez present pour repondre a « pourquoi celle-ci est en 1024 ? » trois jours
   plus tard. */
.murmure{margin:10px 0 10px 2px;font:italic 11.5px/1.5 var(--serif);
  color:var(--encre-pale);display:flex;gap:8px;align-items:baseline}
.murmure .quand{font:10.5px var(--mono);opacity:.7;flex:none}
/* « C'etait plutot quoi ? » — une rangee de mots a cliquer, pas un formulaire.
   Elle n'apparait qu'apres un pouce en bas, et repondre n'est jamais exige. */
.avis-quoi{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:7px}
.avis-quoi span{font:11.5px var(--mono);color:var(--encre-pale)}
.avis-quoi .fait{color:var(--vert)}
.avis-quoi button{background:transparent;border:1px solid var(--trait);
  border-radius:8px;padding:3px 9px;font:11.5px var(--mono);
  color:var(--encre-douce);cursor:pointer}
.avis-quoi button:hover{border-color:var(--braise);color:var(--braise)}
.actifs .oter{cursor:pointer;border-bottom:1px dotted var(--braise)}
.outils.replie{display:none}
.outils select,.outils label.joindre{background:transparent;color:var(--encre-douce);
  border:1px solid var(--trait-vif);border-radius:7px;padding:5px 11px;
  font:11.5px var(--mono);cursor:pointer;letter-spacing:.02em}
/* Un <select> en flex prend la largeur de sa PLUS LONGUE option, pas celle de
   l'option choisie : « FLUX.2 klein 9B pleine precision (a telecharger) » faisait
   379 px dans un conteneur de 331, mesure sur telephone. Avec
   « body{overflow-x:hidden} » il n'y avait meme pas de defilement pour aller
   voir : la fleche du menu etait hors ecran, coupee net. Le meme remede est
   applique a l'en-tete plus bas, avec le meme commentaire — il avait ete oublie
   ici. */
.outils select{min-width:0;max-width:100%}
.outils label.joindre:hover{border-color:var(--braise);color:var(--braise)}
.outils select:focus-visible,.outils label.joindre:focus-within{
  outline:2px solid var(--braise);outline-offset:2px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.jointe{display:flex;align-items:center;gap:9px;margin-top:9px;padding:6px 9px;
  background:var(--creux);border:1px solid var(--trait);border-radius:8px}
.jointe img,.jointe video{height:38px;border-radius:5px;display:block}
.jointe .genre{font:16px/1 var(--sans)}
.jointe span{flex:1;font:11.5px var(--mono);color:var(--encre-douce);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jointe button{background:transparent;border:1px solid var(--trait-vif);border-radius:6px;
  color:var(--encre-douce);font:11px var(--mono);padding:4px 9px;cursor:pointer}
.alerte{margin-top:9px;color:var(--rouge);font:13px var(--sans)}

.tiroir-bouton{display:none;background:transparent;border:1px solid var(--trait-vif);
  border-radius:8px;color:var(--encre-douce);font:14px var(--mono);cursor:pointer;
  padding:4px 10px;margin-right:10px}
.voile{display:none;position:fixed;inset:0;background:#0008;z-index:8}
@media (max-width:820px){
  .tiroir-bouton{display:block}
  aside{position:fixed;top:0;bottom:0;left:0;z-index:9;width:82vw;max-width:300px;
    transform:translateX(-102%);transition:transform .22s ease;
    box-shadow:2px 0 18px #0007}
  body.ouvert aside{transform:none}
  body.ouvert .voile{display:block}
  footer .outils{flex-wrap:wrap}
  header{flex-wrap:wrap;row-gap:8px;padding:10px 12px}
  /* La jauge se replie au lieu d'elargir la page. « min-width:0 » est ce qui
     autorise vraiment le repli : sans lui, un enfant de flex refuse de passer
     sous sa largeur de contenu et pousse tout dehors. */
  header .jauge{gap:8px;row-gap:6px;flex-wrap:wrap;min-width:0;
    justify-content:flex-end}
  header .marque{flex:0 0 auto}
  .compte{flex-wrap:wrap;min-width:0}
  .compte b{max-width:12ch;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

<header>
  <!-- « data-t » : la cle du dictionnaire qui porte ce texte-la.
       LE FRANCAIS RESTE ECRIT ICI, ET CE N'EST PAS UNE REDONDANCE. C'est la
       valeur par defaut — un francophone ne voit pas une page vide le temps
       d'un aller-retour vers /api/textes — ET c'est la moitie d'un contrat :
       banc_page.py exige que ce texte-ci soit EXACTEMENT celui du
       dictionnaire, comme banc_refaire.py exige que MARQUE_DEJA soit le meme
       des deux cotes. Sans cela, une phrase reformulee d'un seul cote
       laisserait un lecteur anglais devant une traduction devenue fausse, et
       personne pour le voir.
       « data-t-X » fait la meme chose pour l'attribut X : « data-t-title »,
       « data-t-placeholder », « data-t-aria-label », « data-t-data-court ».
       LES aria-label EN FONT PARTIE : un lecteur d'ecran anglophone a qui
       l'on annonce « Afficher les conversations » n'est pas servi. -->
  <button class="tiroir-bouton" id="tiroir"
          data-t-aria-label="page.tiroir.aria"
          aria-label="Afficher les conversations">☰</button>
  <span class="marque">Comfy<em>Studio</em></span>
  <div class="jauge">
    <span id="etatFile"></span>
    <span id="jaugeModeles"><b data-t="page.moteurs.connexion">connexion…</b></span>
    <span class="nuages" id="nuages"></span>
    <!-- LE MENU DE LANGUE, DANS L'EN-TETE ET NON DANS LES REGLAGES. Il y a
         vecu une heure, sous le bouton « reglages » du pied de page, et c'est
         un mauvais domicile pour deux raisons. La premiere se voit : ce
         panneau ne s'ouvre que pour changer de moteur ou de taille, si bien
         que la langue etait cachee derriere un geste qui n'a rien a voir. La
         seconde est un fait de code, et c'est elle qui tranche : les quatre
         reglages de ce panneau sont portes par LA CONVERSATION, et la langue
         ne l'est pas — elle vit dans le cookie « studio_langue ». Les ranger
         ensemble promettait un murmure de reglage qui ne viendrait jamais.

         LE GLOBE EST UN LABEL, PAS UN BOUTON. Cliquer dessus ouvre le menu
         natif, un lecteur d'ecran annonce l'etiquette, et il n'y a aucun
         gestionnaire a ecrire : « for » suffit. Un bouton avec son propre
         menu aurait demande du clavier, du focus et une fermeture au clic
         dehors — trois choses qu'un <select> fait deja bien.

         Ses options sont ecrites en une fois par peindreMenuLangue(), comme
         garnirChoix() le fait pour les quatre menus de la mediatheque : ce
         n'est pas un menu de reglage, il n'a donc pas de libelle court. -->
    <span class="choix-langue">
      <label for="langue" aria-hidden="true" title="langue de l'interface"
             data-t-title="page.langue.title">🌐</label>
      <select id="langue" data-t-aria-label="page.langue.aria"
              aria-label="Langue"></select>

                data-t="page.variantes.3">3 variantes</option>

<script>
const $ = s => document.querySelector(s);

/* ══ CE QUE LA PAGE DIT, DANS LA LANGUE DE SON LECTEUR ═══════════════════
   Le dictionnaire vient de /api/textes, qui sert AUSSI la langue retenue —
   cookie « studio_langue » d'abord, en-tete « Accept-Language » ensuite
   (serveur.py, langue_de). La page ne decide donc rien : elle affiche.

   LE FRANCAIS EST DANS LE HTML, ET LES CLES SONT DES IDENTIFIANTS. Indexer
   sur le francais paraissait plus simple et c'est un piege mesure : la page
   ecrit « c’était » avec une apostrophe typographique et « l'esquisse » avec
   une droite — deux cles pour un mot, et une reformulation cote francais
   perdrait la traduction sans rien dire (docs/plusieurs-langues.md). */
const LANGUE_SOURCE = "fr";
let LANGUE = LANGUE_SOURCE;
let LANGUES = [LANGUE_SOURCE];
let TEXTES = {};

/* SA PROPRE COPIE DE LA REGLE DU PLURIEL, et non celle du serveur : la page
   compte des choses que le serveur ne voit jamais — les pieces jointes qu'on
   vient de deposer, les conversations de la barre laterale, le nombre de
   variantes d'un menu. La table est celle de traductions.PLURIELS, et
   banc_page.py exige qu'elle en soit la copie exacte : le francais met 0 ET 1
   au singulier, l'anglais met 0 au PLURIEL. La page ecrivait auparavant
   « ${n} echange${n > 1 ? "s" : ""} » a chaque endroit qui compte quelque
   chose — la regle FRANCAISE, recopiee, dans du code d'interface, et fausse
   en anglais des zero. */
const PLURIELS = {
  fr: n => (n > 1 ? 1 : 0),
  en: n => (n !== 1 ? 1 : 0),
};

/* La date et l'heure suivent la langue. « en-GB » et non « en-US » : tout le
   studio ecrit des horloges de 24 heures — le journal, le panneau de file, la
   ligne « 14:07 » de chaque demande —, et une bulle en AM/PM au milieu d'elles
   se lit comme une autre heure. */
const LOCALES = { fr: "fr-FR", en: "en-GB" };
const locale = () => LOCALES[LANGUE] || LOCALES[LANGUE_SOURCE];

/* « encore 40 min » ou « encore 11 h », ECRIT UNE FOIS. Les deux endroits qui
   l'affichent — le panneau de file et la bulle d'une demande armee — se
   recopiaient l'un l'autre, seuil et unites compris ; le second annonce meme
   « meme formulation que dans le panneau de file », ce qui est le nom exact du
   defaut. Le seuil de 1,5 h est celui d'origine : en dessous, les minutes
   disent quelque chose ; au-dessus, elles font un nombre qu'on ne lit plus. */
const dureeRestante = h =>
  h < 1.5 ? T("page.duree.min", { n: Math.round(h * 60) })
          : T("page.duree.h", { n: Math.round(h) });

/* Les valeurs interpolees : « {titre} », « {n} ». Le meme releve que
   banc_traductions.py fait sur le dictionnaire, pour que les deux moities
   parlent du meme gabarit. */
const _VALEUR = /\{([a-z_][a-z0-9_]*)\}/g;

/* traductions.T(), en JavaScript. Les trois replis sont les siens, et pour la
   meme raison : un studio qui repond en francais est genant, un studio qui
   rend une page blanche est casse.
     - une cle inconnue rend SA PROPRE CLE — laid, et ca se voit tout de suite ;
     - une valeur manquante rend le gabarit BRUT, accolades comprises ;
     - « nombre » choisit la forme selon la regle de la LANGUE, jamais celle
       du site d'appel. */
function T(cle, valeurs) {
  let formes = TEXTES[cle];
  if (formes === undefined || formes === null) return cle;
  const v = Object.assign({}, valeurs || {});
  if (Array.isArray(formes)) {
    const regle = PLURIELS[LANGUE] || PLURIELS[LANGUE_SOURCE];
    formes = formes[regle(Number(v.n) || 0)];
  }
  if (typeof formes !== "string") return cle;
  let manque = false;
  const rendu = formes.replace(_VALEUR, (tout, nom) => {
    if (v[nom] === undefined || v[nom] === null) { manque = true; return tout; }
    return String(v[nom]);
  });
  return manque ? formes : rendu;
}

/* traductions.rendre() : une MARQUE de panne mise en phrase.

   UNE VALEUR PEUT ETRE UNE MARQUE, et c'est le seul cas d'imbrication —
   « ERREUR : {quoi} » recoit au site d'appel de echouer() une PHRASE du
   dictionnaire, pas une valeur calculee. Sans ce tour, l'anglophone lisait
   « ERROR: la machine n'est pas revenue a temps » : une demi-phrase traduite,
   qui se remarque moins qu'une phrase entierement francaise et trompe donc
   plus longtemps. UN SEUL NIVEAU : aucun site d'appel n'en demande deux, et
   une recursion sans borne sur des donnees servies par HTTP est une porte
   qu'on n'ouvre pas sans raison (traductions.rendre, serveur.MARQUE_PANNE). */
function rendrePanne(marque) {
  if (!marque || typeof marque !== "object" || !marque.cle) return "";
  const valeurs = {};
  for (const [nom, v] of Object.entries(marque.valeurs || {}))
    valeurs[nom] = (v && typeof v === "object" && v.cle)
                 ? T(v.cle, v.valeurs || {}) : v;
  return T(marque.cle, valeurs);
}

/* La passe d'ecriture. « data-t » pose le texte, « data-t-X » pose
   l'attribut X — « data-t-aria-label », « data-t-data-court ». Un seul
   parcours, au chargement : la page ne se repeint pas a chaud, elle se
   RECHARGE quand on change de langue (voir le menu, plus bas). */
function traduirePage() {
  for (const el of document.querySelectorAll("[data-t]"))
    el.textContent = T(el.getAttribute("data-t"));
  for (const el of document.querySelectorAll("*"))
    for (const nom of el.getAttributeNames()) {
      if (!nom.startsWith("data-t-")) continue;
      el.setAttribute(nom.slice(7), T(el.getAttribute(nom)));
    }
}

function peindreMenuLangue() {
  const sel = $("#langue");
  if (!sel) return;
  sel.innerHTML = LANGUES.map(
    lg => `<option value="${ech(lg)}">${ech(T("page.langue." + lg))}</option>`)
    .join("");
  sel.value = LANGUE;
  sel.onchange = async () => {
    try {
      await fetch("/api/textes", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ langue: sel.value }) });
    } catch (e) { /* le cookie n'est pas pose : le rechargement le dira */ }
    // RECHARGER, ET NON REPEINDRE. La page est ecrite a cent vingt-sept sites
    // d'ecriture DOM repartis dans vingt-huit fonctions, et il n'existe aucun
    // endroit unique ou elle se peint : repeindre a chaud demanderait de
    // rejouer chacun d'eux, et le premier oubli laisserait une phrase
    // francaise dans une page anglaise — exactement ce que ce travail existe
    // pour empecher. Le rechargement refait TOUT depuis le serveur, comme
    // apres une connexion ou une deconnexion, qui en usent deja pour la meme
    // raison : l'identite change, donc tout le contexte.
    location.reload();
  };
}

/* TOUT ATTEND LE DICTIONNAIRE, et c'est une course qu'il faut fermer : sans
   ce verrou, /api/modeles pouvait repondre avant /api/textes et le menu des
   moteurs s'ecrivait « page.moteur.a_telecharger » a l'ecran. Le HTML, lui,
   porte deja son francais : rien n'est vide pendant l'aller-retour. */
const PRET = fetch("/api/textes", { credentials: "same-origin" })
  .then(r => r.json())
  .then(d => {
    if (Array.isArray(d.langues) && d.langues.length) LANGUES = d.langues;
    if (d.langue) LANGUE = d.langue;
    TEXTES = d.textes || {};
    document.documentElement.lang = LANGUE;
    // Seulement hors du francais : le HTML le porte deja, et le reecrire
    // n'aurait d'autre effet que de le remplacer par lui-meme — ou par une
    // cle, le jour ou l'une manquerait.
    if (LANGUE !== LANGUE_SOURCE) traduirePage();
    peindreMenuLangue();
  })
  .catch(() => { peindreMenuLangue(); });

let imageJointe = null, apercuURL = null, convActive = null;
const suivis = new Map();           // tid -> {bloc, minuteur}
/* Les demandes ARMEES, relevees au passage du compteur de file. /api/etat ne
   dit pas qu'une demande est armee — sa tache reste « en cours », c'est ce qui
   permet de la relancer telle quelle au reveil — et la bulle affichait donc
   « en cours · 431 s », compteur qui monte, pour un travail qui ne partira
   peut-etre que dans onze heures. Seul /api/file porte la marque : on la releve
   la, plutot que de deviner d'apres le texte du journal. */
const armees = new Map();           // tid -> heures restantes avant expiration
/* Les esquisses lancees DEPUIS CETTE PAGE. /api/etat sert l'etat de la tache, ou
   la marque « esquisse » n'est pas : elle est posee sur le TOUR, donc visible
   seulement apres rechargement de la conversation. Sans ce releve, la pastille
   et le bouton « refaire en soigne » n'apparaissaient pas sur le brouillon qu'on
   venait justement de lancer — c'est-a-dire au seul moment ou l'on en a besoin.
   Le serveur reprend la main des qu'il sait : « t.esquisse » l'emporte. */
const esquissesLancees = new Set();

/* ══ LES VALEURS DE PROTOCOLE NE SONT PAS DES LIBELLES ═══════════════════
   Elles se confondaient avec eux, et c'est le quatrieme des quatre chantiers
   que docs/plusieurs-langues.md a mesures — le seul qui restait.

   « en cours », « fini », « erreur », « question », « attente carte »,
   « attente machine » sont l'etat de la TACHE tel que serveur.py l'ecrit.
   Ils etaient testes a cinq endroits ET servaient de CLES a la table des
   etiquettes, dont les VALEURS sont de l'interface : une passe de traduction
   naive aurait touche les deux moities du meme litteral, et « fini » traduit
   en « finished » aurait rendu muet le test « t.etat === "fini" » sans lever
   la moindre erreur.

   ON NE CHANGE PAS LE PROTOCOLE, ON LE SEPARE. Ces valeurs voyagent jusqu'au
   serveur et sont ECRITES dans les conversations deja enregistrees : les
   traduire relirait de travers tout l'historique. Elles sont donc ecrites
   UNE fois, ici, sous un nom ; leurs etiquettes vivent au dictionnaire, sous
   « page.etat. ». banc_page.py exige les deux moities — que ces six valeurs
   soient exactement celles du serveur, et qu'aucune comparaison sur « .etat »
   ne porte encore un litteral. */
const ETAT = {
  cours: "en cours", fini: "fini", erreur: "erreur", question: "question",
  attente_carte: "attente carte", attente_machine: "attente machine",
};

/* La famille d'une piece, servie par /api/mediatheque. Meme affaire : la
   grille comparait « f.famille === "image" » a six endroits, et
   FAMILLES_MEDIA rangeait la valeur de protocole a cote de son libelle
   francais dans le meme tableau. L'ordre est celui des onglets. */
const FAMILLES = ["image", "video", "audio", "objet3d"];
const FAMILLE = { image: "image", video: "video", audio: "audio",
                  objet3d: "objet3d" };

/* La valeur de l'<option> du filtre « brouillon ou fini », relue telle
   quelle par trierEtFiltrer(). Elle est ECRITE DANS LE HTML : banc_page.py
   releve les deux et exige qu'elles soient le meme mot. */
const SOIN_BROUILLONS = "brouillons";

const TITRES = {};
/* Les guillemets et l'apostrophe en font partie, comme dans admin.html. Aucun
   appel d'ici ne sert aujourd'hui dans un ATTRIBUT, mais la premiere
   interpolation posee dans un title= ou un data- trouvera une fonction qui
   protege deja : c'est exactement l'oubli qui a donne la XSS de la console. */
const ech = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const EXT_IMG = /\.(png|jpe?g|webp|bmp|gif)$/i;
const EXT_VID = /\.(mp4|webm|mkv|mov)$/i;
const EXT_SON = /\.(mp3|flac|wav|ogg|opus)$/i;
/* le noeud fait partie de l'adresse : deux machines peuvent produire le meme
   nom de fichier le meme jour, le compteur de ComfyUI etant propre a chacune */
const url = f => `/api/fichier?filename=${encodeURIComponent(f.filename)}`
               + `&subfolder=${encodeURIComponent(f.subfolder || "")}&type=${f.type || "output"}`
               + (f.noeud ? `&noeud=${encodeURIComponent(f.noeud)}` : "");
const auBas = () => { const z = $("#zone"); z.scrollTop = z.scrollHeight; };

/* Le champ grandit avec ce qu'on ecrit, jusqu'a la hauteur maximale fixee en
   CSS — au-dela il defile. « auto » d'abord : sans cette remise a zero, le
   champ ne saurait que grandir, jamais retrecir. */
function ajuster() {
  const t = $("#txt");
  if (!t) return;
  t.style.height = "auto";
  t.style.height = t.scrollHeight + "px";
}

/* ── fil ─────────────────────────────────────────────────────────── */
function messageVide() {
  $("#fil").innerHTML = `<div class="vide">
    <h1>${ech(T("page.vide.titre"))}</h1>
    <p>${ech(T("page.vide.texte"))}</p></div>`;
}
function ajouterDemande(texte, heure) {
  $("#fil").querySelector(".vide")?.remove();
  const d = document.createElement("div");
  d.className = "demande";
  d.innerHTML = ech(texte) + `<span class="heure">${ech(heure || new Date()
      .toLocaleTimeString(locale(), { hour: "2-digit", minute: "2-digit" }))}</span>`;
  $("#fil").appendChild(d);
}
function ajouterReponse() {
  const r = document.createElement("div");
  r.className = "reponse";
  r.innerHTML = `<div class="bandeau-tech"><span class="puce cours">${
                   ech(T("page.etat.cours"))}</span></div>
                 <div class="sortie"></div>`;
  $("#fil").appendChild(r);
  return r;
}
function bloque(titre, contenu) {
  const d = document.createElement("details");
  d.className = "detail";
  d.innerHTML = `<summary>${ech(titre)}</summary><div class="corps-detail"></div>`;
  d.querySelector(".corps-detail").textContent = contenu;
  return d;
}
/* Ce qu'on peut faire d'une sortie, la ou on la regarde. Sans ces boutons il
   fallait un clic droit — inexistant sur telephone — et, pour agrandir, passer
   par le disque puis rejoindre le fichier a la main. */
function actionsSortie(f) {
  const zone = document.createElement("div");
  zone.className = "actions-sortie";

  const tele = document.createElement("a");
  tele.href = url(f);
  tele.download = f.filename;
  tele.textContent = T("page.telecharger");
  // Un lien ordinaire, pas du script : le navigateur sait deja nommer le
  // fichier, reprendre un transfert coupe et le ranger ou il faut.
  zone.appendChild(tele);

  if (EXT_IMG.test(f.filename) || EXT_VID.test(f.filename)) {
    const gros = document.createElement("button");
    gros.type = "button";
    gros.textContent = T("page.plein_ecran");
    gros.onclick = () => plein(f);
    zone.appendChild(gros);
  }
  return zone;
}

/* Regarder une sortie en grand. Le clic sur l'image elle-meme fait la meme
   chose : c'est le geste que tout le monde essaie en premier. */
function plein(f) {
  const voile = document.createElement("div");
  voile.className = "plein";
  const el = document.createElement(EXT_VID.test(f.filename) ? "video" : "img");
  el.src = url(f);
  if (el.tagName === "VIDEO") { el.controls = true; el.autoplay = true; }
  else el.alt = f.filename;
  const fermer = document.createElement("button");
  fermer.type = "button"; fermer.className = "fermer";
  fermer.setAttribute("aria-label", T("page.fermer.aria")); fermer.textContent = "✕";
  voile.append(el, fermer);
  document.body.appendChild(voile);

  // « parti » et non le hash : history.back() est ASYNCHRONE, et location.hash
  // vaut encore « #vue » a l'instant ou l'on revient. Un clic sur la croix
  // declenchait deux fois partir() — son propre gestionnaire, puis celui du
  // voile ou le clic remonte — donc DEUX retours arriere. Le second sortait de
  // la page : on se retrouvait dans /admin, d'ou l'on venait.
  let parti = false;
  const partir = () => {
    if (parti) return;
    parti = true;
    voile.remove();
    document.removeEventListener("keydown", auClavier);
    removeEventListener("popstate", partir);
    // On ne retire l'entree d'historique que si c'est bien la notre : un retour
    // arriere l'a peut-etre deja consommee.
    if (location.hash === "#vue") history.back();
  };
  const auClavier = e => { if (e.key === "Escape") partir(); };
  // Une entree d'historique, pour que le bouton retour du telephone ferme
  // l'image au lieu de quitter la page.
  history.pushState({ vue: 1 }, "", "#vue");
  addEventListener("popstate", partir);
  document.addEventListener("keydown", auClavier);
  voile.onclick = e => { if (e.target !== el) partir(); };
  // stopPropagation en plus du drapeau : deux verrous pour la meme porte, parce
  // que celle-ci donnait sur une page que personne n'avait demandee.
  fermer.onclick = e => { e.stopPropagation(); partir(); };
}

/* Le champ par lequel /api/au_propre dit « c'est deja fait », et le SEUL
   contrat de ce refus-la. Il a remplace un test sur le TEXTE du message —
   « /deja/i.test(d.erreur) » — qu'un accent ou une reformulation cote serveur
   suffisait a rompre en silence : la coche verte serait revenue sur les deux
   autres refus, avec le bouton retire, alors que rien n'avait ete rendu. C'est
   le mensonge que d24980a avait ferme, et qui n'attendait qu'un « déjà ».

   Declare ici et nomme : banc_refaire.py releve CETTE ligne pour savoir quel
   champ exiger du serveur, exactement comme banc_variantes.py releve RE_DEVIS.
   Le jour ou ce nom change d'un cote seulement, le banc rougit au lieu de
   laisser la coche mentir. */
const MARQUE_DEJA = "deja";

/* « Passer au propre » : meme prompt, meme graine, meme moteur, meme taille, et
   toutes les etapes. Rien n'est renvoye au serveur que l'identifiant du tour —
   c'est lui qui garde de quoi refaire l'image a l'identique.

   Le bouton ne se repropose pas indefiniment : des que le serveur a pose
   « au_propre » sur l'esquisse, il cede la place a une mention. La mention et
   non le vide — trois jours plus tard, « l'ai-je deja refaite ? » est exactement
   la question qu'on se pose devant une esquisse, et une rangee vide n'y repond
   pas. */
function barreAuPropre(t, cid) {
  const zone = document.createElement("div");
  zone.className = "au-propre";
  const fait = mot => { zone.innerHTML = ""; const s = document.createElement("span");
                        s.className = "fait"; s.textContent = "✓ " + mot;
                        zone.appendChild(s); };
  if (t.au_propre) { fait(T("page.au_propre.fait")); return zone; }

  const b = document.createElement("button");
  b.type = "button";
  // « refaire » et non « passer au propre ». Le second promet CETTE image en
  // mieux, et c'est faux : le nombre d'etapes change la trajectoire du
  // debruitage, la graine n'en fixe que le depart. Mesure du 31 aout, meme
  // graine et meme prompt : deux images sans rapport. Le libelle doit dire ce
  // qu'on obtient, pas ce qu'on aurait aime obtenir.
  b.textContent = T("page.au_propre.bouton");
  b.title = T("page.au_propre.title");
  const dit = document.createElement("span");
  b.onclick = async () => {
    b.disabled = true; dit.className = ""; dit.textContent = T("page.envoi");
    try {
      const r = await fetch("/api/au_propre", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation: cid, tour: t.id }) });
      const d = await r.json().catch(() => ({}));
      // LA MARQUE DU SERVEUR, ET RIEN D'AUTRE. Traduire TOUT 409 de cette route
      // par « ✓ déjà refait en soigné » etait un mensonge : le serveur en
      // rendait trois — un autre onglet est passe avant nous, l'esquisse n'est
      // pas terminee, et son moteur a quitte le catalogue. Les deux derniers
      // affichaient une coche verte et retiraient le bouton alors que RIEN
      // n'avait ete rendu. (Le troisieme est un 400 depuis : voir la regle des
      // deux boutons dans api_au_propre. Il en reste deux, et c'est bien un de
      // trop pour un code de retour.)
      //
      // Le correctif d'alors ajoutait « et le message contient deja », ce qui
      // deplaçait le contrat sur une PHRASE FRANCAISE ecrite dans serveur.py :
      // le seul des trois messages qui porte « deja » l'ecrit sans accent, et
      // il n'y a aucune raison qu'il le garde. Le champ, lui, ne se reformule
      // pas — et le code de retour n'est plus interroge du tout, pour que le
      // jour ou ce refus passera de 409 a autre chose la coche ne disparaisse
      // pas en silence. Il suffit que le serveur ait REFUSE et qu'il ait pose
      // sa marque.
      if (!r.ok && d[MARQUE_DEJA]) {
        fait(T("page.au_propre.deja")); return;
      }
      if (!r.ok || !d.id) throw new Error(d.erreur || T("page.refus.reprise"));
      fait(T("page.au_propre.fait"));
      // La nouvelle demande prend le chemin de toutes les autres : une bulle en
      // bas du fil, et le suivi ordinaire. Elle est bien la plus recente, meme
      // si l'esquisse dont elle sort est loin au-dessus.
      ajouterDemande(t.demande);
      const nouveau = ajouterReponse();
      auBas();
      suivre(d.id, nouveau, cid);
      listerConversations();
    } catch (err) {
      b.disabled = false;
      dit.className = "mal"; dit.textContent = err.message;
    }
  };
  zone.append(b, dit);
  return zone;
}

/* ── laquelle des N variantes porte « la » ────────────────────────────
   « agrandis-la », « rends-la fluide », « le meme personnage » visent une
   seule image. Le serveur ne pose « choisie » sur AUCUN tour tant que personne
   n'a designe : sa regle est implicite — c'est la PREMIERE du groupe qui tient
   le rang, meme finie en dernier (executer, serveur.py). Si la page se
   contentait de lire « choisie », les quatre variantes s'afficheraient sans
   marque au sortir du rendu, c'est-a-dire au seul moment ou la question se
   pose. On refait donc ici la meme deduction que le serveur, et rien de plus :
   celle qui est marquee, sinon celle de rang 1. */
const CHOISIES = new Map();          // groupe -> id du tour retenu

function releverChoisies(liste) {
  for (const t of liste || []) {
    const g = t.variantes || {};
    if (!g.groupe) continue;
    // La marque du serveur l'emporte toujours : elle vient d'un geste, le rang
    // n'est qu'un defaut. Sans cet ordre, un groupe lu tour par tour retombait
    // sur sa premiere des qu'elle passait apres la designee.
    if (t.choisie) CHOISIES.set(g.groupe, t.id);
    else if (g.rang === 1 && !CHOISIES.has(g.groupe)) CHOISIES.set(g.groupe, t.id);
  }
}

/* La rangee sous l'image : quel tirage, sur combien, et le geste qui le
   designe. Tout ce qu'il lui faut tient dans son « dataset » — c'est ce qui
   permet de repeindre les N rangees d'un groupe apres un clic, sans garder en
   memoire les N bulles ni rejouer garnirReponse dessus. */
function peindreVariante(zone) {
  const d = zone.dataset;
  const retenue = CHOISIES.get(d.groupe) === d.tour;
  const bulle = zone.closest(".reponse");
  if (bulle) bulle.classList.toggle("retenue", retenue);
  zone.innerHTML = "";
  const rang = document.createElement("span");
  rang.className = "rang";
  rang.textContent = T("page.variante.rang", { rang: d.rang, sur: d.sur });
  zone.appendChild(rang);
  if (retenue) {
    const s = document.createElement("span");
    s.className = "fait";
    // « c'est elle que « la » désigne » ne voulait rien dire pour qui n'a pas
    // lu la documentation — signalé par l'utilisateur. Ce qu'il faut savoir
    // tient en un mot : c'est de celle-ci qu'on repart.
    s.textContent = T("page.variante.retenue");
    zone.appendChild(s);
    return;
  }
  // Un tirage retire de la file, ou rate, garde son rang mais n'a rien a
  // designer : le serveur repond 404 sur un tour qui n'a pas produit de
  // fichier, et proposer le bouton serait promettre un geste qui echoue.
  if (d.designable !== "1") return;
  const b = document.createElement("button");
  b.type = "button";
  b.textContent = T("page.variante.repartir");
  b.title = T("page.variante.repartir.title");
  const dit = document.createElement("span");
  b.onclick = async () => {
    b.disabled = true; dit.className = ""; dit.textContent = "…";
    try {
      const r = await fetch("/api/variante", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation: d.conv, tour: d.tour }) });
      const rep = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(rep.erreur || T("page.refus.simple"));
      CHOISIES.set(d.groupe, d.tour);
      // TOUTES les rangees du groupe, pas seulement celle-ci : le serveur
      // decoche les soeurs, et deux images qui se diraient « la » en meme
      // temps seraient pires que pas de marque du tout.
      document.querySelectorAll(`#fil .variante[data-groupe="${d.groupe}"]`)
              .forEach(peindreVariante);
    } catch (err) {
      b.disabled = false;
      dit.className = "mal"; dit.textContent = err.message;
    }
  };
  zone.append(b, dit);
}

/* La rangee est rendue NUE : c'est peindreVariante qui la garnit, et il faut
   qu'elle soit deja posee dans la bulle pour cela. Il y pose aussi la classe
   « retenue », par closest(".reponse") — sur un element pas encore attache,
   closest() rend null : le texte « c'est elle » s'affichait, et l'encadre
   jamais. Mesure a 375 px : contour « none » sur la variante marquee, class
   absente sur les trois bulles. */
function barreVariante(t, cid) {
  const g = t.variantes || {};
  const zone = document.createElement("div");
  zone.className = "variante";
  Object.assign(zone.dataset, {
    groupe: g.groupe, tour: t.id, conv: cid, rang: g.rang, sur: g.sur,
    designable: (t.etat !== ETAT.erreur && (t.fichiers || []).length) ? "1" : "0",
  });
  return zone;
}

function garnirReponse(bloc, t, cid) {
  // une conversation rechargee peut contenir une question restee en suspens
  if (t.etat === ETAT.question && (t.questions || []).length) {
    garnirQuestion(bloc, t, cid || convActive);
    return;
  }
  // Un rendu encore en route : on se rebranche dessus. Sans cela, revenir sur
  // la conversation montrait une reponse vide et definitivement figee.
  if (t.etat === ETAT.cours && t.id) {
    bloc.querySelector(".bandeau-tech").innerHTML =
      `<span class="puce cours">${ech(T("page.etat.cours"))}</span>`;
    suivre(t.id, bloc, cid || convActive);
    return;
  }
  const p = t.plan || {};
  const rate = t.etat === ETAT.erreur;
  bloc.classList.toggle("rate", rate);
  const cle = p.modele || t.modele;
  const par = p.parametres || t.parametres;
  // Un echec doit sauter aux yeux ; une reussite se voit deja a l'image, et une
  // pastille verte de plus ne ferait qu'occuper la ligne. Un brouillon, lui, se
  // dit meme reussi : rien dans l'image ne previent qu'elle n'est qu'a un quart
  // du chemin, et une esquisse rangee pour une image finie est une image qu'on
  // ne refera jamais, croyant l'avoir faite.
  const esquisse = t.esquisse === true || esquissesLancees.has(t.id);
  bloc.querySelector(".bandeau-tech").innerHTML =
    (rate ? `<span class="puce rate">${ech(T("page.etat.echec"))}</span>` : "")
    + (esquisse ? `<span class="puce esquisse">${ech(T("page.brouillon"))}</span>` : "");

  const sortie = bloc.querySelector(".sortie");
  sortie.innerHTML = "";
  if (t.description) {
    const d = document.createElement("div");
    d.className = "lecture"; d.textContent = t.description;
    sortie.appendChild(d);
  }
  (t.fichiers || []).forEach(f => {
    const u = url(f); let el;
    if (EXT_VID.test(f.filename)) { el = document.createElement("video"); el.controls = true; el.loop = true; }
    else if (EXT_SON.test(f.filename)) { el = document.createElement("audio"); el.controls = true; }
    else if (EXT_IMG.test(f.filename)) { el = document.createElement("img"); el.alt = f.filename; }
    else { el = document.createElement("a"); el.href = u; el.download = f.filename;
           el.textContent = T("page.telecharger.fichier", { nom: f.filename }); }
    if (el.tagName !== "A") el.src = u;
    // Le nom sert a retrouver le fichier, pas a lire l'image : infobulle.
    el.title = f.filename;
    sortie.appendChild(el);
    if (el.tagName === "IMG") { el.style.cursor = "zoom-in"; el.onclick = () => plein(f); }
    if (el.tagName !== "A") sortie.appendChild(actionsSortie(f));
  });
  if (rate) {
    const e = document.createElement("div");
    e.className = "echec"; e.textContent = t.erreur || T("page.echec.defaut");
    // Retaper dix lignes parce que le studio a redemarre est une punition
    // imméritée : le bouton reprend la demande, et le moteur imposé avec.
    if (t.demande) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = T("page.relancer");
      b.title = T("page.relancer.title");
      b.onclick = () => {
        $("#txt").value = t.demande;
        if (t.modele && $("#forcer").querySelector(`option[value="${t.modele}"]`))
          $("#forcer").value = t.modele;
        ajuster();
        if (typeof peindreActifs === "function") peindreActifs();
        $("#go").click();
      };
      e.appendChild(b);
    }
    sortie.appendChild(e);
  }
  // Dans « .sortie », qui est vide a chaque passage : garnirReponse peut etre
  // rejoue sur la meme bulle (la relance tardive apres un arret, par exemple),
  // et une rangee posee plus haut s'y serait dupliquee.
  //
  // Le rang AVANT le bouton « refaire en soigne » : on lit d'abord ce qu'on
  // regarde, on agit ensuite. Et il s'affiche meme sur un tirage rate — un
  // retire de la file garde son rang dans le groupe, et une bulle en echec
  // sans numero fait croire a une demande egaree plutot qu'a une variante.
  if ((t.variantes || {}).sur > 1 && t.id) {
    releverChoisies([t]);
    // Posee d'abord, garnie ensuite : peindreVariante remonte a la bulle pour
    // y mettre l'encadre, et ne la trouve pas tant que la rangee flotte.
    peindreVariante(sortie.appendChild(barreVariante(t, cid || convActive)));
  }
  if (esquisse && !rate && (t.fichiers || []).length && t.id)
    sortie.appendChild(barreAuPropre(t, cid || convActive));
  bloc.querySelectorAll("details.detail").forEach(d => d.remove());
  bloc.querySelectorAll(".signature").forEach(d => d.remove());

  // Une ligne de signature : ce qui a servi, en clair, sans encombrer.
  const sign = document.createElement("div");
  sign.className = "signature";
  if (cle) sign.appendChild(Object.assign(document.createElement("span"),
                                          { textContent: TITRES[cle] || cle }));
  if (t.id) sign.appendChild(barreAvis(t));
  bloc.appendChild(sign);

  // Tout le technique dans UN depliant, ferme. Le detail reste disponible pour
  // qui le cherche, sans etre impose a qui regarde une image.
  const morceaux = [];
  if (par && Object.keys(par).length)
    morceaux.push(T("page.detail.reglages", { quoi:
      Object.entries(par).map(([k, v]) => `${k}=${v}`).join(", ") }));
  if (t.raison) morceaux.push(T("page.detail.choix", { quoi: t.raison }));
  // La machine et le temps : « pourquoi celle-ci a mis quatre minutes » est une
  // question qu'on se pose une semaine plus tard, quand le journal du studio a
  // depuis longtemps oublie.
  const machine = t.noeud
    || [...new Set((t.fichiers || []).map(f => f.noeud).filter(Boolean))].join(", ");
  const combien = t.secondes ? T("page.duree.s", { n: Math.round(t.secondes) }) : "";
  if (machine || combien)
    morceaux.push(T("page.detail.rendu",
                    { quoi: [machine, combien].filter(Boolean).join(" · ") }));
  const prompt = p.prompt || t.prompt;
  if (prompt) morceaux.push(T("page.detail.prompt", { quoi: prompt })
                          + (p.negatif ? T("page.detail.negatif", { quoi: p.negatif }) : ""));
  if (t.paroles) morceaux.push(T("page.detail.paroles", { quoi: t.paroles }));
  const fics = (t.fichiers || []).map(f => f.filename).join("\n");
  if (fics) morceaux.push(T("page.detail.fichiers", { quoi: fics }));
  // LE DEROULE RESTE FRANCAIS, ET C'EST UNE DECISION : le journal est ECRIT,
  // garde sur la tache, relu plus tard, parfois par quelqu'un d'autre que
  // celui qui a lance la demande. Seul son TITRE se traduit
  // (docs/plusieurs-langues.md, « on ne traduira pas le journal »).
  if (t.etapes && t.etapes.length)
    morceaux.push(T("page.detail.deroule",
                    { quoi: t.etapes.map(e => `${e.t}  ${e.msg}`).join("\n") }));
  if (morceaux.length)
    bloc.appendChild(bloque(T("page.detail.titre"), morceaux.join("\n\n")));

/* Le pouce sert a corriger le code : sans mesure, on regle a l'aveugle.
   Il est donc pose sur l'echange, la ou le resultat est encore sous les yeux,
   et non dans un formulaire separe que personne n'irait remplir. */
function barreAvis(t) {
  const zone = document.createElement("div");
  const barre = document.createElement("div");
  barre.className = "avis";
  const haut = document.createElement("button");
  haut.type = "button"; haut.textContent = "👍"; haut.title = T("page.avis.haut");
  const bas = document.createElement("button");
  bas.type = "button"; bas.textContent = "👎"; bas.title = T("page.avis.bas");
  const dit = document.createElement("span");
  dit.className = "merci";
  barre.append(haut, bas, dit);
  zone.appendChild(barre);

  let pose = t.avis || 0;
  // Ce que l'utilisateur dit que ça AURAIT DU etre. Vide tant qu'il n'a rien
  // corrige, et il n'y est jamais oblige.
  let corrige = t.intention_voulue || "";
  haut.classList.add("haut"); bas.classList.add("bas");
  /* LE POUCE DIT QUE C'EST RATE ; CE BOUTON DIT QUOI FAIRE. Deux gestes,
     parce que ce sont deux decisions — le studio armait auparavant la demande
     SUIVANTE sur un pouce en bas, donc « et maintenant de nuit » repartait sur
     la grosse carte sans que personne l'ait voulu. Demande par l'utilisateur :
     « lors d'un avis negatif, il faudrait pouvoir refaire avec un bouton ».

     Il ne s'affiche que sur un tour FINI qui a produit quelque chose : refaire
     un echec, c'est relancer la meme panne. */
  const refaire = document.createElement("button");
  refaire.type = "button"; refaire.className = "refaire-grand";
  refaire.textContent = T("page.refaire.bouton");
  refaire.title = T("page.refaire.title");
  refaire.onclick = async () => {
    refaire.disabled = true;
    const avant = refaire.textContent;
    refaire.textContent = "…";
    try {
      const r = await fetch("/api/refaire", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ conversation: convActive, tour: t.id }) });
      const rep = await r.json().catch(() => ({}));
      if (!r.ok) throw new Error(rep.erreur || T("page.refus.simple"));
      dit.textContent = T("page.refaire.fait");
      refaire.remove();
      listerConversations();
    } catch (e) {
      refaire.disabled = false; refaire.textContent = avant;
      dit.textContent = T("page.refaire.impossible", { quoi: e.message });
    }
  };

  const peindre = () => {
    haut.classList.toggle("pris", pose === 1);
    bas.classList.toggle("pris", pose === -1);
    dit.textContent = pose === 1 ? T("page.avis.merci")
                    : pose === -1 ? T("page.avis.note") : "";
    const refaisable = pose === -1 && t.etat === ETAT.fini
                       && (t.fichiers || []).length && !t.refait;
    if (refaisable && !refaire.isConnected) barre.insertBefore(refaire, dit);
    else if (!refaisable && refaire.isConnected) refaire.remove();
  };
  peindre();

  const envoyer = async (avis, note) => {
    // Un second clic sur le meme pouce retire l'avis : s'etre trompe de bouton
    // ne doit pas obliger a choisir l'autre.
    const vise = (avis === pose && !note) ? 0 : avis;
    try {
      const r = await fetch("/api/avis", { method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tid: t.id, avis: vise, note: note || "",
                               ...(corrige ? { intention: corrige } : {}) }) });
      if (!r.ok) throw new Error((await r.json()).erreur || r.status);
      pose = vise; peindre();
      if (vise !== -1) zone.querySelectorAll(".avis-note").forEach(x => x.remove());
    } catch (e) { dit.textContent = T("page.avis.rate", { quoi: e.message }); }
  };

  haut.onclick = () => { zone.querySelectorAll(".avis-note").forEach(x => x.remove());
                         envoyer(1, ""); };
  bas.onclick = async () => {
    // Le pouce part tout de suite : le mot est un bonus, pas un peage.
    envoyer(-1, "");
    if (zone.querySelector(".avis-note")) return;
    const f = document.createElement("div");
    f.className = "avis-note";
    const champ = document.createElement("input");
    champ.type = "text"; champ.maxLength = 2000;
    champ.placeholder = T("page.avis.champ");
    const ok = document.createElement("button");
    ok.type = "button"; ok.textContent = T("page.envoyer");
    ok.onclick = () => { if (champ.value.trim()) envoyer(-1, champ.value.trim()); f.remove(); };
    champ.onkeydown = ev => { if (ev.key === "Enter") ok.onclick(); };
    f.append(champ, ok);
    zone.appendChild(f);
    champ.focus();
    // « C'etait plutot quoi ? » — un clic, et c'est le seul retour dont
    // l'aiguilleur apprenne vraiment : une formulation qu'il a DEJA ratee,
    // avec sa bonne reponse. Ni obligatoire, ni un formulaire.
