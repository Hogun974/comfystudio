<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ComfyStudio</title>
<style>
/* ═══ Console d'atelier ═══════════════════════════════════════════════
   Aucune police distante : l'outil doit fonctionner hors ligne.        */
:root{
  /* Declare au navigateur la palette de ses widgets natifs : sans elle, les
     menus deroulants des selecteurs s'ouvraient en clair sur le theme
     sombre. Elle suit la meme bascule que les couleurs, plus bas. */
  color-scheme:dark;
  --nuit:#15120f; --plan:#1d1915; --creux:#120f0d; --relief:#262019;
  --trait:#2e2721; --trait-vif:#4a3f34;
  --encre:#f0e9e0; --encre-douce:#b6a999; --encre-pale:#8e8175;
  --braise:#e8a33d; --braise-sourde:#3a2a13; --braise-vive:#ffc266;
  --vert:#8fbf72; --rouge:#e07a55;
  --serif:Constantia,Georgia,"Times New Roman",serif;
  --sans:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --mono:"Cascadia Mono",Consolas,ui-monospace,monospace;
}
@media (prefers-color-scheme: light){
  :root{
    color-scheme:light;
    --nuit:#f2ede4; --plan:#fffdf9; --creux:#e8e1d5; --relief:#faf6ef;
    --trait:#ddd4c5; --trait-vif:#a3927c;
    --encre:#20180f; --encre-douce:#584c3e; --encre-pale:#6f6151;
    --braise:#a05d0a; --braise-sourde:#f6e7cd; --braise-vive:#7d4708;
    --vert:#4a6b34; --rouge:#a2431f;
  }
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;overflow-x:hidden;background:var(--nuit);color:var(--encre);
  font:15.5px/1.65 var(--serif);display:flex;flex-direction:column;
  -webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:99;opacity:.035;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='120'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='120' height='120' filter='url(%23n)'/></svg>")}

header{display:flex;align-items:center;gap:14px;padding:12px 20px;
  border-bottom:1px solid var(--trait);background:var(--plan);flex:none}
.marque{font:600 15px var(--sans);letter-spacing:.02em}
.marque em{font-style:normal;color:var(--braise)}
.jauge{margin-left:auto;display:flex;gap:14px;align-items:center;
  font:11px/1 var(--mono);color:var(--encre-pale);letter-spacing:.03em}
.jauge b{color:var(--encre-douce);font-weight:400}
/* Article 13 de l'AGPL : qui utilise le service doit pouvoir obtenir la
   source. Un lien visible, discret mais present. */
.jauge .source{color:var(--encre-pale);text-decoration:none;
  border-bottom:1px dotted var(--trait-vif)}
.jauge .source:hover{color:var(--braise)}
/* Interrupteurs de cloud : un par modalite, allumes quand la demande part
   chez un fournisseur. Eteints, ils restent visibles — savoir qu'on POURRAIT
   passer au cloud vaut mieux qu'un bouton qui disparait. */
.nuages{display:flex;gap:4px;align-items:center}
/* La file, au survol ET au clic : un telephone n'a pas de survol, et c'est la
   moitie des usages. Position fixe plutot qu'ancree au bouton — ancre, le
   panneau sortait de l'ecran a droite sur un telephone. */
.file-vive{cursor:pointer}
#panneauFile{position:fixed;top:52px;right:12px;left:auto;z-index:40;
  width:min(420px,calc(100vw - 24px));max-height:min(60vh,420px);overflow:auto;
  background:var(--plan);border:1px solid var(--trait);border-radius:12px;
  padding:12px 14px;box-shadow:0 10px 30px rgba(0,0,0,.35);display:none}
#panneauFile.ouvert{display:block}
#panneauFile h4{margin:0 0 8px;font:600 12px var(--sans);color:var(--encre-douce);
  text-transform:lowercase;letter-spacing:.4px}
.tache{display:flex;gap:9px;align-items:flex-start;padding:7px 0;
  border-top:1px solid var(--trait)}
.tache:first-of-type{border-top:0}
.tache .rang{font:11px var(--mono);color:var(--encre-pale);min-width:2.2em}
.tache .quoi{flex:1;font:12.5px var(--sans);word-break:break-word}
.tache .quoi small{display:block;font:10.5px var(--mono);color:var(--encre-pale)}
.tache.autrui .quoi{color:var(--encre-pale);font-style:italic}
.tache button{background:transparent;border:1px solid var(--trait-vif);
  border-radius:6px;padding:2px 7px;font:11px var(--mono);color:var(--encre-pale);
  cursor:pointer}
.tache button:hover{border-color:var(--rouge);color:var(--rouge)}
.tache .encours{color:var(--braise);font:10.5px var(--mono)}
/* Barre de progression : elle ne s'affiche QUE si ComfyUI a annonce un total.
   Une barre qui avance sans rapport avec le calcul est pire qu'aucune barre,
   parce qu'on lui fait confiance. */
.avance{height:4px;background:var(--creux);border-radius:3px;margin-top:5px;
  overflow:hidden}
.avance i{display:block;height:100%;background:var(--braise);
  transition:width .3s ease}
/* Dans le bandeau de la bulle, le bandeau est un flex : sans largeur imposee la
   barre serait un point. Elle prend donc la place qui reste, et perd la marge
   haute qui la decalerait de la ligne. */
.bandeau-tech .avance{flex:1 1 90px;min-width:90px;margin-top:0}
.etat-tache{font:10.5px var(--mono);margin-top:3px}
.etat-tache.attente{color:var(--encre-pale)}
.etat-tache.cours{color:var(--braise)}
.etat-tache.fini{color:var(--vert)}
.etat-tache.rate{color:var(--rouge)}
@media (max-width:640px){
  /* Sur telephone la barre est etroite : le panneau prend toute la largeur et
     s'ancre sous l'entete plutot que sur un bouton qui a pu passer a la ligne. */
  #panneauFile{right:8px;left:8px;width:auto;top:auto;
    top:calc(env(safe-area-inset-top, 0px) + 52px)}
  /* Cibles tactiles : mesurees a 19 px de haut pour « mediatheque » et
     « sortir », 12 pour le lien « source ». Un doigt n'est pas un curseur — on
     ne change pas le dessin, on ajoute de la hauteur cliquable. */
  .compte button,.lien-admin,.jauge .source{min-height:34px;
    display:inline-flex;align-items:center}
  .nuages button{min-height:32px}
  /* Les familles de la mediatheque defilaient lateralement, sans rien pour
     l'annoncer : « objets 3D » etait coupe et personne ne pouvait deviner qu'il
     fallait glisser. Sur telephone elles passent a la ligne — six etiquettes
     courtes tiennent en deux rangees, et plus rien n'est cache. */
  .onglets-media{flex-wrap:wrap;overflow-x:visible}
}
/* Sans survol, un bouton qui n'apparait qu'au survol n'apparait jamais. La
   croix qui ferme une conversation etait en opacity:0 : sur telephone, elle
   etait purement inatteignable, et fermer une conversation impossible. */
@media (hover:none){
  .conv .jeter{opacity:1;color:var(--encre-douce);padding:6px 8px;top:2px}
}
.nuages button{background:transparent;border:1px solid var(--trait);
  border-radius:20px;padding:1px 7px;font:13px/1.4 var(--sans);cursor:pointer;
  color:var(--encre-pale);transition:color .12s,border-color .12s,opacity .12s}
.nuages button:hover{border-color:var(--trait-vif);color:var(--encre)}
.nuages button.allume{color:var(--braise);border-color:var(--braise)}
.nuages button.eteint{opacity:.45}
/* Compte : discret, a droite de la barre. Rien ne s'affiche tant qu'aucun
   compte n'existe sur cette installation. */
.compte{display:flex;align-items:center;gap:6px;font:11px var(--mono)}
.compte button{background:transparent;border:1px solid var(--trait);
  border-radius:7px;padding:2px 8px;font:11px var(--mono);color:var(--encre-douce);
  cursor:pointer}
.compte button:hover{border-color:var(--braise);color:var(--braise)}
.compte b{color:var(--braise);font-weight:400}
/* « background:transparent » n'est pas un ornement : sans lui le navigateur
   applique son « buttonface » gris clair, et le bouton « mediatheque » ressortait
   en clair sur le theme sombre — contraste mesure 2,02:1, illisible, des le
   premier ecran. Le « sortir » d'a cote etait correct parce que sa classe le
   declare, elle. */
.lien-admin{font:11px var(--mono);color:var(--encre-douce);text-decoration:none;
  background:transparent;
  border:1px solid var(--trait);border-radius:7px;padding:2px 8px}
.lien-admin:hover{border-color:var(--braise);color:var(--braise)}
.voile-entree{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;
  align-items:center;justify-content:center;z-index:50}
.entree{background:var(--plan);border:1px solid var(--trait);border-radius:12px;
  padding:20px;width:min(320px,90vw);display:flex;flex-direction:column;gap:10px}
.entree h3{margin:0;font:600 14px var(--sans)}
.entree input{background:var(--creux);border:1px solid var(--trait);border-radius:7px;
  padding:8px 10px;color:var(--encre);font:13px var(--sans)}
.entree input:focus{outline:none;border-color:var(--braise)}
.entree .rang{display:flex;gap:8px;justify-content:flex-end}
.entree .mal{color:var(--rouge);font:11px var(--mono);min-height:14px}
.file-vive{color:var(--braise);border:1px solid var(--braise);border-radius:20px;
  padding:3px 10px}

.corps{flex:1;display:flex;min-height:0}

/* ── colonne des conversations ───────────────────────────────────── */
aside{width:236px;flex:none;background:var(--plan);border-right:1px solid var(--trait);
  display:flex;flex-direction:column;min-height:0}
.neuve{margin:12px;padding:8px;border:1px dashed var(--trait-vif);border-radius:8px;
  background:transparent;color:var(--encre-douce);font:12px var(--mono);cursor:pointer}
.neuve:hover{border-style:solid;border-color:var(--braise);color:var(--braise)}
.convs{flex:1;overflow-y:auto;padding:0 8px 12px}
.moteur{border-top:1px solid var(--trait);padding:10px 12px;font:11px var(--mono);
  color:var(--encre-douce);display:flex;flex-direction:column;gap:7px}
.moteur .ligne{display:flex;align-items:center;gap:7px}
.pastille{width:8px;height:8px;border-radius:50%;background:var(--trait-vif);flex:none}
.pastille.vif{background:#5da271;box-shadow:0 0 6px #5da27188}
.pastille.mort{background:#a2545d}
.moteur .detail{color:var(--encre-tres-douce,var(--encre-douce));opacity:.75;font-size:10px}
.moteur button{flex:1;padding:5px;border:1px solid var(--trait-vif);border-radius:6px;
  background:transparent;color:var(--encre-douce);font:11px var(--mono);cursor:pointer}
.moteur button:hover:not(:disabled){border-color:var(--braise);color:var(--braise-vive)}
.moteur button:disabled{opacity:.35;cursor:default}
.conv{position:relative;padding:8px 26px 8px 11px;border-radius:7px;cursor:pointer;
  font-size:13.5px;line-height:1.4;color:var(--encre-douce);margin-bottom:2px}
.conv:hover{background:var(--relief)}
.conv.active{background:var(--braise-sourde);color:var(--encre)}
.conv.active::before{content:"";position:absolute;left:0;top:7px;bottom:7px;width:2px;
  background:var(--braise);border-radius:2px}
.conv small{display:block;font:10px var(--mono);color:var(--encre-pale);margin-top:2px}
.conv .jeter{position:absolute;right:5px;top:6px;border:0;background:transparent;
  color:var(--encre-douce);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;
  opacity:0;border-radius:4px}
.conv:hover .jeter{opacity:1}
.conv .jeter:hover{color:var(--rouge);background:var(--creux)}

/* ── fil ─────────────────────────────────────────────────────────── */
main{flex:1;overflow-y:auto;min-width:0}
.fil{max-width:880px;margin:0 auto;padding:26px 22px 30px;
  display:flex;flex-direction:column;gap:26px}
.vide{text-align:center;padding:64px 20px;color:var(--encre-pale)}
.vide h1{font:400 27px/1.3 var(--serif);color:var(--encre-douce);margin:0 0 10px;
  letter-spacing:-.01em}
.vide p{margin:0 auto;max-width:44ch;font-size:14.5px}

.demande{align-self:flex-end;max-width:74%;background:var(--braise-sourde);
  border:1px solid var(--trait-vif);border-radius:12px 12px 3px 12px;
  padding:11px 15px;font-size:15px}
.demande .heure{display:block;font:10.5px var(--mono);color:var(--encre-pale);
  margin-top:5px;letter-spacing:.04em}

.reponse{position:relative;padding-left:20px}
.reponse::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:3px;
  border-radius:2px;background:linear-gradient(var(--braise),transparent)}
.reponse.rate::before{background:var(--rouge)}
.bandeau-tech{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:11px;
  font:11px var(--mono);letter-spacing:.02em}
.puce{border:1px solid var(--trait-vif);border-radius:20px;padding:2px 9px;
  color:var(--encre-douce);background:var(--creux);white-space:nowrap}
.puce.moteur{color:var(--braise);border-color:var(--braise)}
.puce.rate{color:var(--rouge);border-color:var(--rouge)}
.puce.cours{color:var(--braise-vive);border-color:var(--braise-vive)}
.puce.fini{color:var(--vert);border-color:var(--vert)}
.puce.attente{color:var(--encre-pale);border-style:dashed}
.sortie img,.sortie video{display:block;max-width:100%;border-radius:9px;
  border:1px solid var(--trait);background:var(--creux)}
.sortie audio{width:100%;margin-top:4px}
.sortie a{color:var(--braise)}
/* La vue plein ecran : fond opaque, media borne a l'ecran, rien d'autre. */
.plein{position:fixed;inset:0;z-index:60;background:#000000e6;display:flex;
  align-items:center;justify-content:center;padding:18px}
.plein img,.plein video{max-width:100%;max-height:100%;border-radius:6px}
.plein .fermer{position:absolute;top:12px;right:14px;background:#0006;
  border:1px solid #fff4;color:#fff;border-radius:9px;padding:6px 11px;
  font:13px var(--mono);cursor:pointer}
.plein .fermer:hover{background:#0009}
/* La mediatheque prend tout l'ecran : on vient y chercher quelque chose, pas
   jeter un oeil en passant. */
#mediatheque{position:fixed;inset:0;z-index:50;background:var(--nuit);
  display:flex;flex-direction:column}
#mediatheque[hidden]{display:none}
#mediatheque > header{display:flex;align-items:center;gap:12px;padding:12px 18px;
  border-bottom:1px solid var(--trait);background:var(--plan);flex:none}
#mediatheque > header > b{font:600 14px var(--sans)}
#mediatheque > header > button:last-child{margin-left:auto;background:transparent;
  border:1px solid var(--trait);border-radius:8px;padding:4px 10px;cursor:pointer;
  color:var(--encre-douce);font:12px var(--mono)}
.onglets-media{display:flex;gap:5px;overflow-x:auto}
.onglets-media button{background:transparent;border:1px solid var(--trait);
  border-radius:8px;padding:4px 10px;font:11.5px var(--mono);cursor:pointer;
  color:var(--encre-douce);white-space:nowrap}
.onglets-media button.ouvert{border-color:var(--braise);color:var(--braise)}
.onglets-media button:disabled{opacity:.35;cursor:default}
/* La barre de tri : une ligne qui se replie, jamais une colonne de reglages.
   Trois cents pieces sans moyen de chercher, c'est un dossier, pas une
   mediatheque. */
#filtresMedia{display:flex;flex-wrap:wrap;gap:7px;align-items:center;
  padding:10px 18px 0;font:11.5px var(--mono)}
#filtresMedia input,#filtresMedia select{background:transparent;
  color:var(--encre-douce);border:1px solid var(--trait-vif);border-radius:7px;
  padding:5px 9px;font:11.5px var(--mono);min-width:0}
#filtresMedia input{flex:1 1 220px}
#filtresMedia input:focus-visible,#filtresMedia select:focus-visible{
  outline:2px solid var(--braise);outline-offset:1px}
.detail-media{color:var(--encre-pale);margin-left:auto}
/* Le prompt reellement envoye, replie. Il explique un rendu qu'on ne
   s'explique pas, et il n'etait visible nulle part. */
.media .envoye{display:block;margin-top:4px;color:var(--encre-pale);
  font:10px var(--mono);white-space:pre-wrap;word-break:break-word}
.media details summary{cursor:pointer;color:var(--encre-pale);font:10px var(--mono)}
/* Regarder la production de tout le monde ne doit jamais se faire sans le
   savoir : la mention est a cote des familles, pas cachee en bas. */
.vue-admin{font:10.5px var(--mono);color:var(--braise);align-self:center}
#grilleMedia{flex:1;overflow:auto;padding:16px 18px 40px;display:grid;gap:16px;
  grid-template-columns:repeat(auto-fill,minmax(230px,1fr));align-content:start}
.media{margin:0;background:var(--plan);border:1px solid var(--trait);
  border-radius:11px;padding:10px;display:flex;flex-direction:column;gap:7px}
.media img,.media video{width:100%;border-radius:7px;display:block}
.media audio{width:100%}
.media .cube{font-size:38px;text-align:center;color:var(--encre-pale);padding:18px 0}
.media figcaption{font:12.5px var(--serif);display:flex;flex-direction:column;gap:2px}
.media figcaption small{font:10.5px var(--mono);color:var(--encre-pale)}
.vide-media{color:var(--encre-pale);font-style:italic}
.actions-sortie{display:flex;gap:7px;margin-top:7px}
.actions-sortie a,.actions-sortie button{font:11px var(--mono);
  color:var(--encre-douce);background:transparent;text-decoration:none;
  border:1px solid var(--trait);border-radius:7px;padding:3px 9px;cursor:pointer}
.actions-sortie a:hover,.actions-sortie button:hover{border-color:var(--braise);
  color:var(--braise)}
.actions-sortie button:disabled{opacity:.4;cursor:default}
.lecture{font-size:15px;white-space:pre-wrap;color:var(--encre-douce);
  border-left:2px solid var(--trait-vif);padding-left:14px}
.echec{color:var(--rouge);font:13.5px var(--sans)}
.echec button{margin-left:10px;background:transparent;border:1px solid var(--rouge);
  border-radius:7px;padding:2px 9px;font:11.5px var(--mono);color:var(--rouge);
  cursor:pointer}
.echec button:hover{background:var(--rouge);color:var(--plan)}
.question{border:1px solid var(--braise);border-radius:9px;background:var(--braise-sourde);
  padding:13px 15px}
.question p{margin:0 0 4px;font-size:14.5px}
.question ul{margin:0 0 11px;padding-left:19px}
.question li{margin:3px 0;font-size:14.5px}
.question .repondre{display:flex;gap:9px;align-items:flex-end}
.question input{flex:1;background:var(--creux);border:1px solid var(--trait-vif);
  border-radius:8px;color:var(--encre);padding:9px 12px;font:14.5px var(--serif)}
.question input:focus-visible{outline:2px solid var(--braise);outline-offset:1px}
.question button{background:var(--braise);border:1px solid var(--braise);color:var(--nuit);
  border-radius:8px;padding:9px 15px;font:12px var(--mono);cursor:pointer;font-weight:600}
.question button:hover{filter:brightness(1.12)}
.nomfic{font:10.5px var(--mono);color:var(--encre-pale);margin-top:6px}
/* Le moteur employe se lit, mais ne se dispute pas la place avec l'image. */
.signature{font:10.5px var(--mono);color:var(--encre-pale);margin-top:8px;
  display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.signature .sep{opacity:.5}
.signature .avis{margin-top:0}
.signature .avis button{padding:1px 7px;font-size:13px}
/* Avis : discret tant qu'on n'a rien dit, franc une fois le pouce pose. */
.avis{display:flex;align-items:center;gap:6px;margin-top:12px}
.avis button{background:transparent;border:1px solid var(--trait);border-radius:7px;
  padding:3px 9px;font:14px/1.2 var(--sans);color:var(--encre-pale);cursor:pointer;
  transition:color .12s,border-color .12s}
.avis button:hover{color:var(--encre);border-color:var(--trait-vif)}
.avis button.pris.haut{color:var(--vert);border-color:var(--vert)}
.avis button.pris.bas{color:var(--rouge);border-color:var(--rouge)}
.avis .merci{font:11px var(--mono);color:var(--encre-pale)}
.avis-note{display:flex;gap:6px;margin-top:7px}
.avis-note input{flex:1;background:var(--creux);border:1px solid var(--trait);
  border-radius:7px;padding:6px 9px;color:var(--encre);font:12.5px var(--sans)}
.avis-note input:focus{outline:none;border-color:var(--braise)}
.avis-note button{font:12px var(--mono)}
details.detail{margin-top:10px}
details.detail summary{cursor:pointer;font:11px var(--mono);color:var(--encre-pale);
  letter-spacing:.05em;text-transform:uppercase;list-style:none}
details.detail summary::-webkit-details-marker{display:none}
details.detail summary::before{content:"▸ ";color:var(--braise)}
details.detail[open] summary::before{content:"▾ "}
details.detail summary:hover{color:var(--encre-douce)}
.corps-detail{margin-top:9px;padding:11px 13px;background:var(--creux);
  border:1px solid var(--trait);border-radius:8px;
  font:11.5px/1.75 var(--mono);color:var(--encre-douce);
  max-height:230px;overflow:auto;white-space:pre-wrap}


/* ── saisie ──────────────────────────────────────────────────────── */
footer{flex:none;border-top:1px solid var(--trait);background:var(--plan)}
.saisie{max-width:880px;margin:0 auto;padding:14px 22px 17px}
.champ{display:flex;gap:11px;align-items:flex-end}
textarea{flex:1;min-height:50px;max-height:190px;resize:none;padding:12px 14px;
  background:var(--creux);color:var(--encre);border:1px solid var(--trait-vif);
  border-radius:10px;font:15.5px/1.5 var(--serif)}
textarea::placeholder{color:var(--encre-pale)}
textarea:focus-visible{outline:2px solid var(--braise);outline-offset:1px;
  border-color:var(--braise)}
.envoyer{flex:none;width:50px;height:50px;border-radius:10px;cursor:pointer;
  background:var(--braise);border:1px solid var(--braise);color:var(--nuit);
  font-size:19px;line-height:1;display:grid;place-items:center;
  transition:transform .12s ease,filter .12s ease}
.envoyer:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
.envoyer:disabled{opacity:.4;cursor:default}
.envoyer:focus-visible{outline:2px solid var(--braise-vive);outline-offset:2px}
.outils{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:10px}
/* Barre repliee : deux boutons et, s'il y a lieu, ce qui est actif. */
.barre{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-top:9px}
.barre button{background:transparent;border:1px solid var(--trait);border-radius:8px;
  padding:4px 10px;font:11.5px var(--mono);color:var(--encre-douce);cursor:pointer}
.barre button:hover{border-color:var(--braise);color:var(--braise)}
.barre button.ouvert{border-color:var(--braise);color:var(--braise)}
.actifs{font:11px var(--mono);color:var(--braise);display:flex;gap:7px;flex-wrap:wrap}
.actifs .oter{cursor:pointer;border-bottom:1px dotted var(--braise)}
.outils.replie{display:none}
.outils select,.outils label.joindre{background:transparent;color:var(--encre-douce);
  border:1px solid var(--trait-vif);border-radius:7px;padding:5px 11px;
  font:11.5px var(--mono);cursor:pointer;letter-spacing:.02em}
/* Un <select> en flex prend la largeur de sa PLUS LONGUE option, pas celle de
   l'option choisie : « FLUX.2 klein 9B pleine precision (a telecharger) » faisait
   379 px dans un conteneur de 331, mesure sur telephone. Avec
   « body{overflow-x:hidden} » il n'y avait meme pas de defilement pour aller
   voir : la fleche du menu etait hors ecran, coupee net. Le meme remede est
   applique a l'en-tete plus bas, avec le meme commentaire — il avait ete oublie
   ici. */
.outils select{min-width:0;max-width:100%}
.outils label.joindre:hover{border-color:var(--braise);color:var(--braise)}
.outils select:focus-visible,.outils label.joindre:focus-within{
  outline:2px solid var(--braise);outline-offset:2px}
input[type=file]{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
.jointe{display:flex;align-items:center;gap:9px;margin-top:9px;padding:6px 9px;
  background:var(--creux);border:1px solid var(--trait);border-radius:8px}
.jointe img,.jointe video{height:38px;border-radius:5px;display:block}
.jointe .genre{font:16px/1 var(--sans)}
.jointe span{flex:1;font:11.5px var(--mono);color:var(--encre-douce);
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jointe button{background:transparent;border:1px solid var(--trait-vif);border-radius:6px;
  color:var(--encre-douce);font:11px var(--mono);padding:4px 9px;cursor:pointer}
.alerte{margin-top:9px;color:var(--rouge);font:13px var(--sans)}

.tiroir-bouton{display:none;background:transparent;border:1px solid var(--trait-vif);
  border-radius:8px;color:var(--encre-douce);font:14px var(--mono);cursor:pointer;
  padding:4px 10px;margin-right:10px}
.voile{display:none;position:fixed;inset:0;background:#0008;z-index:8}
@media (max-width:820px){
  .tiroir-bouton{display:block}
  aside{position:fixed;top:0;bottom:0;left:0;z-index:9;width:82vw;max-width:300px;
    transform:translateX(-102%);transition:transform .22s ease;
    box-shadow:2px 0 18px #0007}
  body.ouvert aside{transform:none}
  body.ouvert .voile{display:block}
  footer .outils{flex-wrap:wrap}
  header{flex-wrap:wrap;row-gap:8px;padding:10px 12px}
  /* La jauge se replie au lieu d'elargir la page. « min-width:0 » est ce qui
     autorise vraiment le repli : sans lui, un enfant de flex refuse de passer
     sous sa largeur de contenu et pousse tout dehors. */
  header .jauge{gap:8px;row-gap:6px;flex-wrap:wrap;min-width:0;
    justify-content:flex-end}
  header .marque{flex:0 0 auto}
  .compte{flex-wrap:wrap;min-width:0}
  .compte b{max-width:12ch;overflow:hidden;text-overflow:ellipsis;
    white-space:nowrap}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<body>

      <input type="file" id="img"
             accept=".png,.jpg,.jpeg,.webp,.bmp,.mp4,.webm,.mkv,.mov,.mp3,.wav,.flac,.ogg,.opus,.m4a">

<script>
const $ = s => document.querySelector(s);
let imageJointe = null, apercuURL = null, convActive = null;
const suivis = new Map();           // tid -> {bloc, minuteur}

const TITRES = {};
/* Les guillemets et l'apostrophe en font partie, comme dans admin.html. Aucun
   appel d'ici ne sert aujourd'hui dans un ATTRIBUT, mais la premiere
   interpolation posee dans un title= ou un data- trouvera une fonction qui
   protege deja : c'est exactement l'oubli qui a donne la XSS de la console. */
const ech = s => String(s ?? "").replace(/[&<>"']/g,
  c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const EXT_IMG = /\.(png|jpe?g|webp|bmp|gif)$/i;
const EXT_VID = /\.(mp4|webm|mkv|mov)$/i;
const EXT_SON = /\.(mp3|flac|wav|ogg|opus)$/i;
/* le noeud fait partie de l'adresse : deux machines peuvent produire le meme
   nom de fichier le meme jour, le compteur de ComfyUI etant propre a chacune */
const url = f => `/api/fichier?filename=${encodeURIComponent(f.filename)}`
               + `&subfolder=${encodeURIComponent(f.subfolder || "")}&type=${f.type || "output"}`
               + (f.noeud ? `&noeud=${encodeURIComponent(f.noeud)}` : "");
const auBas = () => { const z = $("#zone"); z.scrollTop = z.scrollHeight; };

/* Le champ grandit avec ce qu'on ecrit, jusqu'a la hauteur maximale fixee en
   CSS — au-dela il defile. « auto » d'abord : sans cette remise a zero, le
   champ ne saurait que grandir, jamais retrecir. */
function ajuster() {
  const t = $("#txt");
  if (!t) return;
  t.style.height = "auto";
  t.style.height = t.scrollHeight + "px";
}

/* ── fil ─────────────────────────────────────────────────────────── */
function messageVide() {
  $("#fil").innerHTML = `<div class="vide">
    <h1>Dis ce que tu veux voir.</h1>
    <p>Une image, une vidéo, une musique, une retouche. Le moteur est choisi pour
       toi, et la conversation garde le fil : « la même mais en hiver » reprend
       ce qui précède.</p></div>`;
}
function ajouterDemande(texte, heure) {
  $("#fil").querySelector(".vide")?.remove();
  const d = document.createElement("div");
  d.className = "demande";
  d.innerHTML = ech(texte) + `<span class="heure">${ech(heure || new Date()
      .toLocaleTimeString("fr-FR", { hour: "2-digit", minute: "2-digit" }))}</span>`;
  $("#fil").appendChild(d);
}
function ajouterReponse() {
  const r = document.createElement("div");
  r.className = "reponse";
  r.innerHTML = `<div class="bandeau-tech"><span class="puce cours">en cours</span></div>
                 <div class="sortie"></div>`;
  $("#fil").appendChild(r);
  return r;
}
function bloque(titre, contenu) {
  const d = document.createElement("details");
  d.className = "detail";
  d.innerHTML = `<summary>${ech(titre)}</summary><div class="corps-detail"></div>`;
  d.querySelector(".corps-detail").textContent = contenu;
  return d;
}
/* Ce qu'on peut faire d'une sortie, la ou on la regarde. Sans ces boutons il
   fallait un clic droit — inexistant sur telephone — et, pour agrandir, passer
   par le disque puis rejoindre le fichier a la main. */
function actionsSortie(f) {
  const zone = document.createElement("div");
  zone.className = "actions-sortie";

  const tele = document.createElement("a");
  tele.href = url(f);
  tele.download = f.filename;
  tele.textContent = "télécharger";
  // Un lien ordinaire, pas du script : le navigateur sait deja nommer le
  // fichier, reprendre un transfert coupe et le ranger ou il faut.
  zone.appendChild(tele);

  if (EXT_IMG.test(f.filename) || EXT_VID.test(f.filename)) {
    const gros = document.createElement("button");
    gros.type = "button";
    gros.textContent = "plein écran";
    gros.onclick = () => plein(f);
    zone.appendChild(gros);
  }
  return zone;
}

/* Regarder une sortie en grand. Le clic sur l'image elle-meme fait la meme
   chose : c'est le geste que tout le monde essaie en premier. */
function plein(f) {
  const voile = document.createElement("div");
  voile.className = "plein";
  const el = document.createElement(EXT_VID.test(f.filename) ? "video" : "img");
  el.src = url(f);
  if (el.tagName === "VIDEO") { el.controls = true; el.autoplay = true; }
  else el.alt = f.filename;
  const fermer = document.createElement("button");
  fermer.type = "button"; fermer.className = "fermer";
  fermer.setAttribute("aria-label", "fermer"); fermer.textContent = "✕";
  voile.append(el, fermer);
  document.body.appendChild(voile);

  const partir = () => {
    voile.remove();
    document.removeEventListener("keydown", auClavier);
    // On ne retire l'entree d'historique que si c'est bien la notre : un retour
    // arriere l'a peut-etre deja consommee.
    if (location.hash === "#vue") history.back();
  };
  const auClavier = e => { if (e.key === "Escape") partir(); };
  // Une entree d'historique, pour que le bouton retour du telephone ferme
  // l'image au lieu de quitter la page.
  history.pushState({ vue: 1 }, "", "#vue");
  addEventListener("popstate", partir, { once: true });
  document.addEventListener("keydown", auClavier);
  voile.onclick = e => { if (e.target !== el) partir(); };
  fermer.onclick = partir;
}

function garnirReponse(bloc, t, cid) {
  // une conversation rechargee peut contenir une question restee en suspens
  if (t.etat === "question" && (t.questions || []).length) {
    garnirQuestion(bloc, t, cid || convActive);
    return;
  }
  // Un rendu encore en route : on se rebranche dessus. Sans cela, revenir sur
  // la conversation montrait une reponse vide et definitivement figee.
  if (t.etat === "en cours" && t.id) {
    bloc.querySelector(".bandeau-tech").innerHTML =
      '<span class="puce cours">en cours</span>';
    suivre(t.id, bloc, cid || convActive);
    return;
  }
  const p = t.plan || {};
  const rate = t.etat === "erreur";
  bloc.classList.toggle("rate", rate);
  const cle = p.modele || t.modele;
  const par = p.parametres || t.parametres;
  // Un echec doit sauter aux yeux ; une reussite se voit deja a l'image, et une
  // pastille verte de plus ne ferait qu'occuper la ligne.
  bloc.querySelector(".bandeau-tech").innerHTML =
    rate ? '<span class="puce rate">échec</span>' : "";

  const sortie = bloc.querySelector(".sortie");
  sortie.innerHTML = "";
  if (t.description) {
    const d = document.createElement("div");
    d.className = "lecture"; d.textContent = t.description;
    sortie.appendChild(d);
  }
  (t.fichiers || []).forEach(f => {
    const u = url(f); let el;
    if (EXT_VID.test(f.filename)) { el = document.createElement("video"); el.controls = true; el.loop = true; }
    else if (EXT_SON.test(f.filename)) { el = document.createElement("audio"); el.controls = true; }
    else if (EXT_IMG.test(f.filename)) { el = document.createElement("img"); el.alt = f.filename; }
    else { el = document.createElement("a"); el.href = u; el.download = f.filename;
           el.textContent = "télécharger " + f.filename; }
    if (el.tagName !== "A") el.src = u;
    // Le nom sert a retrouver le fichier, pas a lire l'image : infobulle.
    el.title = f.filename;
    sortie.appendChild(el);
    if (el.tagName === "IMG") { el.style.cursor = "zoom-in"; el.onclick = () => plein(f); }
    if (el.tagName !== "A") sortie.appendChild(actionsSortie(f));
  });
  if (rate) {
    const e = document.createElement("div");
    e.className = "echec"; e.textContent = t.erreur || "la génération a échoué";
    // Retaper dix lignes parce que le studio a redemarre est une punition
    // imméritée : le bouton reprend la demande, et le moteur imposé avec.
    if (t.demande) {
      const b = document.createElement("button");
      b.type = "button"; b.textContent = "relancer";
      b.title = "renvoyer exactement la même demande";
      b.onclick = () => {
        $("#txt").value = t.demande;
        if (t.modele && $("#forcer").querySelector(`option[value="${t.modele}"]`))
          $("#forcer").value = t.modele;
        ajuster();
        if (typeof peindreActifs === "function") peindreActifs();
        $("#go").click();
      };
      e.appendChild(b);
    }
    sortie.appendChild(e);
  }
  bloc.querySelectorAll("details.detail").forEach(d => d.remove());
  bloc.querySelectorAll(".signature").forEach(d => d.remove());

  // Une ligne de signature : ce qui a servi, en clair, sans encombrer.
  const sign = document.createElement("div");
  sign.className = "signature";
  if (cle) sign.appendChild(Object.assign(document.createElement("span"),
                                          { textContent: TITRES[cle] || cle }));
  if (t.id) sign.appendChild(barreAvis(t));
  bloc.appendChild(sign);

  // Tout le technique dans UN depliant, ferme. Le detail reste disponible pour
  // qui le cherche, sans etre impose a qui regarde une image.
  const morceaux = [];
  if (par && Object.keys(par).length)
    morceaux.push("réglages : " + Object.entries(par).map(([k, v]) => `${k}=${v}`).join(", "));
  if (t.raison) morceaux.push("choix : " + t.raison);
  const prompt = p.prompt || t.prompt;
  if (prompt) morceaux.push("prompt envoyé :\n" + prompt
                          + (p.negatif ? "\n\nécarté : " + p.negatif : ""));
  if (t.paroles) morceaux.push("paroles :\n" + t.paroles);
  const fics = (t.fichiers || []).map(f => f.filename).join("\n");
  if (fics) morceaux.push("fichiers :\n" + fics);
  if (t.etapes && t.etapes.length)
    morceaux.push("déroulé :\n" + t.etapes.map(e => `${e.t}  ${e.msg}`).join("\n"));
  if (morceaux.length) bloc.appendChild(bloque("détails", morceaux.join("\n\n")));

/* Le pouce sert a corriger le code : sans mesure, on regle a l'aveugle.
   Il est donc pose sur l'echange, la ou le resultat est encore sous les yeux,
   et non dans un formulaire separe que personne n'irait remplir. */
function barreAvis(t) {
  const zone = document.createElement("div");
  const barre = document.createElement("div");
  barre.className = "avis";
  const haut = document.createElement("button");
  haut.type = "button"; haut.textContent = "👍"; haut.title = "bonne réponse";
  const bas = document.createElement("button");
  bas.type = "button"; bas.textContent = "👎"; bas.title = "à retravailler";
  const dit = document.createElement("span");
  dit.className = "merci";
  barre.append(haut, bas, dit);
  zone.appendChild(barre);

  let pose = t.avis || 0;
  haut.classList.add("haut"); bas.classList.add("bas");
  const peindre = () => {
    haut.classList.toggle("pris", pose === 1);
    bas.classList.toggle("pris", pose === -1);
    dit.textContent = pose === 1 ? "noté, merci"
                    : pose === -1 ? "noté — je retravaille" : "";
  };
  peindre();

  const envoyer = async (avis, note) => {
    // Un second clic sur le meme pouce retire l'avis : s'etre trompe de bouton
    // ne doit pas obliger a choisir l'autre.
    const vise = (avis === pose && !note) ? 0 : avis;
    try {
      const r = await fetch("/api/avis", { method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ tid: t.id, avis: vise, note: note || "" }) });
      if (!r.ok) throw new Error((await r.json()).erreur || r.status);
      pose = vise; peindre();
      if (vise !== -1) zone.querySelectorAll(".avis-note").forEach(x => x.remove());
    } catch (e) { dit.textContent = "avis non enregistré : " + e.message; }
  };

  haut.onclick = () => { zone.querySelectorAll(".avis-note").forEach(x => x.remove());
                         envoyer(1, ""); };
  bas.onclick = () => {
    // Le pouce part tout de suite : le mot est un bonus, pas un peage.
    envoyer(-1, "");
    if (zone.querySelector(".avis-note")) return;
    const f = document.createElement("div");
    f.className = "avis-note";
    const champ = document.createElement("input");
    champ.type = "text"; champ.maxLength = 2000;
    champ.placeholder = "ce qui n'allait pas (facultatif)";
    const ok = document.createElement("button");
    ok.type = "button"; ok.textContent = "envoyer";
    ok.onclick = () => { if (champ.value.trim()) envoyer(-1, champ.value.trim()); f.remove(); };
    champ.onkeydown = ev => { if (ev.key === "Enter") ok.onclick(); };
    f.append(champ, ok);
    zone.appendChild(f);
    champ.focus();
  };
  return zone;
}

}

/* Le studio demande une precision. La reponse relance TOUT l'aiguillage :
   elle peut changer la nature du travail, pas seulement l'affiner. */
function garnirQuestion(bloc, t, cid) {
  bloc.classList.remove("rate");
  bloc.querySelector(".bandeau-tech").innerHTML =
    '<span class="puce cours">precision demandee</span>';
  const sortie = bloc.querySelector(".sortie");
  sortie.innerHTML = "";
  const q = document.createElement("div");
  q.className = "question";
  q.innerHTML = `<p>Avant de lancer, j'ai besoin de savoir&nbsp;:</p>
    <ul>${(t.questions || []).map(x => `<li>${ech(x)}</li>`).join("")}</ul>
    <div class="repondre">
      <input type="text" placeholder="ta réponse…" aria-label="Réponse à la précision demandée">
      <button>répondre</button>
    </div>`;
  sortie.appendChild(q);
  const champ = q.querySelector("input"), bouton = q.querySelector("button");
  const envoyer = async () => {
    const rep = champ.value.trim();
    if (!rep) return;
    bouton.disabled = true; champ.disabled = true;
    const complet = `${t.demande}\n\nPrécisions : ${rep}`;
    ajouterDemande(rep);
    const nouveau = ajouterReponse();
    auBas();
    try {
      const r = await fetch("/api/generer", {
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ texte: complet, conversation: cid,
                               taille: $("#taille").value,
                               priorite: $("#priorite").value })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.id) throw new Error(d.erreur || "le serveur a refusé la demande");
      suivre(d.id, nouveau, cid);
    } catch (err) {
      garnirReponse(nouveau, { etat: "erreur", erreur: err.message, fichiers: [] });
    }
  };
  bouton.onclick = envoyer;
  champ.onkeydown = e => { if (e.key === "Enter") envoyer(); };
  champ.focus();
}

/* ── conversations ───────────────────────────────────────────────── */
async function listerConversations() {
  try {
    const d = await (await fetch("/api/conversations")).json();
    convActive = convActive || d.courante;
    const box = $("#convs"); box.innerHTML = "";
    d.conversations.forEach(c => {
      const el = document.createElement("div");
      el.className = "conv" + (c.id === convActive ? " active" : "");
      el.innerHTML = `${ech(c.titre)}<small>${c.tours} échange${c.tours > 1 ? "s" : ""}</small>
                      <button class="jeter" title="Supprimer">×</button>`;
      el.onclick = e => { if (!e.target.classList.contains("jeter")) ouvrir(c.id); };
      el.querySelector(".jeter").onclick = async e => {
        e.stopPropagation();
        const r = await (await fetch("/api/conversation/" + c.id,
                                     { method: "DELETE" })).json();
        // Le serveur dit laquelle reste — il vient de la choisir. La redemander
        // ouvrait la porte a deux reponses differentes, et l'ecran gardait
        // parfois la conversation qu'on venait de fermer. ouvrir() rafraichit
        // la liste lui-meme, donc l'ordre compte : ouvrir PUIS lister.
        if (c.id === convActive) {
          convActive = null;
          await ouvrir(r.courante);
        } else {
          await listerConversations();
        }
      };
      box.appendChild(el);
    });
  } catch (e) { $("#convs").textContent = "liste indisponible"; }
}

/* Ce qui est tape et pas encore envoye appartient a la conversation, pas a la
   fenetre : passer voir un rendu ailleurs ne doit pas effacer une phrase en
   cours d'ecriture. */
const brouillons = {};

async function ouvrir(cid) {
  basculerTiroir(false);   // sur telephone, on referme apres avoir choisi
  if (convActive) brouillons[convActive] = $("#txt").value;
  // On ne coupe plus les suivis : un rendu lance ailleurs continue d'etre
  // ecoute, et sa conversation se met a jour quand on y revient.
  convActive = cid;
  $("#txt").value = brouillons[cid] || ""; ajuster();
  $("#go").disabled = false;
  // Dire au serveur laquelle on lit. La route existait et n'etait appelee de
  // nulle part : apres un F5, on retombait sur la derniere conversation CREEE,
  // pas sur celle qu'on avait sous les yeux. Sans « await » : c'est du confort,
  // pas une condition pour afficher.
  fetch("/api/conversation/" + cid + "/activer", { method: "POST" }).catch(() => {});
  const c = await (await fetch("/api/conversation/" + cid)).json();
  $("#fil").innerHTML = "";
  if (!c.tours || !c.tours.length) messageVide();
  else c.tours.forEach(t => { ajouterDemande(t.demande, t.heure);
                              garnirReponse(ajouterReponse(), t, cid); });
  await listerConversations();
  auBas();
}

$("#neuve").onclick = async () => {
  const c = await (await fetch("/api/conversations", { method: "POST" })).json();
  await ouvrir(c.id);
  $("#txt").focus();
};

/* Le choix de machine est retenu dans le navigateur, et lui seul : « epargne ma
   carte, je joue » vaut pour la soiree, pas pour une demande. Retenu par
   identifiant et non par rang : les machines vont et viennent. */
fetch("/api/machines").then(r => r.json()).then(ns => {
  const sel = $("#machine");
  if (!Array.isArray(ns) || ns.length < 2) return;   // une seule machine : rien a choisir
  for (const x of ns) {
    const o = document.createElement("option");
    o.value = x.id;
    // La VRAM est ce sur quoi le repartiteur tranche : la montrer explique le
    // choix automatique au lieu de le laisser paraitre arbitraire.
    o.textContent = x.titre + (x.vram ? ` — ${x.vram} Go` : "")
                  + (x.repond ? "" : " (ne repond pas)");
    sel.appendChild(o);
  }
  const garde = localStorage.getItem("machine");
  if (garde && sel.querySelector(`option[value="${CSS.escape(garde)}"]`)) sel.value = garde;
  sel.addEventListener("change", () => {
    if (sel.value) localStorage.setItem("machine", sel.value);
    else localStorage.removeItem("machine");
    peindreActifs();
  });
  peindreActifs();
}).catch(() => {});

/* ── amorçage ────────────────────────────────────────────────────── */
fetch("/api/modeles").then(r => r.json()).then(ms => {
  const sel = $("#forcer"); let prets = 0, locaux = ms.length;
  ms.forEach(m => {
    TITRES[m.cle] = m.titre;
    if (m.present && !m.distant) prets++;
    if (m.distant) locaux--;
    const o = document.createElement("option");
    o.value = m.cle; o.textContent = m.titre + (m.present ? "" : " (à télécharger)");
    sel.appendChild(o);
  });
  $("#jaugeModeles").innerHTML = `<b>${prets}/${locaux}</b> moteurs prêts`;
}).catch(() => { $("#jaugeModeles").innerHTML = "<b>serveur injoignable</b>"; })
  .finally(async () => {
    const d = await (await fetch("/api/conversations")).json();


    await ouvrir(d.courante);
  });

/* Les interrupteurs ne s'affichent que pour les modalites reellement
   joignables : sans cle posee, il n'y a rien a activer. */
async function peindreNuages() {
  let d;
  try {
    d = await (await fetch("/api/nuage", { credentials: "same-origin" })).json();
  } catch (e) { return; }
  const zone = document.querySelector("#nuages");
  zone.innerHTML = "";
  // Sans session, /api/nuage rend un 401 dont le corps n'a pas de « modalites ».
  // Boucler dessus levait une erreur avant meme l'affichage du formulaire.
  if (!Array.isArray(d.modalites)) return;
  for (const m of d.modalites) {
    if (!m.possible) continue;
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = m.signe;
    b.className = m.actif ? "allume" : "eteint";
    b.title = `${m.libelle} : ${m.actif ? m.titre : "cette machine"}`
            + `\n(cliquer pour ${m.actif ? "revenir en local" : "passer par " + m.titre})`;
    b.onclick = async () => {
      b.disabled = true;
      try {
        await fetch("/api/nuage", {
          method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ modalite: m.modalite, actif: !m.actif }) });
      } finally { b.disabled = false; }
      peindreNuages();

    };
    zone.appendChild(b);
  }
}
peindreNuages();

/* ── comptes ──────────────────────────────────────────────────────────
   Facultatifs : tant qu'aucun compte n'existe, rien ne s'affiche et le studio
   se comporte comme avant. Un compte connecte, en revanche, emporte son
   espace d'un appareil a l'autre. */
async function peindreCompte() {
  let d;
  try {
    d = await (await fetch("/api/compte", { credentials: "same-origin" })).json();
  } catch (e) { return; }
  const zone = document.querySelector("#compte");
  zone.innerHTML = "";
  if (!d.comptes_existent && !d.connecte) return;
  // Connexion obligatoire et personne de connecte : on ouvre le formulaire
  // plutot que de laisser l'utilisateur ecrire une demande qui sera refusee.
  if (d.obligatoire && !d.connecte) {
    document.querySelector("#txt").disabled = true;
    document.querySelector("#go").disabled = true;
    document.querySelector("#txt").placeholder = "connecte-toi pour commencer…";
    if (!document.querySelector(".voile-entree")) formulaireEntree();
  }
  document.querySelector("#lienAdmin").style.display = d.admin ? "" : "none";
  if (d.connecte) {
    const qui = document.createElement("span");
    qui.innerHTML = `<b>${ech(d.nom)}</b>${d.admin ? " \u00b7 admin" : ""}`;
    const sortir = document.createElement("button");
    sortir.type = "button"; sortir.textContent = "sortir";
    sortir.onclick = async () => {
      await fetch("/api/compte/sortir", { method: "POST", credentials: "same-origin" });
      location.reload();
    };
    zone.append(qui, sortir);
  } else {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = "se connecter";
    b.onclick = formulaireEntree;
    zone.appendChild(b);
  }
}

function formulaireEntree() {
  const voile = document.createElement("div");
  voile.className = "voile-entree";
  voile.innerHTML = `<form class="entree">
      <h3>Se connecter</h3>
      <input name="nom" placeholder="nom" autocomplete="username" autofocus>
      <input name="mdp" type="password" placeholder="mot de passe" autocomplete="current-password">
      <div class="mal"></div>
      <div class="rang"><button type="button" data-annuler>annuler</button>
                        <button type="submit">entrer</button></div>
    </form>`;
  document.body.appendChild(voile);
  const f = voile.querySelector("form");
  const fermer = () => voile.remove();
  voile.querySelector("[data-annuler]").onclick = fermer;
  voile.onclick = e => { if (e.target === voile) fermer(); };
  f.onsubmit = async e => {
    e.preventDefault();
    const mal = f.querySelector(".mal");
    mal.textContent = "";
    try {
      const r = await fetch("/api/compte/entrer", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nom: f.nom.value, mdp: f.mdp.value }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.erreur || "connexion refusée");
      fermer();
      // Rechargement plutot qu'une mise a jour partielle : l'identite change,
      // donc la liste des conversations, les fichiers, tout le contexte.
      if (d.reprises) alert(`${d.reprises} conversation(s) de ce navigateur `
                          + `ont été rattachées à ton compte.`);
      location.reload();
    } catch (err) {
      mal.textContent = err.message;
      // Le formulaire ne se referme pas sur un echec : c'est la seule porte.
    }
  };
}
peindreCompte();

/* ── la mediatheque ───────────────────────────────────────────────────
   Une sortie ne se retrouvait qu'en remontant la conversation qui l'avait
   produite. Passe vingt echanges c'est fastidieux, passe trois semaines c'est
   perdu. */
const FAMILLES_MEDIA = [["image", "images"], ["video", "vidéos"],
                        ["audio", "musiques"], ["objet3d", "objets 3D"]];
let familleVue = "image", mediaCharge = null;

async function ouvrirMediatheque() {
  document.querySelector("#mediatheque").hidden = false;
  if (!mediaCharge) {
    try {
      mediaCharge = await (await fetch("/api/mediatheque",
                                       { credentials: "same-origin" })).json();
    } catch (e) { mediaCharge = { fichiers: [], compte: {} }; }
  }
  peindreFamilles();
  const tous = mediaCharge.fichiers || [];
  garnirChoix($("#moteurMedia"), tous.map(f => f.moteur), "tous les moteurs");
  garnirChoix($("#machineMedia"), tous.map(f => f.noeud), "toutes les machines");
  const quiSel = $("#quiMedia");
  // Le proprietaire n'existe que pour un administrateur : le serveur ne le sert
  // a personne d'autre, et le selecteur reste donc cache.
  quiSel.hidden = !mediaCharge.tout;
  // Trier par proprietaire n'a de sens que pour qui en voit plusieurs : sans
  // cela l'option existe, ne fait rien, et laisse croire a une panne.
  const triQui = $("#triMedia").querySelector('option[value="a"]');
  if (triQui) triQui.hidden = !mediaCharge.tout;
  if (!mediaCharge.tout && $("#triMedia").value === "a")
    $("#triMedia").value = "-quand";
  if (mediaCharge.tout)
    garnirChoix(quiSel, tous.map(f => f.a), "tout le monde");
  for (const id of ["#chercheMedia", "#triMedia", "#moteurMedia",
                    "#machineMedia", "#quiMedia"])
    $(id).oninput = peindreGrille;
  peindreGrille();
}

function peindreFamilles() {
  const z = document.querySelector("#famillesMedia");
  z.innerHTML = "";
  for (const [cle, nom] of FAMILLES_MEDIA) {
    const combien = (mediaCharge.compte || {})[cle] || 0;
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = `${nom} (${combien})`;
    b.className = cle === familleVue ? "ouvert" : "";
    b.disabled = !combien;
    b.onclick = () => { familleVue = cle; peindreFamilles(); peindreGrille(); };
    z.appendChild(b);
  }
}

/* Remplit un selecteur avec les valeurs presentes, sans doublon et triees.
   Ne proposer que ce qui EXISTE : un menu de vingt moteurs dont deux ont servi
   fait chercher dans le vide. */
function garnirChoix(sel, valeurs, tout) {
  if (!sel) return;
  const avant = sel.value;
  const vues = [...new Set(valeurs.filter(Boolean))].sort();
  sel.innerHTML = `<option value="">${tout}</option>`
    + vues.map(v => `<option value="${ech(v)}">${ech(v)}</option>`).join("");
  if (vues.includes(avant)) sel.value = avant;
}

function trierEtFiltrer(liste) {
  const q = ($("#chercheMedia").value || "").trim().toLowerCase();
  const moteur = $("#moteurMedia").value;
  const machine = $("#machineMedia").value;
  const qui = $("#quiMedia").value;
  const tri = $("#triMedia").value;

  const gardees = liste.filter(f =>
    (!moteur || f.moteur === moteur)
    && (!machine || f.noeud === machine)
    && (!qui || f.a === qui)
    // La recherche porte sur ce que l'utilisateur a ECRIT, sur ce qui a ete
    // ENVOYE au moteur, et sur le nom du fichier : les trois façons dont on se
    // souvient d'une image qu'on a produite il y a trois semaines.
    && (!q || [(f.demande || ""), (f.prompt || ""), (f.filename || "")]
                .some(x => x.toLowerCase().includes(q))));

  const dec = tri.startsWith("-");
  const cle = dec ? tri.slice(1) : tri;
  return gardees.sort((a, b) => {
    const x = a[cle] ?? "", y = b[cle] ?? "";
    const c = typeof x === "number" && typeof y === "number"
      ? x - y : String(x).localeCompare(String(y), "fr");
    // A egalite, du plus recent au plus ancien : c'est l'ordre qu'on attend
    // quand on trie par moteur ou par proprietaire.
    return (dec ? -c : c) || (b.quand || 0) - (a.quand || 0);
  });
}

function peindreGrille() {
  const g = document.querySelector("#grilleMedia");
  g.innerHTML = "";
  // Une vue qui n'est pas la sienne doit se dire. Sans cela, un administrateur
  // croit regarder sa propre production et tombe sur celle d'un autre.
  const banniere = document.querySelector("#toutLeStudio");
  if (banniere)
    banniere.textContent = mediaCharge.tout
      ? "vue administrateur — tout ce que ce studio a produit" : "";
  const dansLaFamille = (mediaCharge.fichiers || [])
    .filter(f => f.famille === familleVue);
  const liste = trierEtFiltrer(dansLaFamille);
  const compteur = $("#combienMedia");
  if (compteur)
    compteur.textContent = liste.length === dansLaFamille.length
      ? `${liste.length} pièce${liste.length > 1 ? "s" : ""}`
      : `${liste.length} sur ${dansLaFamille.length}`;
  if (!liste.length) {
    g.innerHTML = '<p class="vide-media">rien de ce type pour l\'instant</p>';
    return;
  }
  for (const f of liste) {
    const carte = document.createElement("figure");
    carte.className = "media";
    let el;
    if (f.famille === "video") { el = document.createElement("video"); el.controls = true; }
    else if (f.famille === "audio") { el = document.createElement("audio"); el.controls = true; }
    else if (f.famille === "image") { el = document.createElement("img"); el.loading = "lazy"; el.alt = f.demande; }
    else { el = document.createElement("div"); el.className = "cube"; el.textContent = "▣"; }
    if (el.tagName !== "DIV") el.src = url(f);
    if (el.tagName === "IMG") { el.style.cursor = "zoom-in"; el.onclick = () => plein(f); }
    carte.appendChild(el);

    const legende = document.createElement("figcaption");
    const quand = f.quand
      ? new Date(f.quand * 1000).toLocaleString("fr-FR",
          { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })
      : (f.heure || "");
    // « f.a » n'arrive qu'a un administrateur : le serveur ne le sert a
    // personne d'autre. Le nom du proprietaire est mis en avant, pour qu'on ne
    // confonde jamais la piece de quelqu'un d'autre avec la sienne.
    legende.innerHTML = `<span>${ech(f.demande || f.filename)}</span>`
                      + `<small>${f.a ? "<b>" + ech(f.a) + "</b> · " : ""}`
                      + `${ech(f.moteur || "")} · ${ech(quand)}</small>`;
    // Replie : le prompt envoye fait souvent dix lignes, et on ne le cherche
    // que lorsqu'un rendu surprend. Deplie, il repond a « pourquoi cette
    // image-la ».
    if (f.prompt && f.prompt !== f.demande)
      legende.innerHTML += `<details><summary>prompt envoyé</summary>`
                         + `<span class="envoye">${ech(f.prompt)}</span></details>`;
    carte.appendChild(legende);

    const actions = document.createElement("div");
    actions.className = "actions-sortie";
    const tele = document.createElement("a");
    tele.href = url(f); tele.download = f.filename; tele.textContent = "télécharger";
    actions.appendChild(tele);
    if (f.famille === "image" || f.famille === "video") {
      const gros = document.createElement("button");
      gros.type = "button"; gros.textContent = "plein écran";
      gros.onclick = () => plein(f);
      actions.appendChild(gros);
    }
    if (f.famille !== "objet3d") {
      const rep = document.createElement("button");
      rep.type = "button"; rep.textContent = "reprendre";
      rep.title = "joindre ce fichier pour le retravailler";
      rep.onclick = async () => {
        rep.disabled = true;
        try {
          const r = await fetch("/api/reprendre", {
            method: "POST", credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ filename: f.filename,
                                   subfolder: f.subfolder || "", noeud: f.noeud }) });
          const d = await r.json().catch(() => ({}));
          if (!r.ok || !d.image) throw new Error(d.erreur || "reprise impossible");
          imageJointe = d.image;
          $("#nomimg").textContent = f.filename;
          // La vignette avec : une piece jointe sans apercu ne dit pas laquelle
          // on vient de reprendre, et on en reprend souvent plusieurs de suite.
          const zone = $("#apercu-zone");
          zone.innerHTML = "";
          if (f.famille === "image") {
            const i = document.createElement("img");
            i.src = url(f); i.alt = f.filename; zone.appendChild(i);
          } else if (f.famille === "video") {
            const v = document.createElement("video");
            v.src = url(f); v.muted = true; zone.appendChild(v);
          } else {
            zone.innerHTML = '<span class="genre">♪</span>';
          }
          $("#jointe").style.display = "";
          fermerMediatheque();
          $("#txt").focus();
        } catch (err) { $("#alerte").textContent = err.message; }
        finally { rep.disabled = false; }
      };
      actions.appendChild(rep);
    }
    carte.appendChild(actions);
    g.appendChild(carte);
  }
}

function fermerMediatheque() {
  document.querySelector("#mediatheque").hidden = true;
}

document.querySelector("#ouvrirMedia").onclick = () => {
  mediaCharge = null;      // toujours frais : on vient d'en produire
  ouvrirMediatheque();
};
document.querySelector("#fermerMedia").onclick = fermerMediatheque;
document.addEventListener("keydown", e => {
  // La vue plein ecran s'ouvre PAR-DESSUS la mediatheque : echap doit fermer
  // celle du dessus, pas les deux d'un coup.
  if (e.key === "Escape" && !document.querySelector(".plein")
      && !document.querySelector("#mediatheque").hidden)
    fermerMediatheque();
});

/* ── la file, au survol et au clic ─────────────────────────────────────
   Le compteur disait « 3 demandes » sans dire lesquelles : impossible de
   savoir si l'attente venait d'une video de six minutes lancee par erreur, et
   impossible de la retirer. */
let fileOuverte = false, minuteurFile = null;

function fermerFile() {
  fileOuverte = false;
  document.querySelector("#panneauFile").classList.remove("ouvert");
  if (minuteurFile) { clearInterval(minuteurFile); minuteurFile = null; }
}

async function peindreFile() {
  const p = document.querySelector("#panneauFile");
  let d;
  try {
    d = await (await fetch("/api/file", { credentials: "same-origin" })).json();
  } catch (e) { return; }
  const lignes = d.lignes || [];
  if (!lignes.length) {
    p.innerHTML = "<h4>file d'attente</h4>"
                + '<div class="tache"><span class="quoi">rien en cours</span></div>';
    return;
  }
  p.innerHTML = "<h4>file d'attente"
    + (d.admin ? " — vue administrateur" : "") + "</h4>";
  for (const t of lignes) {
    const el = document.createElement("div");
    el.className = "tache" + (t.a_moi ? "" : " autrui");
    const rang = t.en_cours ? "▶" : t.rang;
    const etats = { "en cours": ["cours", "en cours"], fini: ["fini", "terminé"],
                    erreur: ["rate", "échec"], question: ["attente", "en attente de précision"],
                    // Analysée, sa machine est choisie, et cette machine
                    // travaille pour quelqu'un d'autre. Ni file, ni calcul.
                    "attente carte": ["attente", "attend une carte"] };
    // Une demande porte l'etat « en cours » des sa creation : c'est l'etat de
    // la TACHE, pas sa place dans la file. Seule la ligne marquee en_cours
    // occupe vraiment la carte ; les autres attendaient en affichant
    // « en cours », ce qui rendait la file illisible.
    const [classe, mot] = (!t.en_cours && t.etat === "en cours")
      ? ["attente", "en attente"]
      : (etats[t.etat] || ["attente", "en attente"]);
    // Le pourcentage vient de ComfyUI ; sans lui on montre l'etat seul.
    const pct = t.avance && t.avance.total
      ? Math.round(t.avance.fait * 100 / t.avance.total) : null;
    el.innerHTML = `<span class="rang">${rang}</span>
      <span class="quoi">${ech(t.demande)}
        <small>${ech(t.type)}${t.qui ? " · " + ech(t.qui) : ""}</small>
        <span class="etat-tache ${classe}">${mot}`
      + (pct !== null ? ` — ${pct} %` : "")
      + (t.ou ? " · " + ech(t.ou) : "") + `</span>`
      + (pct !== null
          ? `<span class="avance"><i style="width:${pct}%"></i></span>` : "")
      + `</span>`;
    if (t.annulable) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = t.en_cours ? "interrompre" : "retirer";
      b.onclick = async ev => {
        ev.stopPropagation();
        b.disabled = true;
        await fetch("/api/file/" + encodeURIComponent(t.tid),
                    { method: "DELETE", credentials: "same-origin" });
        peindreFile();
      };
      el.appendChild(b);
    }
    p.appendChild(el);
  }
}

function ouvrirFile() {
  if (fileOuverte) return;
  fileOuverte = true;
  document.querySelector("#panneauFile").classList.add("ouvert");
  peindreFile();
  // Rafraichi tant qu'il est ouvert : une file qui avance sous les yeux est la
  // seule facon de voir qu'elle avance.
  minuteurFile = setInterval(peindreFile, 3000);
}

document.addEventListener("click", e => {
  const compteur = e.target.closest("#etatFile");
  const dedans = e.target.closest("#panneauFile");
  if (compteur) { fileOuverte ? fermerFile() : ouvrirFile(); return; }
  if (!dedans && fileOuverte) fermerFile();
});
document.querySelector("#etatFile").addEventListener("mouseenter", ouvrirFile);
document.querySelector("#panneauFile").addEventListener("mouseleave", e => {
  // On ne referme au survol que si l'on n'a pas ouvert au clic : sur une
  // tablette, un doigt qui frole refermerait le panneau qu'on vient d'ouvrir.
  if (e.buttons === 0 && window.matchMedia("(hover: hover)").matches) fermerFile();
});

/* Les reglages restent replies, mais jamais silencieux : ce qui s'ecarte du
   defaut s'affiche en clair, et se retire d'un clic. Un reglage applique sans
   etre visible donne le sentiment de ne pas etre ecoute. */
const REGLAGES = [
  { sel: "#forcer", nom: "moteur", lire: o => o.textContent },
  { sel: "#machine", nom: "machine", lire: o => o.textContent.split(" — ")[0] },
  { sel: "#priorite", nom: "", lire: o => o.textContent.split(" — ")[0] },
  { sel: "#taille", nom: "", lire: o => o.textContent.split(" — ")[0] },
];

function peindreActifs() {
  const zone = document.querySelector("#actifs");
  zone.innerHTML = "";
  for (const r of REGLAGES) {
    const el = document.querySelector(r.sel);
    if (!el || !el.value) continue;
    const mot = document.createElement("span");
    mot.className = "oter";
    mot.textContent = (r.nom ? r.nom + " " : "") + r.lire(el.selectedOptions[0]);
    mot.title = "cliquer pour revenir à l'automatique";
    mot.onclick = () => { el.value = ""; peindreActifs(); };
    zone.appendChild(mot);
  }
}
REGLAGES.forEach(r => {
  const el = document.querySelector(r.sel);
  if (el) el.addEventListener("change", peindreActifs);
});
document.querySelector("#plier").onclick = e => {
  const outils = document.querySelector("#outils");
  const ouvert = outils.classList.toggle("replie") === false;
  e.target.classList.toggle("ouvert", ouvert);
  e.target.setAttribute("aria-expanded", String(ouvert));
};
/* La taille ne s'applique qu'aux images : la laisser active pour un moteur
   audio ou vidéo ferait croire que la consigne est prise en compte. */
const SANS_TAILLE = ["wan5b", "wan14b", "audio", "audioplus", "edition", "objet3d"];
function accorderTaille() {
  const m = $("#forcer").value;
  const inerte = SANS_TAILLE.includes(m);
  $("#taille").disabled = inerte;
  $("#taille").title = inerte
    ? "sans effet sur ce moteur : la taille vient de la source ou du format"
    : "";
}
$("#forcer").addEventListener("change", accorderTaille);
accorderTaille();

peindreActifs();

/* Le champ grandit en tapant. La fonction existait, mais plus rien ne
   l'appelait a la frappe : elle ne jouait qu'a l'ouverture d'une conversation,
   et le champ restait sur une ligne quelle que soit la longueur du texte. */
$("#txt").addEventListener("input", ajuster);
ajuster();

setInterval(async () => {
  try {
    const f = await (await fetch("/api/file")).json();
    // « occupe ? 1 : 0 » etait juste du temps ou un seul travail pouvait
    // courir. Depuis qu'il y en a plusieurs, le compteur annonçait « 1 en file »
    // pendant que le panneau en montrait trois.
    const n = (f.en_attente || 0) + (f.en_vol || 0);
    const moi = f.a_moi || 0;
    $("#etatFile").innerHTML = n
      ? `<span class="file-vive">${n} en file${moi && moi < n ? ` · ${moi} à toi` : ""}</span>`
      : "";
  } catch (e) { /* sans effet */ }
}, 2500);

/* ── tiroir des conversations sur petit ecran ──────────────────────
   La barre laterale etait simplement masquee sous 820 px : sur telephone,
   ni la liste des conversations, ni le bouton d'en creer une, ni l'etat du
   moteur n'etaient atteignables. */
const basculerTiroir = ouvrir =>
  document.body.classList.toggle("ouvert",
    ouvrir === undefined ? !document.body.classList.contains("ouvert") : ouvrir);
$("#tiroir").onclick = () => basculerTiroir();
$("#voile").onclick = () => basculerTiroir(false);

$("#img").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  $("#alerte").textContent = "";
  try {
    const fd = new FormData(); fd.append("f", f);
    const r = await fetch("/api/televerser", { method: "POST", body: fd });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.image) throw new Error(d.erreur || "échec du téléversement");
    imageJointe = d.image;
    if (apercuURL) URL.revokeObjectURL(apercuURL);
    apercuURL = URL.createObjectURL(f);
    // Une video dans une balise <img> ne montre rien : chaque famille a son
    // apercu, et un signe suffit pour un son qu'on ne regarde pas.
    const zone = $("#apercu-zone");
    zone.innerHTML = "";
    if (EXT_VID.test(f.name)) {
      const v = document.createElement("video");
      v.src = apercuURL; v.muted = true; zone.appendChild(v);
    } else if (EXT_SON.test(f.name)) {
      zone.innerHTML = '<span class="genre">\u266A</span>';
    } else {
      const i = document.createElement("img");
      i.src = apercuURL; i.alt = "aperçu du fichier joint"; zone.appendChild(i);
    }
    $("#nomimg").textContent = f.name;
    $("#jointe").style.display = "flex";
  } catch (err) { detacher(); $("#alerte").textContent = "Fichier non joint : " + err.message; }
};
function detacher() {
  imageJointe = null;
  if (apercuURL) { URL.revokeObjectURL(apercuURL); apercuURL = null; }
  $("#apercu-zone").innerHTML = "";
  $("#jointe").style.display = "none";
  $("#img").value = "";
}
$("#retirer").onclick = detacher;

$("#go").onclick = async () => {
  const texte = $("#txt").value.trim();
  if (!texte && !imageJointe) return;
  $("#alerte").textContent = "";
  const monConv = convActive;
  ajouterDemande(texte);
  const bloc = ajouterReponse();
  auBas();
  $("#txt").value = ""; ajuster();
  try {
    const r = await fetch("/api/generer", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ texte, image: imageJointe, modele: $("#forcer").value,
                             taille: $("#taille").value, priorite: $("#priorite").value,
                             noeud: $("#machine").value || null,
                             conversation: monConv })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.id) throw new Error(d.erreur || "le serveur a refusé la demande");
    detacher();
    // La conversation remonte tout de suite : le tour est deja enregistre cote
    // serveur, et attendre la fin du rendu laissait croire que rien n'etait
    // parti.
    listerConversations();
    suivre(d.id, bloc, monConv);
  } catch (err) {
    garnirReponse(bloc, { etat: "erreur", erreur: err.message, fichiers: [] });
    $("#alerte").textContent = err.message;
    auBas();
  }
};

/* Le sondage est indexe par tache : plusieurs demandes peuvent courir
   en parallele, y compris dans des conversations differentes. */
function suivre(id, bloc, cid) {
  const depart = Date.now();
  const ancien = suivis.get(id);
  if (ancien) { clearInterval(ancien.minuteur); suivis.delete(id); }
  const minuteur = setInterval(async () => {
    try {
      const r = await fetch("/api/etat/" + id);
      if (!r.ok) throw new Error("tâche inconnue — le serveur a-t-il redémarré ?");
      const t = await r.json();
      if (!Array.isArray(t.etapes)) throw new Error("réponse inattendue du serveur");
      const visible = cid === convActive && document.body.contains(bloc);

      if (visible && t.etat === "en cours") {
        const derniere = t.etapes[t.etapes.length - 1];
        const puces = bloc.querySelector(".bandeau-tech");
        // Le pourcentage existait deja — dans le panneau de file, qu'il faut
        // ouvrir. Ici, la bulle n'affichait que la derniere ligne de journal :
        // « travail confie a NAS ZimaOS — en attente de sa reponse », figee 150
        // des 157 secondes d'un rendu mesure. On voyait un studio en panne.
        //
        // Les secondes ecoulees s'affichent MEME sans pourcentage : les 27
        // premieres secondes n'en ont pas, et un ecran ou rien ne bouge est
        // exactement ce qui fait recharger la page au milieu d'un rendu.
        const pct = t.avance && t.avance.total
          ? Math.round(t.avance.fait * 100 / t.avance.total) : null;
        const secondes = Math.round((Date.now() - depart) / 1000);
        puces.innerHTML = t.position
          ? `<span class="puce attente">en file — ${t.position} devant</span>`
          : `<span class="puce cours">${ech((derniere ? derniere.msg : "…").slice(0, 64))}`
            + `${pct === null ? "" : ` · ${pct} %`} · ${secondes} s</span>`
            + (pct === null ? ""
               : `<span class="avance"><i style="width:${pct}%"></i></span>`);
      }
      if (t.etat === "question") {
        clearInterval(minuteur); suivis.delete(id);
        if (visible) { garnirQuestion(bloc, t, cid); auBas(); }
        listerConversations();
        return;
      }
      if (t.etat === "fini" || t.etat === "erreur") {
        clearInterval(minuteur); suivis.delete(id);
        const derniere = t.etapes[t.etapes.length - 1];
        if (t.etat === "erreur" && derniere) t.erreur = derniere.msg;
        if (visible) { garnirReponse(bloc, t); auBas(); }
        listerConversations();
        // Une machine a agent confirme l'arret de sa carte une a deux secondes
        // plus tard, par une ligne de journal de plus. Le sondage s'arrete
        // juste au-dessus et ne la verrait jamais : la bulle resterait sur
        // « arret demande », c'est-a-dire sur une promesse. Le 29 aout, c'est
        // exactement ce mecanisme qui a fait lire « interrompue » a
        // l'utilisateur pendant que le NAS calculait encore.
        if (t.etat === "erreur" && /^arret demande a /.test(t.erreur || ""))
          setTimeout(async () => {
            try {
              const r2 = await fetch("/api/etat/" + id);
              if (!r2.ok) return;
              const t2 = await r2.json();
              const suite = (t2.etapes || [])[(t2.etapes || []).length - 1];
              if (!suite || suite.msg === t.erreur) return;
              t2.erreur = suite.msg;
              if (cid === convActive && document.body.contains(bloc))
                garnirReponse(bloc, t2, cid);
            } catch (e) { /* la bulle garde la promesse : elle etait vraie */ }
          }, 8000);
      }
    } catch (err) {
      clearInterval(minuteur); suivis.delete(id);
      if (document.body.contains(bloc))
        garnirReponse(bloc, { etat: "erreur", erreur: err.message, fichiers: [] });
    }
  }, 1200);
  suivis.set(id, { bloc, minuteur });
}
</script>
