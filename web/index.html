  $("#jaugeModeles").innerHTML = `<b>${prets}/${locaux}</b> moteurs prêts`;
  poserReglages(reglagesVoulus);   // meme raison que pour les machines
}).catch(() => { $("#jaugeModeles").innerHTML = "<b>serveur injoignable</b>"; })
  .finally(async () => {
    const d = await (await fetch("/api/conversations")).json();


    await ouvrir(d.courante);
  });

/* Les interrupteurs ne s'affichent que pour les modalites reellement
   joignables : sans cle posee, il n'y a rien a activer. */
async function peindreNuages() {
  let d;
  try {
    d = await (await fetch("/api/nuage", { credentials: "same-origin" })).json();
  } catch (e) { return; }
  const zone = document.querySelector("#nuages");
  zone.innerHTML = "";
  // Sans session, /api/nuage rend un 401 dont le corps n'a pas de « modalites ».
  // Boucler dessus levait une erreur avant meme l'affichage du formulaire.
  if (!Array.isArray(d.modalites)) return;
  // Le plafond du mois, quand il y en a un : au-dela, nuage_actif() refuse pour
  // TOUTES les modalites a la fois, et aucun clic n'y changera rien avant le
  // premier du mois. Un interrupteur qu'on laisserait cliquable ferait croire a
  // une panne — il repasse eteint sans rien dire, appel apres appel.
  const q = d.plafond || null;
  // « plafonne » et non « bloque » : bloque() est deja le nom d'une fonction de
  // cette page — celle qui fabrique le depliant des details. Une locale du meme
  // nom la masquerait ici, et la prochaine ligne qui l'appellerait dans
  // peindreNuages appellerait un booleen.
  const plafonne = !!(q && q.atteint);
  for (const m of d.modalites) {
    if (!m.possible) continue;
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = m.signe;
    b.className = (m.actif ? "allume" : "eteint") + (plafonne ? " plafonne" : "");
    b.disabled = plafonne;
    b.title = plafonne
      ? `${m.libelle} : plafond du mois atteint (${q.faits} appels distants sur `
        + `${q.limite}). Le studio reste sur cette machine jusqu'au mois `
        + `prochain ; le plafond se regle dans /admin.`
      : `${m.libelle} : ${m.actif ? m.titre : "cette machine"}`
        + `\n(cliquer pour ${m.actif ? "revenir en local" : "passer par " + m.titre})`;
    b.onclick = async () => {
      b.disabled = true;
      try {
        await fetch("/api/nuage", {
          method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ modalite: m.modalite, actif: !m.actif }) });
      } finally { b.disabled = false; }
      peindreNuages();

    };
    zone.appendChild(b);
  }
  // Ecrit, pas seulement en infobulle : sur telephone il n'y a pas de survol, et
  // c'est la que le compte se lit le moins bien. Affiche des qu'un plafond
  // existe et non seulement une fois atteint — savoir qu'on en est a 118 sur
  // 120 evite de lancer la video de six minutes qui sera refusee.
  if (q) {
    const mention = document.createElement("span");
    mention.className = "plafond" + (q.atteint ? " atteint" : "");
    mention.textContent = q.atteint ? `plafond atteint · ${q.faits}/${q.limite}`
                                    : `nuage ${q.faits}/${q.limite}`;
    mention.title = `${q.faits} appel(s) distant(s) ce mois-ci (${q.mois}) sur `
      + `${q.limite} pour le compte ${q.compte}.`
      + (q.atteint ? " Les demandes restent sur cette machine jusqu'au mois "
                   + "prochain." : "");
    zone.appendChild(mention);
  }
}
peindreNuages();

/* ── comptes ──────────────────────────────────────────────────────────
   Facultatifs : tant qu'aucun compte n'existe, rien ne s'affiche et le studio
   se comporte comme avant. Un compte connecte, en revanche, emporte son
   espace d'un appareil a l'autre. */
async function peindreCompte() {
  let d;
  try {
    d = await (await fetch("/api/compte", { credentials: "same-origin" })).json();
  } catch (e) { return; }
  const zone = document.querySelector("#compte");
  zone.innerHTML = "";
  if (!d.comptes_existent && !d.connecte) return;
  // Connexion obligatoire et personne de connecte : on ouvre le formulaire
  // plutot que de laisser l'utilisateur ecrire une demande qui sera refusee.
  if (d.obligatoire && !d.connecte) {
    document.querySelector("#txt").disabled = true;
    document.querySelector("#go").disabled = true;
    document.querySelector("#txt").placeholder = "connecte-toi pour commencer…";
    if (!document.querySelector(".voile-entree")) formulaireEntree();
  }
  document.querySelector("#lienAdmin").style.display = d.admin ? "" : "none";
  if (d.connecte) {
    const qui = document.createElement("span");
    qui.innerHTML = `<b>${ech(d.nom)}</b>${d.admin ? " \u00b7 admin" : ""}`;
    const sortir = document.createElement("button");
    sortir.type = "button"; sortir.textContent = "sortir";
    sortir.onclick = async () => {
      await fetch("/api/compte/sortir", { method: "POST", credentials: "same-origin" });
      location.reload();
    };
    zone.append(qui, sortir);
  } else {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = "se connecter";
    b.onclick = formulaireEntree;
    zone.appendChild(b);
  }
}

function formulaireEntree() {
  const voile = document.createElement("div");
  voile.className = "voile-entree";
  voile.innerHTML = `<form class="entree">
      <h3>Se connecter</h3>
      <input name="nom" placeholder="nom" autocomplete="username" autofocus>
      <input name="mdp" type="password" placeholder="mot de passe" autocomplete="current-password">
      <div class="mal"></div>
      <div class="rang"><button type="button" data-annuler>annuler</button>
                        <button type="submit">entrer</button></div>
    </form>`;
  document.body.appendChild(voile);
  const f = voile.querySelector("form");
  const fermer = () => voile.remove();
  voile.querySelector("[data-annuler]").onclick = fermer;
  voile.onclick = e => { if (e.target === voile) fermer(); };
  f.onsubmit = async e => {
    e.preventDefault();
    const mal = f.querySelector(".mal");
    mal.textContent = "";
    try {
      const r = await fetch("/api/compte/entrer", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nom: f.nom.value, mdp: f.mdp.value }) });
      const d = await r.json();
      if (!r.ok) throw new Error(d.erreur || "connexion refusée");
      fermer();
      // Rechargement plutot qu'une mise a jour partielle : l'identite change,
      // donc la liste des conversations, les fichiers, tout le contexte.
      if (d.reprises) alert(`${d.reprises} conversation(s) de ce navigateur `
                          + `ont été rattachées à ton compte.`);
      location.reload();
    } catch (err) {
      mal.textContent = err.message;
      // Le formulaire ne se referme pas sur un echec : c'est la seule porte.
    }
  };
}
peindreCompte();

/* ── la mediatheque ───────────────────────────────────────────────────
   Une sortie ne se retrouvait qu'en remontant la conversation qui l'avait
   produite. Passe vingt echanges c'est fastidieux, passe trois semaines c'est
   perdu. */
const FAMILLES_MEDIA = [["image", "images"], ["video", "vidéos"],
                        ["audio", "musiques"], ["objet3d", "objets 3D"]];
let familleVue = "image", mediaCharge = null;

async function ouvrirMediatheque() {
  document.querySelector("#mediatheque").hidden = false;
  if (!mediaCharge) {
    try {
      mediaCharge = await (await fetch("/api/mediatheque",
                                       { credentials: "same-origin" })).json();
    } catch (e) { mediaCharge = { fichiers: [], compte: {} }; }
  }
  peindreFamilles();
  const tous = mediaCharge.fichiers || [];
  garnirChoix($("#moteurMedia"), tous.map(f => f.moteur), "tous les moteurs");
  garnirChoix($("#machineMedia"), tous.map(f => f.noeud), "toutes les machines");
  const quiSel = $("#quiMedia");
  // Le proprietaire n'existe que pour un administrateur : le serveur ne le sert
  // a personne d'autre, et le selecteur reste donc cache.
  quiSel.hidden = !mediaCharge.tout;
  // Trier par proprietaire n'a de sens que pour qui en voit plusieurs : sans
  // cela l'option existe, ne fait rien, et laisse croire a une panne.
  const triQui = $("#triMedia").querySelector('option[value="a"]');
  if (triQui) triQui.hidden = !mediaCharge.tout;
  if (!mediaCharge.tout && $("#triMedia").value === "a")
    $("#triMedia").value = "-quand";
  if (mediaCharge.tout)
    garnirChoix(quiSel, tous.map(f => f.a), "tout le monde");
  for (const id of ["#chercheMedia", "#triMedia", "#moteurMedia",
                    "#machineMedia", "#quiMedia", "#soinMedia"])
    $(id).oninput = peindreGrille;
  peindreGrille();
}

function peindreFamilles() {
  const z = document.querySelector("#famillesMedia");
  z.innerHTML = "";
  for (const [cle, nom] of FAMILLES_MEDIA) {
    const combien = (mediaCharge.compte || {})[cle] || 0;
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = `${nom} (${combien})`;
    b.className = cle === familleVue ? "ouvert" : "";
    b.disabled = !combien;
    b.onclick = () => { familleVue = cle; peindreFamilles(); peindreGrille(); };
    z.appendChild(b);
  }
}

/* Remplit un selecteur avec les valeurs presentes, sans doublon et triees.
   Ne proposer que ce qui EXISTE : un menu de vingt moteurs dont deux ont servi
   fait chercher dans le vide. */
function garnirChoix(sel, valeurs, tout) {
  if (!sel) return;
  const avant = sel.value;
  const vues = [...new Set(valeurs.filter(Boolean))].sort();
  sel.innerHTML = `<option value="">${tout}</option>`
    + vues.map(v => `<option value="${ech(v)}">${ech(v)}</option>`).join("");
  if (vues.includes(avant)) sel.value = avant;
}

function trierEtFiltrer(liste) {
  const q = ($("#chercheMedia").value || "").trim().toLowerCase();
  const moteur = $("#moteurMedia").value;
  const machine = $("#machineMedia").value;
  const qui = $("#quiMedia").value;
  // Trente pieces plus tard, « lesquelles sont finies ? » est la premiere
  // question qu'on se pose devant une mediatheque ou l'on a beaucoup essaye.
  const soin = $("#soinMedia").value;
  const tri = $("#triMedia").value;

  const gardees = liste.filter(f =>
    (!moteur || f.moteur === moteur)
    && (!machine || f.noeud === machine)
    && (!qui || f.a === qui)
    && (!soin || (soin === "brouillons" ? !!f.esquisse : !f.esquisse))
    // La recherche porte sur ce que l'utilisateur a ECRIT, sur ce qui a ete
    // ENVOYE au moteur, et sur le nom du fichier : les trois façons dont on se
    // souvient d'une image qu'on a produite il y a trois semaines.
    && (!q || [(f.demande || ""), (f.prompt || ""), (f.filename || "")]
                .some(x => x.toLowerCase().includes(q))));

  const dec = tri.startsWith("-");
  const cle = dec ? tri.slice(1) : tri;
  return gardees.sort((a, b) => {
    const x = a[cle] ?? "", y = b[cle] ?? "";
    const c = typeof x === "number" && typeof y === "number"
      ? x - y : String(x).localeCompare(String(y), "fr");
    // A egalite, du plus recent au plus ancien : c'est l'ordre qu'on attend
    // quand on trie par moteur ou par proprietaire.
    return (dec ? -c : c) || (b.quand || 0) - (a.quand || 0);
  });
}

function peindreGrille() {
  const g = document.querySelector("#grilleMedia");
  g.innerHTML = "";
  // Une vue qui n'est pas la sienne doit se dire. Sans cela, un administrateur
  // croit regarder sa propre production et tombe sur celle d'un autre.
  const banniere = document.querySelector("#toutLeStudio");
  if (banniere)
    banniere.textContent = mediaCharge.tout
      ? "vue administrateur — tout ce que ce studio a produit" : "";
  const dansLaFamille = (mediaCharge.fichiers || [])
    .filter(f => f.famille === familleVue);
  const liste = trierEtFiltrer(dansLaFamille);
  const compteur = $("#combienMedia");
  if (compteur)
    compteur.textContent = liste.length === dansLaFamille.length
      ? `${liste.length} pièce${liste.length > 1 ? "s" : ""}`
      : `${liste.length} sur ${dansLaFamille.length}`;
  if (!liste.length) {
    g.innerHTML = '<p class="vide-media">rien de ce type pour l\'instant</p>';
    return;
  }
  for (const f of liste) {
    const carte = document.createElement("figure");
    carte.className = "media";
    let el;
    if (f.famille === "video") { el = document.createElement("video"); el.controls = true; }
    else if (f.famille === "audio") { el = document.createElement("audio"); el.controls = true; }
    else if (f.famille === "image") { el = document.createElement("img"); el.loading = "lazy"; el.alt = f.demande; }
    else { el = document.createElement("div"); el.className = "cube"; el.textContent = "▣"; }
    if (el.tagName !== "DIV") el.src = url(f);
    if (el.tagName === "IMG") { el.style.cursor = "zoom-in"; el.onclick = () => plein(f); }
    // Un brouillon garde la taille et le cadrage d'une image finie : rien ne les
    // separe a l'oeil. La marque va sur ce qui se regarde — la vignette — et
    // seulement a defaut dans la legende, pour un son qu'on n'a pas a masquer.
    //
    // La variante RETENUE porte la sienne pour la meme raison, et a l'oppose :
    // une esquisse peut etre la variante choisie, les deux marques doivent
    // tenir cote a cote sans se recouvrir.
    const marques = [];
    if (f.esquisse) marques.push(["marque-esquisse", "brouillon"]);
    if (f.choisie) marques.push(["marque-retenue", "✓ retenue"]);
    const vignette = marques.length
                  && (f.famille === "image" || f.famille === "video");
    if (vignette) {
      const cadre = document.createElement("div");
      cadre.className = "cadre-media";
      cadre.appendChild(el);
      for (const [classe, mot] of marques) {
        const marque = document.createElement("span");
        marque.className = classe;
        marque.textContent = mot;
        cadre.appendChild(marque);
      }
      carte.appendChild(cadre);
    } else carte.appendChild(el);

    const legende = document.createElement("figcaption");
    const quand = f.quand
      ? new Date(f.quand * 1000).toLocaleString("fr-FR",
          { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })
      : (f.heure || "");
    // « f.a » n'arrive qu'a un administrateur : le serveur ne le sert a
    // personne d'autre. Le nom du proprietaire est mis en avant, pour qu'on ne
    // confonde jamais la piece de quelqu'un d'autre avec la sienne.
    legende.innerHTML = `<span>${ech(f.demande || f.filename)}</span>`
                      + `<small>${f.a ? "<b>" + ech(f.a) + "</b> · " : ""}`
                      + `${f.esquisse && !vignette ? "brouillon · " : ""}`
                      + `${f.choisie && !vignette ? "retenue · " : ""}`
                      // QUEL TIRAGE, SUR COMBIEN. Le serveur sert « variante »
                      // et « variantes » depuis le debut, et la legende les
                      // jetait : quatre variantes ont le meme prompt, le meme
                      // moteur, la meme taille et la meme minute — sans ce
                      // rang, la grille en montre quatre lignes rigoureusement
                      // indiscernables. « variante » n'arrive que si le groupe
                      // en compte plus d'une, c'est le serveur qui le filtre.
                      + `${f.variante ? "variante " + ech(f.variante) + " sur "
                                      + ech(f.variantes) + " · " : ""}`
                      + `${ech(f.moteur || "")}`
                      // La taille et le temps : « pourquoi celle-ci a mis
                      // quatre minutes » se repond neuf fois sur dix par la
                      // resolution, et rien ne la montrait nulle part.
                      + `${f.taille ? " · " + ech(f.taille.replace("x", " × ")) : ""}`
                      + `${f.secondes ? " · " + Math.round(f.secondes) + " s" : ""}`
                      + ` · ${ech(quand)}</small>`;
    // Replie : le prompt envoye fait souvent dix lignes, et on ne le cherche
    // que lorsqu'un rendu surprend. Deplie, il repond a « pourquoi cette
    // image-la ».
    if (f.prompt && f.prompt !== f.demande)
      legende.innerHTML += `<details><summary>prompt envoyé</summary>`
                         + `<span class="envoye">${ech(f.prompt)}</span></details>`;
    carte.appendChild(legende);

    const actions = document.createElement("div");
    actions.className = "actions-sortie";
    const tele = document.createElement("a");
    tele.href = url(f); tele.download = f.filename; tele.textContent = "télécharger";
    actions.appendChild(tele);
    if (f.famille === "image" || f.famille === "video") {
      const gros = document.createElement("button");
      gros.type = "button"; gros.textContent = "plein écran";
      gros.onclick = () => plein(f);
      actions.appendChild(gros);
    }
    if (f.famille !== "objet3d") {
      const rep = document.createElement("button");
      rep.type = "button"; rep.textContent = "reprendre";
      rep.title = "joindre ce fichier pour le retravailler";
      rep.onclick = async () => {
        rep.disabled = true;
        try {
          const r = await fetch("/api/reprendre", {
            method: "POST", credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ filename: f.filename,
                                   subfolder: f.subfolder || "", noeud: f.noeud }) });
          const d = await r.json().catch(() => ({}));
          if (!r.ok || !d.image) throw new Error(d.erreur || "reprise impossible");
          imageJointe = d.image;
          $("#nomimg").textContent = f.filename;
          // La vignette avec : une piece jointe sans apercu ne dit pas laquelle
          // on vient de reprendre, et on en reprend souvent plusieurs de suite.
          const zone = $("#apercu-zone");
          zone.innerHTML = "";
          if (f.famille === "image") {
            const i = document.createElement("img");
            i.src = url(f); i.alt = f.filename; zone.appendChild(i);
          } else if (f.famille === "video") {
            const v = document.createElement("video");
            v.src = url(f); v.muted = true; zone.appendChild(v);
          } else {
            zone.innerHTML = '<span class="genre">♪</span>';
          }
          $("#jointe").style.display = "";
          fermerMediatheque();
          $("#txt").focus();
        } catch (err) { $("#alerte").textContent = err.message; }
        finally { rep.disabled = false; }
      };
      actions.appendChild(rep);
    }
    carte.appendChild(actions);
    g.appendChild(carte);
  }
}

function fermerMediatheque() {
  document.querySelector("#mediatheque").hidden = true;
}

document.querySelector("#ouvrirMedia").onclick = () => {

document.querySelector("#fermerMedia").onclick = fermerMediatheque;
document.addEventListener("keydown", e => {

  // celle du dessus, pas les deux d'un coup.
  if (e.key === "Escape" && !document.querySelector(".plein")
      && !document.querySelector("#mediatheque").hidden)

/* ── la file, au survol et au clic ─────────────────────────────────────
   Le compteur disait « 3 demandes » sans dire lesquelles : impossible de
   savoir si l'attente venait d'une video de six minutes lancee par erreur, et
   impossible de la retirer. */
let fileOuverte = false, minuteurFile = null;

function fermerFile() {
  fileOuverte = false;
  document.querySelector("#panneauFile").classList.remove("ouvert");
  if (minuteurFile) { clearInterval(minuteurFile); minuteurFile = null; }
}

async function peindreFile() {
  const p = document.querySelector("#panneauFile");
  let d;
  try {
    d = await (await fetch("/api/file", { credentials: "same-origin" })).json();
  } catch (e) { return; }
  const lignes = d.lignes || [];
  if (!lignes.length) {
    p.innerHTML = "<h4>file d'attente</h4>"
                + '<div class="tache"><span class="quoi">rien en cours</span></div>';
    return;
  }
  p.innerHTML = "<h4>file d'attente"
    + (d.admin ? " — vue administrateur" : "") + "</h4>";
  for (const t of lignes) {
    const el = document.createElement("div");
    el.className = "tache" + (t.a_moi ? "" : " autrui");
    /* Une demande armée n'a pas de rang : elle n'attend pas son tour, elle
       attend son propriétaire. Le « 0 » que servait l'API laissait croire
       qu'elle était première, donc imminente. */
    const rang = t.en_cours ? "▶" : (t.armee ? "⏸" : t.rang);
    const etats = { "en cours": ["cours", "en cours"], fini: ["fini", "terminé"],
                    erreur: ["rate", "échec"], question: ["attente", "en attente de précision"],
                    // Analysée, sa machine est choisie, et cette machine
                    // travaille pour quelqu'un d'autre. Ni file, ni calcul.
                    "attente carte": ["attente", "attend une carte"],
                    // Armée : ni dans la file, ni sur une carte. Elle attend
                    // qu'une machine en pause revienne, et repartira seule.
                    // Sans cette entrée elle s'affichait « en attente », comme
                    // celles qui partent dans deux minutes.
                    "attente machine": ["attente", "attend une machine en pause"] };
    // Une demande porte l'etat « en cours » des sa creation : c'est l'etat de
    // la TACHE, pas sa place dans la file. Seule la ligne marquee en_cours
    // occupe vraiment la carte ; les autres attendaient en affichant
    // « en cours », ce qui rendait la file illisible.
    const [classe, mot] = (!t.en_cours && t.etat === "en cours")
      ? ["attente", "en attente"]
      : (etats[t.etat] || ["attente", "en attente"]);
    // Le pourcentage vient de ComfyUI ; sans lui on montre l'etat seul.
    const pct = t.avance && t.avance.total
      ? Math.round(t.avance.fait * 100 / t.avance.total) : null;
    el.innerHTML = `<span class="rang">${rang}</span>
      <span class="quoi">${ech(t.demande)}
        <small>${ech(t.type)}${t.qui ? " · " + ech(t.qui) : ""}</small>
        <span class="etat-tache ${classe}">${mot}`
      + (pct !== null ? ` — ${pct} %` : "")
      /* Le temps qu'il reste à une demande armée. Sans lui, « attend une
         machine en pause » ne dit pas si l'on parle de dix minutes ou de douze
         heures — donc pas si l'on peut aller se coucher. */
      + (t.armee && t.reste_h > 0
          ? ` — encore ${t.reste_h < 1.5 ? Math.round(t.reste_h * 60) + " min"
                                         : Math.round(t.reste_h) + " h"}` : "")
      + (t.ou ? " · " + ech(t.ou) : "") + `</span>`
      + (pct !== null
          ? `<span class="avance"><i style="width:${pct}%"></i></span>` : "")
      + `</span>`;
    if (t.annulable) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = t.en_cours ? "interrompre" : "retirer";
      b.onclick = async ev => {
        ev.stopPropagation();
        b.disabled = true;
        await fetch("/api/file/" + encodeURIComponent(t.tid),
                    { method: "DELETE", credentials: "same-origin" });
        peindreFile();
      };
      el.appendChild(b);
    }
    p.appendChild(el);
  }
}

function ouvrirFile() {
  if (fileOuverte) return;
  fileOuverte = true;
  document.querySelector("#panneauFile").classList.add("ouvert");
  peindreFile();
  // Rafraichi tant qu'il est ouvert : une file qui avance sous les yeux est la
  // seule facon de voir qu'elle avance.
  minuteurFile = setInterval(peindreFile, 3000);
}

document.addEventListener("click", e => {
  const compteur = e.target.closest("#etatFile");
  const dedans = e.target.closest("#panneauFile");
  if (compteur) { fileOuverte ? fermerFile() : ouvrirFile(); return; }
  if (!dedans && fileOuverte) fermerFile();
});
document.querySelector("#etatFile").addEventListener("mouseenter", ouvrirFile);
document.querySelector("#panneauFile").addEventListener("mouseleave", e => {
  // On ne referme au survol que si l'on n'a pas ouvert au clic : sur une
  // tablette, un doigt qui frole refermerait le panneau qu'on vient d'ouvrir.
  if (e.buttons === 0 && window.matchMedia("(hover: hover)").matches) fermerFile();
});

/* Les reglages restent replies, mais jamais silencieux : ce qui s'ecarte du
   defaut s'affiche en clair, et se retire d'un clic. Un reglage applique sans
   etre visible donne le sentiment de ne pas etre ecoute. */
const REGLAGES = [
  { sel: "#forcer", nom: "moteur", lire: o => o.textContent },
  { sel: "#machine", nom: "machine", lire: o => o.textContent.split(" — ")[0] },
  { sel: "#priorite", nom: "", lire: o => o.textContent.split(" — ")[0] },
  { sel: "#taille", nom: "", lire: o => o.textContent.split(" — ")[0] },
  // « geste » : ce menu-ci ne s'ecrit PAS sur la conversation. Il n'a ni entree
  // dans MENU_REGLAGE ni dans CLE_REGLAGE — les envoyer a
  // /api/conversation/{cid}/reglages serait poster une cle que le serveur ne
  // lit pas, et le murmure promis ne viendrait jamais. Il est ici pour une
  // seule raison : la pastille. Sans elle, « 4 variantes » ne se verrait que
  // le tiroir ouvert, et le tiroir est replie par defaut — on repartirait en
  // quatre exemplaires sans rien voir venir, ce qui est exactement le degat
  // que le serveur refuse de retenir sur la conversation.
  { sel: "#variantes", nom: "", geste: true,
    lire: o => o.textContent.split(" — ")[0] },
];

function peindreActifs() {
  const zone = document.querySelector("#actifs");
  zone.innerHTML = "";
  for (const r of REGLAGES) {
    const el = document.querySelector(r.sel);
    if (!el || !el.value) continue;
    const mot = document.createElement("span");
    mot.className = "oter";
    mot.textContent = (r.nom ? r.nom + " " : "") + r.lire(el.selectedOptions[0]);
    mot.title = "cliquer pour revenir à l'automatique";
    mot.onclick = () => { el.value = ""; accorderTaille(); peindreActifs();
                          if (!r.geste) retenirReglages(CLE_REGLAGE[r.sel]); };
    zone.appendChild(mot);
  }
}
/* Choisir dans un menu, c'est deja decider : le reglage part tout de suite sur
   la conversation, sans attendre qu'une demande soit envoyee. Sans cette route,
   on ouvrait le tiroir, on prenait FLUX.1 en 1920x1080, on passait voir une
   autre conversation, et le choix n'existait plus au retour. */
/* La valeur d'un reglage, lue dans SON menu. Elle etait tiree de
   reglagesDemandes(), qui ne porte plus les reglages depuis qu'ils vivent sur
   la conversation : « modele », « taille » et « noeud » y valaient donc
   « undefined », JSON.stringify les supprimait, le serveur recevait un corps
   vide — rien n'etait retenu et rien n'etait murmure. Seule la priorite
   survivait, parce qu'elle etait ajoutee a part. Constate par l'utilisateur :
   « il n'y a que priorite soigne qui est apparu dans le chat ».

   Et reglagesDemandes() remet « moteurChoisi » a faux au passage : chaque
   changement de menu CONSOMMAIT donc le drapeau avant que la demande puisse
   s'en servir. Un effet de bord n'a rien a faire dans une lecture. */
const MENU_REGLAGE = { modele: "#forcer", noeud: "#machine",
                       priorite: "#priorite", taille: "#taille" };

function valeurReglage(cle) {
  const el = $(MENU_REGLAGE[cle]);
  if (!el) return null;
  return el.value || null;
}

function retenirReglages(cle) {
  if (!convActive) return;
  // SEULEMENT LA CLE QUI VIENT DE CHANGER. Envoyer les quatre a chaque geste
  // faisait deux degats : un second onglet reste ouvert sur la meme
  // conversation effaçait le moteur regle depuis le premier — le serveur
  // raisonne sur la PRESENCE, et une cle presente et vide efface — et il
  // ecrivait un murmure « moteur : automatique » que personne n'avait demande.
  const corps = cle
    ? { [cle]: valeurReglage(cle) }
    : Object.fromEntries(Object.keys(MENU_REGLAGE).map(k => [k, valeurReglage(k)]));
  reglagesVoulus = { ...reglagesVoulus, ...corps };
  const ou = convActive;
  reglageEnVol = fetch("/api/conversation/" + ou + "/reglages", {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(corps)
  }).then(r => r.json()).then(d => {
    // Seulement si l'on est encore dans la meme conversation : le murmure
    // appartient a celle qu'on reglait, pas a celle qu'on regarde.
    if (d && d.murmure && ou === convActive) { ajouterMurmure(d.murmure); auBas(); }
  }).catch(() => {});   // du confort : la demande les reporte de toute facon
}

const CLE_REGLAGE = { "#forcer": "modele", "#machine": "noeud",
                      "#priorite": "priorite", "#taille": "taille" };
REGLAGES.forEach(r => {
  const el = document.querySelector(r.sel);
  if (el) el.addEventListener("change", () => {
    if (r.sel === "#forcer") moteurChoisi = true;
    peindreActifs();
    // Un geste ne s'ecrit pas sur la conversation : CLE_REGLAGE[r.sel] vaudrait
    // « undefined », et retenirReglages(undefined) renvoie les QUATRE reglages
    // d'un coup — c'est-a-dire le degat que la table a ete decoupee pour
    // eviter, declenche par un menu qui n'a rien a voir.
    if (!r.geste) retenirReglages(CLE_REGLAGE[r.sel]);
  });
});
document.querySelector("#plier").onclick = e => {
  const outils = document.querySelector("#outils");
  const ouvert = outils.classList.toggle("replie") === false;
  e.target.classList.toggle("ouvert", ouvert);
  e.target.setAttribute("aria-expanded", String(ouvert));
};
/* La taille ne s'applique qu'aux images : la laisser active pour un moteur
   audio ou vidéo ferait croire que la consigne est prise en compte. */
const SANS_TAILLE = ["wan5b", "wan14b", "audio", "audioplus", "edition", "objet3d"];
function accorderTaille() {
  const m = $("#forcer").value;
  const inerte = SANS_TAILLE.includes(m);
  $("#taille").disabled = inerte;
  $("#taille").title = inerte
    ? "sans effet sur ce moteur : la taille vient de la source ou du format"
    : "";
}
$("#forcer").addEventListener("change", accorderTaille);
accorderTaille();

peindreActifs();

/* Le champ grandit en tapant. La fonction existait, mais plus rien ne
   l'appelait a la frappe : elle ne jouait qu'a l'ouverture d'une conversation,
   et le champ restait sur une ligne quelle que soit la longueur du texte. */
$("#txt").addEventListener("input", ajuster);
ajuster();

/* Le compteur de l'en-tete, et le releve des demandes armees qui va avec.
   Appele tout de suite ET toutes les 2,5 s : la premiere passe attendait le
   premier tour de minuteur, si bien qu'une page rechargee sur une demande armee
   la montrait « en cours », chronometre qui monte, pendant deux secondes et
   demie — juste assez pour la lire et la croire. */
async function releverFile() {
  try {
    const f = await (await fetch("/api/file")).json();
    // « occupe ? 1 : 0 » etait juste du temps ou un seul travail pouvait
    // courir. Depuis qu'il y en a plusieurs, le compteur annonçait « 1 en file »
    // pendant que le panneau en montrait trois.
    const n = (f.en_attente || 0) + (f.en_vol || 0);
    const moi = f.a_moi || 0;
    // Les demandes armees ne sont NI dans la file NI sur une carte : elles
    // attendent le retour d'une machine en pause, pendant des heures. Le
    // compteur les ignorait, donc il restait vide — et comme c'est lui qui
    // ouvre le panneau, et le panneau qui porte le bouton « retirer », une
    // demande armee toute seule etait invisible ET irretirable jusqu'au
    // lendemain. Le serveur sert « armees » exactement pour cette ligne.
    const dort = f.armees || 0;
    // Le ⏸ plutot qu'une phrase : c'est le signe que la meme demande porte deja
    // a la place de son rang dans le panneau, et l'en-tete tient sur une ligne
    // de telephone.
    const bouts = [];
    if (n) bouts.push(`${n} en file`);
    if (dort) bouts.push(`⏸ ${dort}`);
    if (moi && moi < n + dort) bouts.push(`${moi} à toi`);
    const etat = $("#etatFile");
    etat.innerHTML = bouts.length
      ? `<span class="file-vive">${bouts.join(" · ")}</span>` : "";
    etat.title = dort
      ? `${dort} demande(s) attendent le retour d'une machine en pause et `
        + `repartiront toutes seules. Ouvrir la file pour les retirer.`
      : "";
    // Releve au passage : la bulle de la conversation s'en sert pour ne pas
    // faire courir un chronometre sur une demande qui ne calcule pas.
    armees.clear();
    for (const l of f.lignes || []) if (l.armee) armees.set(l.tid, l.reste_h || 0);
  } catch (e) { /* sans effet */ }
}
releverFile();
setInterval(releverFile, 2500);

/* ── tiroir des conversations sur petit ecran ──────────────────────
   La barre laterale etait simplement masquee sous 820 px : sur telephone,
   ni la liste des conversations, ni le bouton d'en creer une, ni l'etat du
   moteur n'etaient atteignables. */
const basculerTiroir = ouvrir =>
  document.body.classList.toggle("ouvert",
    ouvrir === undefined ? !document.body.classList.contains("ouvert") : ouvrir);
$("#tiroir").onclick = () => basculerTiroir();
$("#voile").onclick = () => basculerTiroir(false);

$("#img").onchange = async e => {
  const f = e.target.files[0];
  if (!f) return;
  $("#alerte").textContent = "";
  try {
    const fd = new FormData(); fd.append("f", f);
    const r = await fetch("/api/televerser", { method: "POST", body: fd });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.image) throw new Error(d.erreur || "échec du téléversement");
    imageJointe = d.image;
    if (apercuURL) URL.revokeObjectURL(apercuURL);
    apercuURL = URL.createObjectURL(f);
    // Une video dans une balise <img> ne montre rien : chaque famille a son
    // apercu, et un signe suffit pour un son qu'on ne regarde pas.
    const zone = $("#apercu-zone");
    zone.innerHTML = "";
    if (EXT_VID.test(f.name)) {
      const v = document.createElement("video");
      v.src = apercuURL; v.muted = true; zone.appendChild(v);
    } else if (EXT_SON.test(f.name)) {
      zone.innerHTML = '<span class="genre">\u266A</span>';
    } else {
      const i = document.createElement("img");
      i.src = apercuURL; i.alt = "aperçu du fichier joint"; zone.appendChild(i);
    }
    $("#nomimg").textContent = f.name;
    $("#jointe").style.display = "flex";
  } catch (err) { detacher(); $("#alerte").textContent = "Fichier non joint : " + err.message; }
};
function detacher() {
  imageJointe = null;
  if (apercuURL) { URL.revokeObjectURL(apercuURL); apercuURL = null; }
  $("#apercu-zone").innerHTML = "";
  $("#jointe").style.display = "none";
  $("#img").value = "";
}
$("#retirer").onclick = detacher;

/* Un seul chemin d'envoi pour la fleche et pour « brouillon » : seule la
   priorite change. Deux copies auraient diverge des la premiere correction —
   c'est deja arrive avec la reponse a une precision, qui a longtemps oublie la
   taille choisie. */
/* Ce qu'une demande emporte, ecrit UNE fois.

   Le formulaire de reponse a une precision n'envoyait que la taille et la
   priorite : le moteur impose et la machine choisie disparaissaient des qu'on
   repondait a une question. Deux chemins d'envoi, deux listes de champs, et la
   seconde avait oublie la moitie de la premiere. Il n'y en a plus qu'une.

   Le serveur les retient sur la conversation : une demande qui tait un reglage
   herite du sien. Envoyer les quatre a chaque fois reste le bon geste — c'est
   ce que l'utilisateur a sous les yeux qui fait foi. */
function reglagesDemandes() {
  // PLUS LES REGLAGES. Ils vivent sur la conversation, et le menu les y pose
  // des qu'il change. Les repeter dans la demande refaisait le degat qu'on
  // croyait avoir ferme : le serveur raisonne sur la PRESENCE, donc un second
  // onglet reste ouvert avec ses menus d'avant effaçait le moteur du premier —
  // simplement au moment d'envoyer un message au lieu de bouger un menu. Ne
  // part ici que ce qui appartient a CETTE demande.
  const c = { modele_choisi: moteurChoisi };
  moteurChoisi = false;
  // LE NOMBRE DE VARIANTES PART ICI, avec les deux chemins d'envoi a la fois.
  // Le menu ne le pose pas sur la conversation — le serveur ne le retient pas —
  // donc s'il ne partait pas dans le corps, il ne partirait nulle part.
  // Absent quand le menu est sur « une seule » : le serveur traite le champ
  // absent, la chaine vide et zero comme « une seule » sans message, mais un
  // corps qui ne dit rien est ce qu'envoie une demande ordinaire, et c'est ce
  // qu'on veut envoyer.
  const n = parseInt($("#variantes").value, 10);
  if (n > 1) c.variantes = n;
  return c;
}

/* Remet les menus dans l'etat de la conversation ouverte. Une conversation
   travaille en FLUX.1 1920x1080, une autre en RealVis 1024x720 : les menus
   etaient a la fenetre, donc partages par toutes, et changer de conversation
   emportait le reglage de la precedente. */
let reglagesVoulus = {};
// Le moteur a-t-il ete choisi POUR LA PROCHAINE DEMANDE ? Seule la page le
// sait : le menu poste son reglage des qu'il change, donc au moment de
// l'envoi la conversation porte deja la valeur et le serveur ne peut plus
// distinguer « choisi » de « herite ». Pose au changement, efface a l'envoi.
let moteurChoisi = false;
// La derniere ecriture de reglage en vol. La demande l'attend : sans cela une
// demande envoyee dans la foulee d'un changement de menu partait avec l'ancien
// reglage de la conversation.
let reglageEnVol = null;
function poserReglages(r) {
  reglagesVoulus = r || {};
  const mettre = (sel, val) => {
    const el = $(sel);
    if (!el) return;
    const v = val || "";
    // Le menu des moteurs se remplit apres coup : tant que l'option n'existe
    // pas, on ne pose rien plutot que d'ecraser par du vide — poserReglages est
    // rappele quand la liste arrive.
    if (!v || [...el.options].some(o => o.value === v)) el.value = v;
  };
  mettre("#forcer", reglagesVoulus.modele);
  // PLUS DE REPLI SUR LE NAVIGATEUR. Une machine memorisee dans le
  // localStorage remontait dans les menus, puis dans le corps de la demande, et
  // la conversation se voyait epingler une machine que personne n'avait choisie
  // pour elle — avec un murmure « machine : PC » comme si c'etait une decision,
  // et un echec le jour ou cette machine est eteinte. Depuis que les reglages
  // appartiennent a la conversation, une conversation neuve part sur
  // « automatique », et c'est la reponse la moins surprenante.
  mettre("#machine", reglagesVoulus.noeud);
  mettre("#priorite", reglagesVoulus.priorite);
  mettre("#taille", reglagesVoulus.taille);
  // accorderTaille() est cable sur l'evenement « change » du menu des moteurs,
  // et poser .value par programme ne le declenche pas. Sans cet appel, une
  // conversation quittee sur « Wan 5B » — qui grise les tailles — laissait le
  // menu des tailles grise dans la conversation SUIVANTE, dont le moteur est
  // pourtant « automatique ». Il fallait changer de moteur et revenir pour le
  // debloquer.
  if (typeof accorderTaille === "function") accorderTaille();
  if (typeof peindreActifs === "function") peindreActifs();
}

async function lancerDemande(priorite) {
  const texte = $("#txt").value.trim();
  if (!texte && !imageJointe) return;
  $("#alerte").textContent = "";
  const monConv = convActive;
  ajouterDemande(texte);
  const bloc = ajouterReponse();
  auBas();
  $("#txt").value = ""; ajuster();
  try {
    // Le reglage qu'on vient de changer doit etre arrive avant la demande,
    // sinon elle part avec celui d'avant.
    if (reglageEnVol) { try { await reglageEnVol; } catch (e) {} }
    const r = await fetch("/api/generer", {
      method: "POST", headers: { "Content-Type": "application/json" },
      // « priorite » N'EST PAS un reglage de la demande : il vit sur la
      // conversation comme les trois autres, et le menu l'y pose des qu'il
      // change. L'envoyer ici refaisait le degat qu'on croyait ferme pour
      // « modele », « taille » et « noeud » — le serveur raisonne sur la
      // PRESENCE, donc un second onglet reste ouvert avec ses menus d'avant
      // effaçait le cran du premier, simplement en envoyant un message. Il ne
      // part que quand il vaut pour CETTE demande, c'est-a-dire au brouillon.
      body: JSON.stringify({ texte, image: imageJointe,
                             ...(priorite ? { priorite } : {}),
                             ...reglagesDemandes(), conversation: monConv })
    });
    const d = await r.json().catch(() => ({}));
    if (!r.ok || !d.id) throw new Error(d.erreur || "le serveur a refusé la demande");
    if (priorite === "brouillon") esquissesLancees.add(d.id);
    detacher();
    // La conversation remonte tout de suite : le tour est deja enregistre cote
    // serveur, et attendre la fin du rendu laissait croire que rien n'etait
    // parti.
    listerConversations();
    suivre(d.id, bloc, monConv);
  } catch (err) {
    garnirReponse(bloc, { etat: "erreur", erreur: err.message, fichiers: [] });
    $("#alerte").textContent = err.message;
    auBas();
  }
}
// Rien a passer : le cran choisi dans le menu est deja sur la conversation.
$("#go").onclick = () => lancerDemande(null);
// Le brouillon l'emporte sur le cran de priorite choisi dans les reglages : on
// vient de le demander explicitement, c'est le geste le plus recent.
$("#lancerBrouillon").onclick = () => lancerDemande("brouillon");

/* LE DEVIS, releve dans le journal de la demande.

   Le studio l'annonce des qu'il a retenu une machine : « d'apres tes 6 rendus
   precedents, compte 4 min » (duree_typique, serveur.py — la mediane de rendus
   comparables, et rien du tout en dessous de trois mesures). Cette ligne
   n'apparaissait que dans le depliant « details », ferme — c'est-a-dire nulle
   part au moment ou la question se pose, devant la barre qui avance.

   Elle est relue dans le texte parce que /api/etat ne sert pas ce chiffre
   autrement : il n'y a pas de champ « devis », seulement des etapes. Le releve
   est donc muet des que la phrase ne correspond plus — une estimation devinee
   de travers vaut moins que pas d'estimation. */
const RE_DEVIS = /rendus\s+pr[eé]c[eé]dents,\s*compte\s+(\d+(?:[.,]\d+)?)\s*(min|s)\b/i;
function lireDevis(etapes) {
  // Depuis la fin : une demande relancee au reveil d'une machine peut porter
  // deux devis, et c'est le dernier qui parle du rendu en cours.
  for (let i = (etapes || []).length - 1; i >= 0; i--) {
    const m = RE_DEVIS.exec(etapes[i].msg || "");
    if (!m) continue;
    const combien = parseFloat(m[1].replace(",", "."));
    const sur = /tes\s+(\d+)\s+rendus/.exec(etapes[i].msg);
    return { secondes: combien * (m[2] === "min" ? 60 : 1),
             mot: `${m[1]} ${m[2]}`, mesures: sur ? sur[1] : "" };
  }
  return null;
}

/* Le seul recours sur une demande armee, pose la ou l'utilisateur regarde. Le
   panneau de file en a un depuis toujours, mais il faut l'ouvrir, et l'on n'y
   pense pas quand on attend devant sa bulle. */
function boutonRetirerArmee(id) {
  const b = document.createElement("button");
  b.type = "button";
  b.className = "retirer-armee";
  b.textContent = "retirer";
  b.title = "retirer cette demande de l'attente : elle ne repartira pas toute "
          + "seule au retour de la machine";
  b.onclick = async () => {
    b.disabled = true;
    try {
      await fetch("/api/file/" + encodeURIComponent(id),
                  { method: "DELETE", credentials: "same-origin" });
      // Rien a repeindre ici : le sondage voit l'etat « erreur » au tour
      // suivant et garnit la bulle avec « retiree de la file », bouton
      // « relancer » compris.
    } catch (e) { b.disabled = false; }
  };
  return b;
}

/* Le sondage est indexe par tache : plusieurs demandes peuvent courir
   en parallele, y compris dans des conversations differentes. */
function suivre(id, bloc, cid) {
  const depart = Date.now();
  // L'instant ou le devis est apparu, et non « depart » : entre les deux il y a
  // la file et l'analyse, qui ne sont pas comptees dans la mediane. Compare a
  // depart, un rendu parti quatrieme aurait ete declare « plus long que
  // d'habitude » avant meme d'avoir commence.
  let vuDevis = 0;
  const ancien = suivis.get(id);
  if (ancien) { clearInterval(ancien.minuteur); suivis.delete(id); }
  const minuteur = setInterval(async () => {
    try {
      const r = await fetch("/api/etat/" + id);
      if (!r.ok) throw new Error("tâche inconnue — le serveur a-t-il redémarré ?");
      const t = await r.json();
      if (!Array.isArray(t.etapes)) throw new Error("réponse inattendue du serveur");
      const visible = cid === convActive && document.body.contains(bloc);

      if (visible && t.etat === "en cours" && armees.has(id)) {
        // ARMEE : ni dans la file, ni sur une carte. Le chronometre et la
        // derniere ligne de journal n'ont plus rien a dire — ils diraient meme
        // le contraire de ce qui se passe. On repeint la pastille une seule
        // fois : le bouton « retirer » se trouverait sinon remplace toutes les
        // 1,2 s, et un clic tombe entre deux remplacements ne part jamais.
        const puces = bloc.querySelector(".bandeau-tech");
        let p = puces.querySelector(".puce.armee");
        if (!p) {
          puces.innerHTML = (esquissesLancees.has(id)
              ? '<span class="puce esquisse">brouillon</span>' : "")
            + '<span class="puce armee"></span>';
          p = puces.querySelector(".puce.armee");
          puces.appendChild(boutonRetirerArmee(id));
        }
        const h = armees.get(id) || 0;
        // « encore 11 h » : sans cela, « attend une machine » ne dit pas si
        // l'on parle de dix minutes ou d'une nuit — donc pas si l'on peut
        // aller se coucher. Meme formulation que dans le panneau de file.
        p.textContent = "⏸ attend le retour d'une machine en pause"
          + (h > 0 ? ` — repart toute seule, encore ${h < 1.5
              ? Math.round(h * 60) + " min" : Math.round(h) + " h"}` : "");
      } else if (visible && t.etat === "en cours") {
        const derniere = t.etapes[t.etapes.length - 1];
        const puces = bloc.querySelector(".bandeau-tech");
        // Le pourcentage existait deja — dans le panneau de file, qu'il faut
        // ouvrir. Ici, la bulle n'affichait que la derniere ligne de journal :
        // « travail confie a NAS ZimaOS — en attente de sa reponse », figee 150
        // des 157 secondes d'un rendu mesure. On voyait un studio en panne.
        //
        // Les secondes ecoulees s'affichent MEME sans pourcentage : les 27
        // premieres secondes n'en ont pas, et un ecran ou rien ne bouge est
        // exactement ce qui fait recharger la page au milieu d'un rendu.
        const pct = t.avance && t.avance.total
          ? Math.round(t.avance.fait * 100 / t.avance.total) : null;
        // LE COMPTE VIENT DU SERVEUR. « Date.now() - depart » comptait depuis
        // l'instant ou CETTE page s'etait mise a suivre : un rechargement
        // remettait le compteur a zero, et « 89 % · 6 s » s'affichait sur un
        // rendu qui durait depuis une minute. Le repli local ne sert qu'aux
        // vieilles reponses, qui ne portent pas encore le champ.
        const secondes = t.ecoule != null ? Math.round(t.ecoule)
                                          : Math.round((Date.now() - depart) / 1000);
        // « Combien de temps ? » est la question qu'on se pose EN REGARDANT la
        // barre : la reponse se met a cote, pas dans le depliant.
        const devis = lireDevis(t.etapes);
        if (devis && !vuDevis) vuDevis = Date.now();
        // « Depasse » se compare au temps du RENDU, et non au temps total : le
        // devis est une mediane de rendus, pas d'attentes. Comparer au total
        // faisait rougir la pastille des la premiere image de la barre pour une
        // demande qui avait patiente dans la file — et une demande armee onze
        // heures se reveillait avec le devis rouge d'emblee.
        const ecoule_rendu = t.ecoule_rendu != null ? t.ecoule_rendu : secondes;
        const depasse = devis && ecoule_rendu > devis.secondes;
        // Deux rendus peuvent courir de front ; savoir lequel est l'esquisse dit
        // lequel va revenir dans une minute et lequel dans quatre.
        puces.innerHTML = (esquissesLancees.has(id)
            ? '<span class="puce esquisse">brouillon</span>' : "")
          + (t.position
              ? `<span class="puce attente">en file — ${t.position} devant</span>`
              : `<span class="puce cours">${ech((derniere ? derniere.msg : "…").slice(0, 64))}`
                + `${pct === null ? "" : ` · ${pct} %`} · ${secondes} s</span>`
                + (devis
                   ? `<span class="puce devis${depasse ? " depasse" : ""}" title="${
                        ech(devis.mesures ? `mediane de tes ${devis.mesures} rendus`
                              + ` comparables : ${devis.mot}. Une indication, pas`
                              + ` une promesse.`
                            : `d'apres tes rendus precedents : ${devis.mot}`)
                      }">${depasse ? "plus long que d’habitude"
                                   : "≈ " + ech(devis.mot)}</span>` : "")
                + (pct === null ? ""
                   : `<span class="avance"><i style="width:${pct}%"></i></span>`));
      }
      if (t.etat === "question") {
        clearInterval(minuteur); suivis.delete(id);
        if (visible) { garnirQuestion(bloc, t, cid); auBas(); }
        listerConversations();
        return;
      }
      if (t.etat === "fini" || t.etat === "erreur") {
        clearInterval(minuteur); suivis.delete(id);
        const derniere = t.etapes[t.etapes.length - 1];
        if (t.etat === "erreur" && derniere) t.erreur = derniere.msg;
        if (visible) { garnirReponse(bloc, t); auBas(); }
        listerConversations();
        // Le compte d'appels distants n'avance qu'ici : une demande finie est le
        // seul moment ou « nuage 118/120 » peut etre devenu faux. Sans ce
        // rappel, la mention et les interrupteurs restaient sur l'etat du
        // chargement de la page, et l'on retombait sur le bouton qui « ne fait
        // rien » — cette fois avec une mention qui affirme qu'il reste de la
        // marge.
        peindreNuages();
        // Une machine a agent confirme l'arret de sa carte une a deux secondes
        // plus tard, par une ligne de journal de plus. Le sondage s'arrete
        // juste au-dessus et ne la verrait jamais : la bulle resterait sur
        // « arret demande », c'est-a-dire sur une promesse. Le 29 aout, c'est
        // exactement ce mecanisme qui a fait lire « interrompue » a
        // l'utilisateur pendant que le NAS calculait encore.
        if (t.etat === "erreur" && /^arret demande a /.test(t.erreur || ""))
          setTimeout(async () => {
            try {
              const r2 = await fetch("/api/etat/" + id);
              if (!r2.ok) return;
              const t2 = await r2.json();
              const suite = (t2.etapes || [])[(t2.etapes || []).length - 1];
              if (!suite || suite.msg === t.erreur) return;
              t2.erreur = suite.msg;
              if (cid === convActive && document.body.contains(bloc))
                garnirReponse(bloc, t2, cid);
            } catch (e) { /* la bulle garde la promesse : elle etait vraie */ }
          }, 8000);
      }
    } catch (err) {
      clearInterval(minuteur); suivis.delete(id);
      if (document.body.contains(bloc))
        garnirReponse(bloc, { etat: "erreur", erreur: err.message, fichiers: [] });
    }
  }, 1200);
  suivis.set(id, { bloc, minuteur });
}
</script>
