    if (!INTENTIONS.length) {
      try { INTENTIONS = await (await fetch("/api/intentions")).json(); }
      catch (e) { INTENTIONS = []; }
    }
    if (!Array.isArray(INTENTIONS) || !INTENTIONS.length) return;
    const q = document.createElement("div");
    q.className = "avis-quoi";
    // L'espace insecable d'avant « : » est DANS LA DONNEE, et non recolle
    // ici : le francais en met un, l'anglais aucun.
    q.innerHTML = `<span>${ech(T("page.avis.plutot"))}</span>`;
    for (const i of INTENTIONS) {
      if (i.cle === t.type) continue;   // pas la peine de proposer ce qu'il a fait
      const b = document.createElement("button");
      b.type = "button"; b.textContent = i.titre;
      b.onclick = () => { corrige = i.cle; envoyer(-1, champ.value.trim());
                          q.replaceChildren(Object.assign(
                              document.createElement("span"),
                              { className: "fait",
                                textContent: T("page.avis.note_intention",
                                               { titre: i.titre }) })); };
      q.appendChild(b);
    }
    zone.appendChild(q);
  };
  return zone;
}

}

/* Le studio demande une precision. La reponse relance TOUT l'aiguillage :
   elle peut changer la nature du travail, pas seulement l'affiner. */
function garnirQuestion(bloc, t, cid) {
  bloc.classList.remove("rate");
  bloc.querySelector(".bandeau-tech").innerHTML =
    `<span class="puce cours">${ech(T("page.etat.question"))}</span>`;
  const sortie = bloc.querySelector(".sortie");
  sortie.innerHTML = "";
  const q = document.createElement("div");
  q.className = "question";
  q.innerHTML = `<p>${ech(T("page.question.titre"))}</p>
    <ul>${(t.questions || []).map(x => `<li>${ech(x)}</li>`).join("")}</ul>
    <div class="repondre">
      <input type="text" placeholder="${ech(T("page.question.champ"))}"
             aria-label="${ech(T("page.question.aria"))}">
      <button>${ech(T("page.question.bouton"))}</button>
    </div>`;
  sortie.appendChild(q);
  const champ = q.querySelector("input"), bouton = q.querySelector("button");
  const envoyer = async () => {
    const rep = champ.value.trim();
    if (!rep) return;
    bouton.disabled = true; champ.disabled = true;
    // « Précisions » RESTE FRANCAIS, ET CE N'EST PAS UN OUBLI : cette
    // chaine-ci n'est pas affichee, elle est ENVOYEE — c'est le texte de la
    // demande, celui que l'aiguilleur classe et que le modele de langage
    // enrichit. Le studio a un pivot, et c'est le francais
    // (docs/plusieurs-langues.md, « ce qu'il envoie au moteur ») : traduire
    // ce mot-la ferait entrer de l'anglais dans le corpus, exactement ce que
    // la garde de couverture existe pour tenir dehors.
    const complet = `${t.demande}\n\nPrécisions : ${rep}`;
    ajouterDemande(rep);
    const nouveau = ajouterReponse();
    auBas();
    try {
      if (reglageEnVol) { try { await reglageEnVol; } catch (e) {} }
      const r = await fetch("/api/generer", {
        method: "POST", headers: { "Content-Type": "application/json" },
        // Sans « priorite », meme raison qu'a l'envoi ordinaire : la
        // conversation porte le cran, et une reponse a une precision n'a
        // aucune raison de le reecrire — ni de l'effacer quand le menu de CET
        // onglet est reste sur « automatique ».
        body: JSON.stringify({ texte: complet, conversation: cid,
                               ...reglagesDemandes() })
      });
      const d = await r.json().catch(() => ({}));
      if (!r.ok || !d.id) throw new Error(d.erreur || T("page.refus.demande"));
      suivre(d.id, nouveau, cid);
    } catch (err) {
      garnirReponse(nouveau, { etat: ETAT.erreur, erreur: err.message, fichiers: [] });
    }
  };
  bouton.onclick = envoyer;
  champ.onkeydown = e => { if (e.key === "Enter") envoyer(); };
  champ.focus();
}

/* Un reglage qui change s'ecrit dans la conversation, et s'y relit. Le studio
   l'a deja enregistre — on ne fait ici que le poser au bon endroit du fil. */
/* Les intentions que l'aiguilleur sait distinguer, chargees une seule fois et
   seulement si quelqu'un met un pouce en bas. */
let INTENTIONS = [];

function ajouterMurmure(m) {
  if (!m || !m.texte) return;
  const el = document.createElement("div");
  el.className = "murmure";
  const q = document.createElement("span");
  q.className = "quand"; q.textContent = m.quand || "";
  const t = document.createElement("span");
  t.textContent = m.texte;
  el.append(q, t);
  $("#fil").appendChild(el);
  return el;
}

/* ── conversations ───────────────────────────────────────────────── */
async function listerConversations() {
  try {
    const d = await (await fetch("/api/conversations")).json();
    convActive = convActive || d.courante;
    const box = $("#convs"); box.innerHTML = "";
    d.conversations.forEach(c => {
      const el = document.createElement("div");
      el.className = "conv" + (c.id === convActive ? " active" : "");
      // « compte.echanges » et non « ${n} échange${n > 1 ? "s" : ""} » : la
      // regle du pluriel appartient a la langue, pas au site d'appel — et
      // celle-la etait la francaise, fausse en anglais des zero.
      el.innerHTML = `${ech(c.titre)}<small>${
                        ech(T("compte.echanges", { n: c.tours }))}</small>
                      <button class="jeter" title="${ech(T("page.conv.jeter"))}">×</button>`;
      el.onclick = e => { if (!e.target.classList.contains("jeter")) ouvrir(c.id); };
      el.querySelector(".jeter").onclick = async e => {
        e.stopPropagation();
        const r = await (await fetch("/api/conversation/" + c.id,
                                     { method: "DELETE" })).json();
        // Le serveur dit laquelle reste — il vient de la choisir. La redemander
        // ouvrait la porte a deux reponses differentes, et l'ecran gardait
        // parfois la conversation qu'on venait de fermer. ouvrir() rafraichit
        // la liste lui-meme, donc l'ordre compte : ouvrir PUIS lister.
        if (c.id === convActive) {
          convActive = null;
          await ouvrir(r.courante);
        } else {
          await listerConversations();
        }
      };
      box.appendChild(el);
    });
  } catch (e) { $("#convs").textContent = T("page.conv.indisponible"); }
}

/* Ce qui est tape et pas encore envoye appartient a la conversation, pas a la
   fenetre : passer voir un rendu ailleurs ne doit pas effacer une phrase en
   cours d'ecriture. */
const brouillons = {};

async function ouvrir(cid) {
  basculerTiroir(false);   // sur telephone, on referme apres avoir choisi
  if (convActive) brouillons[convActive] = $("#txt").value;
  // On ne coupe plus les suivis : un rendu lance ailleurs continue d'etre
  // ecoute, et sa conversation se met a jour quand on y revient.
  convActive = cid;
  $("#txt").value = brouillons[cid] || ""; ajuster();
  $("#go").disabled = false;
  // Dire au serveur laquelle on lit. La route existait et n'etait appelee de
  // nulle part : apres un F5, on retombait sur la derniere conversation CREEE,
  // pas sur celle qu'on avait sous les yeux. Sans « await » : c'est du confort,
  // pas une condition pour afficher.
  fetch("/api/conversation/" + cid + "/activer", { method: "POST" }).catch(() => {});
  const c = await (await fetch("/api/conversation/" + cid)).json();
  // Ses reglages a elle, remis dans les menus. Sans cette ligne, passer d'une
  // conversation en FLUX.1 1920x1080 a une autre en RealVis 1024x720 gardait
  // les menus de la premiere, et la seconde partait avec le mauvais moteur.
  poserReglages(c.reglages);
  // Changer de conversation n'est pas choisir un moteur : les menus qu'on vient
  // de remplir viennent d'elle, pas d'un geste.
  moteurChoisi = false;
  $("#fil").innerHTML = "";
  // Les murmures s'ancrent APRES un tour : celui qui n'en nomme aucun est
  // anterieur au premier echange, et se lit donc en tete.
  // Le groupe entier AVANT de peindre : la variante retenue peut etre la
  // quatrieme, et une deduction faite tour par tour aurait marque la premiere
  // le temps d'arriver a elle. Vide a chaque ouverture — c'est un releve de la
  // conversation affichee, pas une memoire.
  CHOISIES.clear();
  releverChoisies(c.tours);
  const murmures = Array.isArray(c.murmures) ? c.murmures : [];
  const apres = tid => murmures.filter(m => (m.apres || null) === (tid || null));
  apres(null).forEach(ajouterMurmure);
  if (!c.tours || !c.tours.length) { if (!murmures.length) messageVide(); }
  else c.tours.forEach(t => { ajouterDemande(t.demande, t.heure);
                              garnirReponse(ajouterReponse(), t, cid);
                              apres(t.id).forEach(ajouterMurmure); });
  await listerConversations();
  auBas();
}

$("#neuve").onclick = async () => {
  const c = await (await fetch("/api/conversations", { method: "POST" })).json();
  await ouvrir(c.id);
  $("#txt").focus();
};

/* Le choix de machine est retenu dans le navigateur, et lui seul : « epargne ma
   carte, je joue » vaut pour la soiree, pas pour une demande. Retenu par
   identifiant et non par rang : les machines vont et viennent. */
/* « PRET.then » ET NON « fetch » TOUT DE SUITE : ce menu-ci ecrit du texte —
   « (ne répond pas) » — et le dictionnaire doit etre la avant lui. Sans ce
   verrou, la reponse la plus rapide gagnait, et l'ecran affichait tantot la
   phrase, tantot sa cle. Les cinq amorces de la page passent donc par lui. */
PRET.then(() => fetch("/api/machines")).then(r => r.json()).then(ns => {
  const sel = $("#machine");
  if (!Array.isArray(ns) || ns.length < 2) return;   // une seule machine : rien a choisir
  for (const x of ns) {
    const o = document.createElement("option");
    o.value = x.id;
    // Le titre SERVI par /api/machines, et non un morceau du libelle qu'on
    // assemble juste en dessous : la pastille nomme la machine choisie, pas
    // son etat du moment. Redecoupe sur « — », elle rendait d'ailleurs
    // « NAS (ne repond pas) » pour toute machine sans VRAM annoncee.
    o.dataset.court = x.titre;
    // La VRAM est ce sur quoi le repartiteur tranche : la montrer explique le
    // choix automatique au lieu de le laisser paraitre arbitraire.
    // « Go » n'est pas une unite internationale, c'est un mot francais :
    // l'anglais ecrit « GB ». Le titre de la machine, lui, est un nom propre
    // servi par /api/machines — il se place, il ne se traduit pas.
    o.textContent = x.titre
                  + (x.vram ? " — " + T("page.machine.vram", { vram: x.vram }) : "")
                  + (x.repond ? "" : " " + T("page.machine.muette"));
    sel.appendChild(o);
  }
  // La liste arrive apres coup : on repose ce que la conversation demandait,
  // sinon son choix tombait dans le vide faute d'option correspondante.
  poserReglages(reglagesVoulus);
  // La machine n'est plus memorisee dans le navigateur : elle appartient a la
  // conversation, et une valeur gardee ici s'invitait dans des conversations
  // qui ne l'avaient jamais demandee. Le listener de « change » commun a tous
  // les reglages fait deja le reste.
  try { localStorage.removeItem("machine"); } catch (e) {}
  peindreActifs();
}).catch(() => {});

/* ── amorçage ────────────────────────────────────────────────────── */
PRET.then(() => fetch("/api/modeles")).then(r => r.json()).then(ms => {
  const sel = $("#forcer"); let prets = 0, locaux = ms.length;
  ms.forEach(m => {
    TITRES[m.cle] = m.titre;
    if (m.present && !m.distant) prets++;
    if (m.distant) locaux--;
    const o = document.createElement("option");
    o.value = m.cle;
    o.textContent = m.titre + (m.present ? "" : " " + T("page.moteur.a_telecharger"));
    // Le titre SERVI par /api/modeles. « (à télécharger) » est un etat du
    // catalogue et non le reglage : le menu ouvert le dit, la pastille nomme
    // le moteur.
    o.dataset.court = m.titre;
    sel.appendChild(o);
  });
  $("#jaugeModeles").innerHTML =
    `<b>${prets}/${locaux}</b> ${ech(T("page.moteurs.prets"))}`;
  poserReglages(reglagesVoulus);   // meme raison que pour les machines
}).catch(() => {
  $("#jaugeModeles").innerHTML = `<b>${ech(T("page.serveur.injoignable"))}</b>`;
})
  .finally(async () => {
    const d = await (await fetch("/api/conversations")).json();


    await ouvrir(d.courante);
  });

/* Les interrupteurs ne s'affichent que pour les modalites reellement
   joignables : sans cle posee, il n'y a rien a activer. */
async function peindreNuages() {
  let d;
  try {
    d = await (await fetch("/api/nuage", { credentials: "same-origin" })).json();
  } catch (e) { return; }
  const zone = document.querySelector("#nuages");
  zone.innerHTML = "";
  // Sans session, /api/nuage rend un 401 dont le corps n'a pas de « modalites ».
  // Boucler dessus levait une erreur avant meme l'affichage du formulaire.
  if (!Array.isArray(d.modalites)) return;
  // Le plafond du mois, quand il y en a un : au-dela, nuage_actif() refuse pour
  // TOUTES les modalites a la fois, et aucun clic n'y changera rien avant le
  // premier du mois. Un interrupteur qu'on laisserait cliquable ferait croire a
  // une panne — il repasse eteint sans rien dire, appel apres appel.
  const q = d.plafond || null;
  // « plafonne » et non « bloque » : bloque() est deja le nom d'une fonction de
  // cette page — celle qui fabrique le depliant des details. Une locale du meme
  // nom la masquerait ici, et la prochaine ligne qui l'appellerait dans
  // peindreNuages appellerait un booleen.
  const plafonne = !!(q && q.atteint);
  for (const m of d.modalites) {
    if (!m.possible) continue;
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = m.signe;
    b.className = (m.actif ? "allume" : "eteint") + (plafonne ? " plafonne" : "");
    b.disabled = plafonne;
    // « m.libelle » et « m.titre » sont servis par /api/nuage : le nom d'une
    // modalite et celui d'un fournisseur. Ils se placent dans la phrase, ils
    // ne s'y traduisent pas.
    b.title = plafonne
      ? T("page.nuage.plafond.title",
          { libelle: m.libelle, faits: q.faits, limite: q.limite })
      : T("page.nuage.title",
          { libelle: m.libelle,
            ou: m.actif ? m.titre : T("page.nuage.locale") })
        + "\n" + T("page.nuage.basculer",
                   { quoi: m.actif ? T("page.nuage.revenir")
                                   : T("page.nuage.passer", { titre: m.titre }) });
    b.onclick = async () => {
      b.disabled = true;
      try {
        await fetch("/api/nuage", {
          method: "POST", credentials: "same-origin",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ modalite: m.modalite, actif: !m.actif }) });
      } finally { b.disabled = false; }
      peindreNuages();

    };
    zone.appendChild(b);
  }
  // Ecrit, pas seulement en infobulle : sur telephone il n'y a pas de survol, et
  // c'est la que le compte se lit le moins bien. Affiche des qu'un plafond
  // existe et non seulement une fois atteint — savoir qu'on en est a 118 sur
  // 120 evite de lancer la video de six minutes qui sera refusee.
  if (q) {
    const mention = document.createElement("span");
    mention.className = "plafond" + (q.atteint ? " atteint" : "");
    mention.textContent = q.atteint
      ? T("page.nuage.atteint", { faits: q.faits, limite: q.limite })
      : T("page.nuage.compte", { faits: q.faits, limite: q.limite });
    // « appel(s) distant(s) » : la page ECRIVAIT les parentheses, faute de
    // savoir accorder. C'est le contournement que la regle de la langue
    // supprime — il ne se lit bien dans aucune langue.
    mention.title = T("page.nuage.mention.title",
                      { n: q.faits, faits: q.faits, mois: q.mois,
                        limite: q.limite, compte: q.compte })
      + (q.atteint ? " " + T("page.nuage.mention.suite") : "");
    zone.appendChild(mention);
  }
}
PRET.then(peindreNuages);

/* ── comptes ──────────────────────────────────────────────────────────
   Facultatifs : tant qu'aucun compte n'existe, rien ne s'affiche et le studio
   se comporte comme avant. Un compte connecte, en revanche, emporte son
   espace d'un appareil a l'autre. */
async function peindreCompte() {
  let d;
  try {
    d = await (await fetch("/api/compte", { credentials: "same-origin" })).json();
  } catch (e) { return; }
  const zone = document.querySelector("#compte");
  zone.innerHTML = "";
  if (!d.comptes_existent && !d.connecte) return;
  // Connexion obligatoire et personne de connecte : on ouvre le formulaire
  // plutot que de laisser l'utilisateur ecrire une demande qui sera refusee.
  if (d.obligatoire && !d.connecte) {
    document.querySelector("#txt").disabled = true;
    document.querySelector("#go").disabled = true;
    document.querySelector("#txt").placeholder = T("page.entree.invite");
    if (!document.querySelector(".voile-entree")) formulaireEntree();
  }
  document.querySelector("#lienAdmin").style.display = d.admin ? "" : "none";
  // « d.demarrage » est deja restreint aux administrateurs cote serveur — le
  // « et » y est ecrit, parce que /api/compte se lit SANS session et que « ce
  // studio n'a jamais ete configure » n'est pas une phrase a servir a un
  // visiteur anonyme. On ne le recopie pas ici : une seconde condition, posee
  // dans la page, laisserait croire que la route peut se relacher.
  document.querySelector("#lienDemarrage").style.display = d.demarrage ? "" : "none";
  if (d.connecte) {
    const qui = document.createElement("span");
    qui.innerHTML = `<b>${ech(d.nom)}</b>${
                       d.admin ? " \u00b7 " + ech(T("page.admin")) : ""}`;
    // Le second facteur se regle depuis son propre compte et de nulle part
    // ailleurs : /admin peut imposer un mot de passe, il ne peut pas armer un
    // facteur pour quelqu'un d'autre — il faudrait son telephone.
    const facteur = document.createElement("button");
    facteur.type = "button"; facteur.textContent = T("page.mfa.bouton");
    facteur.onclick = formulaireFacteur;
    const sortir = document.createElement("button");
    sortir.type = "button"; sortir.textContent = T("page.compte.sortir");
    sortir.onclick = async () => {
      await fetch("/api/compte/sortir", { method: "POST", credentials: "same-origin" });
      location.reload();
    };
    zone.append(qui, facteur, sortir);
  } else {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = T("page.compte.entrer");
    b.onclick = formulaireEntree;
    zone.appendChild(b);
  }
}

/* Le champ par lequel le serveur dit « le mot de passe etait bon, il manque le
   code », et le SEUL contrat de ce refus-la.

   Meme patron que MARQUE_DEJA, MARQUE_DEVIS et MARQUE_PANNE, et pour la meme
   raison : le contrat de « deja refait » a tenu sur une PHRASE FRANCAISE, puis
   sur un CODE DE RETOUR, et il a fallu le defaire deux fois. Une demande de
   second facteur qui se reconnaitrait au texte du message se romprait a la
   premiere reformulation cote serveur — et le champ du code ne s'afficherait
   plus, sans qu'une ligne de cette page ne bouge. Personne n'entrerait plus,
   et le studio aurait l'air de refuser un mot de passe juste.

   Declare ici et nomme : banc_page.py releve CE nom et celui que serveur.py
   declare, et exige qu'ils soient le meme. Le jour ou l'un des deux change
   seul, le banc rougit au lieu de laisser le contrat mentir. */
const MARQUE_MFA = "mfa";

/* Le champ du code, revele parce que LE SERVEUR L'A DEMANDE.

   LE MOT DE PASSE RESTE A L'ECRAN, et ce n'est pas un detail de confort : la
   porte du studio ne connait pas de session a moitie ouverte — il n'y a pas
   d'etat cote serveur entre les deux temps, et il ne faut pas qu'il y en ait
   un. Le navigateur repose donc les trois champs ensemble, sur la meme route
   et sous le meme compteur d'essais. Vider le mot de passe obligerait a le
   retaper pour ajouter six chiffres. */
function demanderCode(f, mal) {
  const zone = f.querySelector(".code-mfa");
  if (zone) zone.hidden = false;
  if (mal) mal.textContent = "";
  if (f.code) { f.code.value = ""; f.code.focus(); }
}

function formulaireEntree() {
  const voile = document.createElement("div");
  voile.className = "voile-entree";
  voile.innerHTML = `<form class="entree">
      <h3>${ech(T("page.entree.titre"))}</h3>
      <input name="nom" placeholder="${ech(T("page.entree.nom"))}"
             autocomplete="username" autofocus>
      <input name="mdp" type="password" placeholder="${ech(T("page.entree.mdp"))}"
             autocomplete="current-password">
      <div class="code-mfa" hidden>
        <input name="code" placeholder="${ech(T("page.mfa.code"))}"
               autocomplete="one-time-code" inputmode="numeric">
        <div class="dit">${ech(T("page.mfa.secours.aussi"))}</div>
      </div>
      <div class="mal"></div>
      <div class="rang"><button type="button" data-annuler>${
                          ech(T("page.annuler"))}</button>
                        <button type="submit">${
                          ech(T("page.entree.valider"))}</button></div>
    </form>`;
  document.body.appendChild(voile);
  const f = voile.querySelector("form");
  const fermer = () => voile.remove();
  voile.querySelector("[data-annuler]").onclick = fermer;
  voile.onclick = e => { if (e.target === voile) fermer(); };
  f.onsubmit = async e => {
    e.preventDefault();
    const mal = f.querySelector(".mal");
    mal.textContent = "";
    try {
      const r = await fetch("/api/compte/entrer", {
        method: "POST", credentials: "same-origin",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ nom: f.nom.value, mdp: f.mdp.value,
                               code: f.code.value }) });
      const d = await r.json();
      // LA MARQUE DU SERVEUR, ET RIEN D'AUTRE — ni le code de retour, ni le
      // message. Le refus vaut 403 comme les deux autres de cette route, et
      // c'est voulu : le jour ou il passera a 401 ou a 428, le champ du code
      // continuera de s'afficher.
      if (!r.ok && d[MARQUE_MFA]) { demanderCode(f, mal); return; }
      if (!r.ok) throw new Error(d.erreur || T("page.entree.refus"));
      fermer();
      // Rechargement plutot qu'une mise a jour partielle : l'identite change,
      // donc la liste des conversations, les fichiers, tout le contexte.
      if (d.reprises) alert(T("page.entree.reprises", { n: d.reprises }));
      location.reload();
    } catch (err) {
      mal.textContent = err.message;
      // Le formulaire ne se referme pas sur un echec : c'est la seule porte.
    }
  };
}

/* ── l'enrolement du second facteur ───────────────────────────────────
   UN QR CODE, SANS BIBLIOTHEQUE NI CDN. La matrice arrive calculee par le
   serveur (qr.py, Python nu) : une ligne par rangee, « 1 » pour un module
   sombre. La page ne fait que la dessiner, et TROIS formes cohabitent parce
   qu'elles ne servent pas les memes gens — le code a scanner, le secret ecrit
   en toutes lettres pour qui enrole depuis la machine qui affiche l'ecran, et
   le lien « otpauth:// » pour qui lit cette page SUR son telephone.

   L'ENROLEMENT EST EN DEUX TEMPS, et le second n'est pas une politesse : armer
   au moment ou l'on tire le secret enferme dehors quiconque a mal recopie,
   ferme l'onglet trop tot, ou dont l'horloge de telephone est fausse — et
   l'administrateur ne peut rien pour lui, c'est justement ce qu'on vient
   d'empecher. Tant que ce n'est pas confirme, le compte entre avec son seul
   mot de passe. */

/* Trente-deux caracteres d'affilee se recopient de travers des le deuxieme
   groupe. On les espace par quatre pour l'oeil, et cela ne coute rien :
   mfa._octets_du_secret() retire les espaces, la casse et les tirets avant de
   decoder, et banc_mfa.py le mesure. Ce qui s'affiche est donc exactement ce
   qui se colle. */
const groupeQuatre = s => String(s || "").replace(/(.{4})(?=.)/g, "$1 ");

/* La zone de silence de la norme : quatre modules clairs tout autour. Sans
   elle, un lecteur pose contre un fond sombre ne trouve pas les trois coins de
   reperage et n'affiche rien — c'est la panne silencieuse la plus banale d'un
   QR code affiche a l'ecran. */
const MARGE_QR = 4;

/* UN SVG D'UN SEUL CHEMIN, ET PAS UNE GRILLE DE DIV. Trois raisons, dans
   l'ordre ou elles ont compte :
     - un 9-M fait 53 lignes de 53, soit 2809 elements a poser et a styler ;
       le chemin unique en fait UN, et le navigateur n'a rien a assembler ;
     - entre deux div voisines, l'arrondi sous-pixel laisse un liset clair a
       certains niveaux de zoom, et ce liset casse la lecture d'un module sur
       deux. Un chemin unique n'a pas de joint ;
     - le SVG se redimensionne sans flou, ce qu'un damier de div ne fait pas.
   « shape-rendering="crispEdges" » interdit l'anticrenelage : un module gris
   entre deux modules noirs est exactement ce qu'un lecteur refuse.

   LES COULEURS SONT ECRITES ICI, EN CLAIR, ET NE VIENNENT PAS DU THEME. Voir
   la regle « .entree .qr » de la feuille de style : un code dessine a l'encre
   de la page sur son fond sombre est INVERSE, et beaucoup de lecteurs echouent
   dessus sans le dire.

   LA MATRICE EST VERIFIEE AVANT D'ETRE ECRITE. Elle passe par innerHTML : on
   n'y admet que « 0 » et « 1 », et seulement en carre. Un caractere de plus et
   l'on rend null — la page retombe alors sur le secret ecrit, qui suffit.
   Caractere par caractere et NON par une expression reguliere : celle-ci
   demanderait un second parcours des 2809 caracteres d'un 9-M, et banc_page.py
   refuse toute expression reguliere qui ne porte pas sur un nom de fichier —
   une regle nee de trois defauts ou l'on decoupait un message lisible. */
function dessinerQR(lignes) {
  const n = Array.isArray(lignes) ? lignes.length : 0;
  if (!n) return null;
  let chemin = "";
  for (let l = 0; l < n; l++) {
    if (typeof lignes[l] !== "string" || lignes[l].length !== n) return null;
    for (let c = 0; c < n; c++) {
      const module = lignes[l][c];
      if (module !== "0" && module !== "1") return null;
      if (module === "1") chemin += `M${c + MARGE_QR} ${l + MARGE_QR}h1v1h-1z`;
    }
  }
  const cote = n + 2 * MARGE_QR;
  const boite = document.createElement("div");
  boite.className = "qr";
  boite.innerHTML = `<svg xmlns="http://www.w3.org/2000/svg" role="img"`
    + ` viewBox="0 0 ${cote} ${cote}" shape-rendering="crispEdges"`
    + ` aria-label="${ech(T("page.mfa.qr.alt"))}">`
    + `<rect width="${cote}" height="${cote}" fill="#ffffff"/>`
    + `<path d="${chemin}" fill="#000000"/></svg>`;
  return boite;
}

function formulaireFacteur() {
  const voile = document.createElement("div");
  voile.className = "voile-entree";
  voile.innerHTML = `<form class="entree">
      <h3>${ech(T("page.mfa.titre"))}</h3>
      <div class="corps-mfa"></div>
      <div class="code-mfa" hidden>
        <input name="code" placeholder="${ech(T("page.mfa.code"))}"
               autocomplete="one-time-code" inputmode="numeric">
      </div>
      <div class="mal"></div>
      <div class="rang"></div>
    </form>`;
  document.body.appendChild(voile);
  const f = voile.querySelector("form");
  const corps = f.querySelector(".corps-mfa");
  const mal = f.querySelector(".mal");
  const rang = f.querySelector(".rang");
  const fermer = () => voile.remove();
  voile.onclick = e => { if (e.target === voile) fermer(); };

  const dire = (cle, classe, valeurs) => {
    const p = document.createElement("div");
    p.className = classe || "dit";
    p.textContent = T(cle, valeurs);
    return p;
  };

  // TROIS DES CINQ ROUTES EXIGENT LE MOT DE PASSE COURANT — preparer,
  // desarmer, regenerer —, et ce n'est pas de la symetrie : un onglet laisse
  // ouvert sur une machine partagee suffirait sinon a retirer le second
  // facteur, ou a en armer un au nom de quelqu'un d'autre. Le champ est donc
  // construit la ou il sert, et nulle part ailleurs.
  const champMdp = () => {
    const i = document.createElement("input");
    i.type = "password"; i.name = "mdp";
    i.placeholder = T("page.entree.mdp");
    i.autocomplete = "current-password";
    return i;
  };

  const bouton = (cle, action) => {
    const b = document.createElement("button");
    b.type = "button"; b.textContent = T(cle);
    b.onclick = async () => {
      b.disabled = true;
      try { await action(); }
      catch (err) { mal.textContent = err.message; }
      finally { b.disabled = false; }
    };
    return b;
  };

  // Toutes les routes du facteur reposent les MEMES champs, sur la meme forme,
  // et passent par le meme compteur d'essais cote serveur. Un seul envoi ecrit
  // ici plutot que cinq : c'est le cinquieme qui aurait oublie le code.
  const poster = async url => {
    mal.textContent = "";
    const r = await fetch(url, {
      method: "POST", credentials: "same-origin",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ mdp: (f.mdp || {}).value || "",
                             code: f.code.value }) });
    const d = await r.json().catch(() => ({}));
    // La MEME marque qu'a la porte d'entree, et lue de la meme facon : le
    // champ, jamais le message ni le code de retour.
    if (!r.ok && d[MARQUE_MFA]) { demanderCode(f, mal); return null; }
    if (!r.ok) throw new Error(d.erreur || T("page.entree.refus"));
    return d;
  };

  /* L'ECRAN DES CODES DE SECOURS EST UN CUL-DE-SAC, et il le faut. Ils
     n'existent en clair que dans cette reponse-la : ce qui est garde est leur
     empreinte scrypt, et personne ne peut les redonner — pas meme
     l'administrateur. Le seul bouton offert ici ferme la boite ; en proposer
     un autre inviterait a partir sans les noter. */
  const peindreSecours = (codes, cleMot, avecAttente) => {
    corps.innerHTML = ""; rang.innerHTML = "";
    f.querySelector(".code-mfa").hidden = true;
    const ul = document.createElement("ul");
    ul.className = "secours";
    for (const c of codes) {
      const li = document.createElement("li");
      li.textContent = c;
      ul.appendChild(li);
    }
    corps.append(dire(cleMot), dire("page.mfa.secours.titre"), ul,
                 dire("page.mfa.secours.unique", "avertit"));
    // LE CODE QUI A CONFIRME EST DEJA CONSOMME, et il faut le dire : celui qui
    // vient de le taper le lit encore sur son telephone, le retape aussitot,
    // se voit refuse, et croit que son enrolement a rate. C'est voulu — sans
    // cela le rejeu rentrerait par la porte de l'enrolement — mais personne ne
    // peut le deviner. Trente secondes au plus, le pas de la RFC 6238.
    if (avecAttente) corps.append(dire("page.mfa.attente", "avertit"));
    rang.append(bouton("page.mfa.fini", async () => fermer()));
  };

  const peindreEnrolement = d => {
    corps.innerHTML = ""; rang.innerHTML = "";
    const secret = document.createElement("div");
    secret.className = "secret";
    secret.textContent = groupeQuatre(d.secret);
    const lien = document.createElement("a");
    lien.className = "otp"; lien.href = d.uri;
    lien.textContent = T("page.mfa.lien");
    // LE CODE D'ABORD, LE SECRET ENSUITE, ET LES DEUX TOUJOURS. L'ordre est
    // celui des gestes : on scanne, et si l'appareil photo ne marche pas — ou
    // si l'on enrole depuis la machine meme qui affiche l'ecran, cas ou le
    // telephone ne peut pas se photographier — on recopie. Le dessin qui echoue
    // ne coute donc rien : dessinerQR() rend null et il ne reste que le chemin
    // qui existait avant, entier.
    const image = dessinerQR(d.qr);
    if (image) corps.append(dire("page.mfa.scanne"), image);
    corps.append(dire("page.mfa.recopie"), secret, lien);
    // Le champ du code est ouvert ici sans que le serveur l'ait demande : on
    // sait ce qu'on attend, on vient de tirer le secret.
    f.querySelector(".code-mfa").hidden = false;
    f.code.value = "";
    rang.append(bouton("page.mfa.confirmer", async () => {
      const r = await poster("/api/compte/mfa/confirmer");
      if (r) peindreSecours(r.secours, "page.mfa.arme", true);
    }), bouton("page.annuler", async () => fermer()));
  };

  const peindreEtat = (etat, mot) => {
    corps.innerHTML = ""; rang.innerHTML = "";
    // Le code n'est demande que sur un compte DEJA arme : desarmer et
    // regenerer presentent la meme preuve que la porte d'entree.
    f.querySelector(".code-mfa").hidden = !etat.arme;
    if (mot) corps.append(dire(mot, "avertit"));
    corps.append(etat.arme
      ? dire("page.mfa.etat.arme", "dit", { n: etat.secours_restants,
                                            total: etat.codes_au_depart })
      : dire("page.mfa.etat.absent"));
    if (etat.arme) {
      corps.append(champMdp());
      rang.append(
        bouton("page.mfa.regenerer", async () => {
          const r = await poster("/api/compte/mfa/secours");
          if (r) peindreSecours(r.secours, "page.mfa.secours.neufs", false);
        }),
        bouton("page.mfa.retirer", async () => {
          if (!confirm(T("page.mfa.retirer.sur"))) return;
          const r = await poster("/api/compte/mfa/retirer");
          if (r) peindreEtat(r, "page.mfa.retire");
        }));
    } else {
      corps.append(dire("page.mfa.pourquoi"));
      // Un enrolement commence et jamais confirme laisse une entree morte dans
      // l'application : recommencer tire un secret NEUF, et sans cette phrase
      // l'utilisateur se retrouve avec deux entrees et aucun moyen de savoir
      // laquelle est la bonne.
      if (etat.en_attente)
        corps.append(dire("page.mfa.attente_en_cours", "avertit"));
      corps.append(champMdp());
      rang.append(bouton("page.mfa.preparer", async () => {
        const r = await poster("/api/compte/mfa/preparer");
        if (r) peindreEnrolement(r);
      }));
    }
    rang.append(bouton("page.annuler", async () => fermer()));
  };

  (async () => {
    try {
      const r = await fetch("/api/compte/mfa", { credentials: "same-origin" });
      const d = await r.json();
      if (!r.ok) throw new Error(d.erreur || T("page.entree.refus"));
      peindreEtat(d, "");
    } catch (err) {
      corps.innerHTML = ""; rang.innerHTML = "";
      mal.textContent = err.message;
      rang.append(bouton("page.annuler", async () => fermer()));
    }
  })();
}
PRET.then(peindreCompte);

/* ── la mediatheque ───────────────────────────────────────────────────
   Une sortie ne se retrouvait qu'en remontant la conversation qui l'avait
   produite. Passe vingt echanges c'est fastidieux, passe trois semaines c'est
   perdu. */
/* LA TABLE RANGEAIT LA VALEUR DE PROTOCOLE A COTE DE SON LIBELLE FRANCAIS —
   [["image", "images"], ["video", "vidéos"], …] — et c'est le quatrieme
   chantier de docs/plusieurs-langues.md dans sa forme la plus courte : une
   passe naive aurait traduit les deux moities du meme tableau, et la grille
   aurait compare « f.famille » a « images ». L'ordre des onglets est
   FAMILLES ; le libelle vient du dictionnaire. */
let familleVue = FAMILLE.image, mediaCharge = null;

async function ouvrirMediatheque() {
  document.querySelector("#mediatheque").hidden = false;
  if (!mediaCharge) {
    // LE try/catch NE SUFFISAIT PAS, et c'est le chemin PRINCIPAL. Un 401
    // « connexion requise » est un JSON parfaitement valide : rien ne leve, le
    // cache prend cet objet, et la mediatheque entiere affiche « rien de ce
    // type pour l'instant » — sans un mot et sans invite de connexion. J'avais
    // corrige ce defaut sur le rafraichissement du clic et laisse l'original,
    // en ecrivant dans le commit que celui-ci « l'a depuis toujours ».
    try {
      const r = await fetch("/api/mediatheque", { credentials: "same-origin" });
      const d = await r.json();
      mediaCharge = (r.ok && Array.isArray(d.fichiers))
                  ? d : { fichiers: [], compte: {}, souci: d.erreur || r.status };
    } catch (e) { mediaCharge = { fichiers: [], compte: {}, souci: e.message }; }
    if (mediaCharge.souci) $("#alerte").textContent =
      T("page.media.indisponible", { quoi: mediaCharge.souci });
  }
  peindreFamilles();
  const tous = mediaCharge.fichiers || [];
  garnirChoix($("#moteurMedia"), tous.map(f => f.moteur), T("page.media.tous_moteurs"));
  garnirChoix($("#machineMedia"), tous.map(f => f.noeud), T("page.media.toutes_machines"));
  const quiSel = $("#quiMedia");
  // Le proprietaire n'existe que pour un administrateur : le serveur ne le sert
  // a personne d'autre, et le selecteur reste donc cache.
  quiSel.hidden = !mediaCharge.tout;
  // Trier par proprietaire n'a de sens que pour qui en voit plusieurs : sans
  // cela l'option existe, ne fait rien, et laisse croire a une panne.
  const triQui = $("#triMedia").querySelector('option[value="a"]');
  if (triQui) triQui.hidden = !mediaCharge.tout;
  if (!mediaCharge.tout && $("#triMedia").value === "a")
    $("#triMedia").value = "-quand";
  if (mediaCharge.tout)
    garnirChoix(quiSel, tous.map(f => f.a), T("page.media.tout_le_monde"));
  for (const id of ["#chercheMedia", "#triMedia", "#moteurMedia",
                    "#machineMedia", "#quiMedia", "#soinMedia"])
    $(id).oninput = peindreGrille;
  peindreGrille();
}

function peindreFamilles() {
  const z = document.querySelector("#famillesMedia");
  z.innerHTML = "";
  for (const cle of FAMILLES) {
    const combien = (mediaCharge.compte || {})[cle] || 0;
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = `${T("page.media.famille." + cle)} (${combien})`;
    b.className = cle === familleVue ? "ouvert" : "";
    b.disabled = !combien;
    b.onclick = () => { familleVue = cle; peindreFamilles(); peindreGrille(); };
    z.appendChild(b);
  }
}

/* Remplit un selecteur avec les valeurs presentes, sans doublon et triees.
   Ne proposer que ce qui EXISTE : un menu de vingt moteurs dont deux ont servi
   fait chercher dans le vide. */
function garnirChoix(sel, valeurs, tout) {
  if (!sel) return;
  const avant = sel.value;
  const vues = [...new Set(valeurs.filter(Boolean))].sort();
  sel.innerHTML = `<option value="">${tout}</option>`
    + vues.map(v => `<option value="${ech(v)}">${ech(v)}</option>`).join("");
  if (vues.includes(avant)) sel.value = avant;
}

function trierEtFiltrer(liste) {
  const q = ($("#chercheMedia").value || "").trim().toLowerCase();
  const moteur = $("#moteurMedia").value;
  const machine = $("#machineMedia").value;
  const qui = $("#quiMedia").value;
  // Trente pieces plus tard, « lesquelles sont finies ? » est la premiere
  // question qu'on se pose devant une mediatheque ou l'on a beaucoup essaye.
  const soin = $("#soinMedia").value;
  const tri = $("#triMedia").value;

  const gardees = liste.filter(f =>
    (!moteur || f.moteur === moteur)
    && (!machine || f.noeud === machine)
    && (!qui || f.a === qui)
    && (!soin || (soin === SOIN_BROUILLONS ? !!f.esquisse : !f.esquisse))
    // La recherche porte sur ce que l'utilisateur a ECRIT, sur ce qui a ete
    // ENVOYE au moteur, et sur le nom du fichier : les trois façons dont on se
    // souvient d'une image qu'on a produite il y a trois semaines.
    && (!q || [(f.demande || ""), (f.prompt || ""), (f.filename || "")]
                .some(x => x.toLowerCase().includes(q))));

  const dec = tri.startsWith("-");
  const cle = dec ? tri.slice(1) : tri;
  return gardees.sort((a, b) => {
    const x = a[cle] ?? "", y = b[cle] ?? "";
    const c = typeof x === "number" && typeof y === "number"
      // L'ordre alphabetique n'est pas le meme partout : « é » se range avec
      // « e » en francais, et le tri figé sur « fr » aurait donne au lecteur
      // anglais un ordre qui n'est pas le sien.
      ? x - y : String(x).localeCompare(String(y), locale());
    // A egalite, du plus recent au plus ancien : c'est l'ordre qu'on attend
    // quand on trie par moteur ou par proprietaire.
    return (dec ? -c : c) || (b.quand || 0) - (a.quand || 0);
  });
}

function peindreGrille() {
  const g = document.querySelector("#grilleMedia");
  g.innerHTML = "";
  // Une vue qui n'est pas la sienne doit se dire. Sans cela, un administrateur
  // croit regarder sa propre production et tombe sur celle d'un autre.
  const banniere = document.querySelector("#toutLeStudio");
  if (banniere)
    banniere.textContent = mediaCharge.tout ? T("page.media.vue_admin") : "";
  const dansLaFamille = (mediaCharge.fichiers || [])
    .filter(f => f.famille === familleVue);
  const liste = trierEtFiltrer(dansLaFamille);
  const compteur = $("#combienMedia");
  if (compteur)
    compteur.textContent = liste.length === dansLaFamille.length
      ? T("compte.pieces", { n: liste.length })
      : T("page.media.sur", { n: liste.length, total: dansLaFamille.length });
  if (!liste.length) {
    g.innerHTML = `<p class="vide-media">${ech(T("page.media.vide"))}</p>`;
    return;
  }
  for (const f of liste) {
    const carte = document.createElement("figure");
    carte.className = "media";
    let el;
    if (f.famille === FAMILLE.video) { el = document.createElement("video"); el.controls = true; }
    else if (f.famille === FAMILLE.audio) { el = document.createElement("audio"); el.controls = true; }
    else if (f.famille === FAMILLE.image) { el = document.createElement("img"); el.loading = "lazy"; el.alt = f.demande; }
    else { el = document.createElement("div"); el.className = "cube"; el.textContent = "▣"; }
    if (el.tagName !== "DIV") el.src = url(f);
    if (el.tagName === "IMG") { el.style.cursor = "zoom-in"; el.onclick = () => plein(f); }
    // Un brouillon garde la taille et le cadrage d'une image finie : rien ne les
    // separe a l'oeil. La marque va sur ce qui se regarde — la vignette — et
    // seulement a defaut dans la legende, pour un son qu'on n'a pas a masquer.
    //
    // La variante RETENUE porte la sienne pour la meme raison, et a l'oppose :
    // une esquisse peut etre la variante choisie, les deux marques doivent
    // tenir cote a cote sans se recouvrir.
    const marques = [];
    if (f.esquisse) marques.push(["marque-esquisse", T("page.brouillon")]);
    if (f.choisie) marques.push(["marque-retenue", T("page.media.retenue")]);
    const vignette = marques.length
                  && (f.famille === FAMILLE.image || f.famille === FAMILLE.video);
    if (vignette) {
      const cadre = document.createElement("div");
      cadre.className = "cadre-media";
      cadre.appendChild(el);
      for (const [classe, mot] of marques) {
        const marque = document.createElement("span");
        marque.className = classe;
        marque.textContent = mot;
        cadre.appendChild(marque);
      }
      carte.appendChild(cadre);
    } else carte.appendChild(el);

    const legende = document.createElement("figcaption");
    const quand = f.quand
      ? new Date(f.quand * 1000).toLocaleString(locale(),
          { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" })
      : (f.heure || "");
    // « f.a » n'arrive qu'a un administrateur : le serveur ne le sert a
    // personne d'autre. Le nom du proprietaire est mis en avant, pour qu'on ne
    // confonde jamais la piece de quelqu'un d'autre avec la sienne.
    legende.innerHTML = `<span>${ech(f.demande || f.filename)}</span>`
                      + `<small>${f.a ? "<b>" + ech(f.a) + "</b> · " : ""}`
                      + `${f.esquisse && !vignette
                             ? ech(T("page.brouillon")) + " · " : ""}`
                      + `${f.choisie && !vignette
                             ? ech(T("page.media.retenue.court")) + " · " : ""}`
                      // QUEL TIRAGE, SUR COMBIEN. Le serveur sert « variante »
                      // et « variantes » depuis le debut, et la legende les
                      // jetait : quatre variantes ont le meme prompt, le meme
                      // moteur, la meme taille et la meme minute — sans ce
                      // rang, la grille en montre quatre lignes rigoureusement
                      // indiscernables. « variante » n'arrive que si le groupe
                      // en compte plus d'une, c'est le serveur qui le filtre.
                      + `${f.variante ? ech(T("page.variante.rang",
                                              { rang: f.variante,
                                                sur: f.variantes })) + " · " : ""}`
                      + `${ech(f.moteur || "")}`
                      // La taille et le temps : « pourquoi celle-ci a mis
                      // quatre minutes » se repond neuf fois sur dix par la
                      // resolution, et rien ne la montrait nulle part.
                      // « 1216x832 » -> « 1216 × 832 » : le signe de la
                      // multiplication, pas une lettre, et il s'ecrit pareil
                      // dans les deux langues. C'est une mise en forme du
                      // chiffre, pas une traduction.
                      + `${f.taille ? " · " + ech(f.taille.replace("x", " × ")) : ""}`
                      + `${f.secondes ? " · " + ech(T("page.duree.s",
                             { n: Math.round(f.secondes) })) : ""}`
                      + ` · ${ech(quand)}</small>`;
    // Replie : le prompt envoye fait souvent dix lignes, et on ne le cherche
    // que lorsqu'un rendu surprend. Deplie, il repond a « pourquoi cette
    // image-la ».
    if (f.prompt && f.prompt !== f.demande)
      legende.innerHTML += `<details><summary>${ech(T("page.media.prompt"))}</summary>`
                         + `<span class="envoye">${ech(f.prompt)}</span></details>`;
    /* LE GESTE, LA OU L'ON COMPARE. Le serveur sert « tour » et « groupe »
       depuis ce matin, et la grille les jetait : elle affichait le rang et la
       marque sans aucun moyen d'agir. Or c'est ICI qu'on compare quatre images
       indiscernables — le fil les montre l'une sous l'autre, la grille cote a
       cote. Un banc etait vert sur un contrat que la grille n'empruntait pas :
       c'est le defaut que ce projet passe ses journees a fermer. */
    // « !vignette » EXCLUAIT TOUS LES BROUILLONS. La vignette est vraie des
    // qu'une marque est posee ; « choisie » est deja exclu par la ligne, donc
    // la seule marque restante est « brouillon » — et une variante rendue en
    // brouillon n'obtenait jamais son bouton. C'est le cas EXACT que sa propre
    // recette lance (« priorite: brouillon, variantes: 2 »), et la recette
    // etait verte parce qu'elle n'ouvre jamais la page : elle poste sur
    // /api/variante directement. Le motif que ce commit denonçait, reproduit
    // dans le correctif lui-meme.
    //
    // Ce qu'il fallait exclure, ce n'est pas « une marque est posee », c'est
    // « ce media ne porte pas de legende » — le son et l'objet 3D, ou le cadre
    // n'existe pas.
    if (f.tour && f.groupe && f.variantes > 1 && !f.choisie) {
      const b = document.createElement("button");
      b.type = "button"; b.className = "repartir";
      // LA MEME CLE QUE SOUS LA BULLE DU FIL, et son infobulle de trois
      // lignes avec : les deux textes etaient ecrits deux fois, mot pour mot,
      // a huit cents lignes d'ecart. Un geste, un mot.
      b.textContent = T("page.variante.repartir");
      b.title = T("page.variante.repartir.title");
      b.onclick = async e => {
        e.stopPropagation();          // la carte entiere ouvre la piece
        b.disabled = true; b.textContent = "…";
        try {
          const r = await fetch("/api/variante", {
            method: "POST", credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ conversation: f.conversation, tour: f.tour }) });
          const rep = await r.json().catch(() => ({}));
          if (!r.ok) throw new Error(rep.erreur || T("page.refus.simple"));
          // RELIRE AVANT DE REPEINDRE. peindreGrille() ne lit que le cache
          // « mediaCharge », qui n'etait invalide que par le bouton de la
          // mediatheque : la grille se reconstruisait a l'identique, l'ancienne
          // marque restait, et le bouton qu'on venait de desactiver revenait
          // neuf. L'utilisateur voyait l'etat d'avant son clic et recliquait.
          //
          // La position de defilement se garde a la main : g.innerHTML = ""
          // remet la grille en haut, et c'est desagreable au milieu de deux
          // cents vignettes qu'on est justement en train de comparer.
          const g_ = document.querySelector("#grilleMedia");
          const haut = g_ ? g_.scrollTop : 0;
          // LE MEME FILET QUE ouvrirMediatheque, qui l'avait des le depart. Sans
          // lui, deux chemins s'ouvraient APRES un clic qui avait REUSSI : une
          // reponse non JSON — studio redemarre pendant le clic — faisait
          // ecrire « impossible » sur un geste qui a marche ; et un 401
          // « connexion requise » est un JSON valide SANS « fichiers », donc il
          // remplaçait le cache et la mediatheque entiere affichait « rien de
          // ce type pour l'instant », sans un mot. Le cache empoisonne
          // survivait : ouvrirMediatheque ne relit que si mediaCharge est nul.
          try {
            const m = await fetch("/api/mediatheque",
                                  { credentials: "same-origin" });
            const d_ = await m.json();
            if (m.ok && Array.isArray(d_.fichiers)) mediaCharge = d_;
          } catch (e) {
            // ON LE DIT. Se taire echangeait un message trompeur contre un
            // SILENCE trompeur : la grille se repeignait avec l'ancien cache,
            // le bouton revenait neuf sur l'ancienne variante, et l'utilisateur
            // recliquait — la boucle meme que « relire avant de repeindre »
            // existe pour rompre.
            $("#alerte").textContent =
              T("page.media.rafraichir", { quoi: e.message });
          }
          peindreGrille();
          if (g_) g_.scrollTop = haut;
        } catch (err) {
          b.disabled = false;
          // Sur la legende elle-meme : la barre d'alerte est en haut de la
          // page, et la grille se parcourt en bas — un message qu'on ne voit
          // pas ne dit rien.
          b.textContent = T("page.impossible", { quoi: err.message });
        }
      };
      legende.appendChild(b);
    }
    carte.appendChild(legende);

    const actions = document.createElement("div");
    actions.className = "actions-sortie";
    const tele = document.createElement("a");
    tele.href = url(f); tele.download = f.filename;
    tele.textContent = T("page.telecharger");
    actions.appendChild(tele);
    if (f.famille === FAMILLE.image || f.famille === FAMILLE.video) {
      const gros = document.createElement("button");
      gros.type = "button"; gros.textContent = T("page.plein_ecran");
      gros.onclick = () => plein(f);
      actions.appendChild(gros);
    }
    if (f.famille !== FAMILLE.objet3d) {
      const rep = document.createElement("button");
      rep.type = "button"; rep.textContent = T("page.reprendre");
      rep.title = T("page.reprendre.title");
      rep.onclick = async () => {
        rep.disabled = true;
        try {
          const r = await fetch("/api/reprendre", {
            method: "POST", credentials: "same-origin",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ filename: f.filename,
                                   subfolder: f.subfolder || "", noeud: f.noeud }) });
          const d = await r.json().catch(() => ({}));
          if (!r.ok || !d.image) throw new Error(d.erreur || T("page.reprise.impossible"));
          imageJointe = d.image;
          $("#nomimg").textContent = f.filename;
          // La vignette avec : une piece jointe sans apercu ne dit pas laquelle
          // on vient de reprendre, et on en reprend souvent plusieurs de suite.
          const zone = $("#apercu-zone");
          zone.innerHTML = "";
          if (f.famille === FAMILLE.image) {
            const i = document.createElement("img");
            i.src = url(f); i.alt = f.filename; zone.appendChild(i);
          } else if (f.famille === FAMILLE.video) {
            const v = document.createElement("video");
            v.src = url(f); v.muted = true; zone.appendChild(v);
          } else {
            zone.innerHTML = '<span class="genre">♪</span>';
          }
          $("#jointe").style.display = "";
          fermerMediatheque();
          $("#txt").focus();
        } catch (err) { $("#alerte").textContent = err.message; }
        finally { rep.disabled = false; }
      };
      actions.appendChild(rep);
    }
    carte.appendChild(actions);
    g.appendChild(carte);
  }
}

function fermerMediatheque() {
  document.querySelector("#mediatheque").hidden = true;
}

document.querySelector("#ouvrirMedia").onclick = () => {
  mediaCharge = null;      // toujours frais : on vient d'en produire
  ouvrirMediatheque();
};
document.querySelector("#fermerMedia").onclick = fermerMediatheque;
document.addEventListener("keydown", e => {
  // La vue plein ecran s'ouvre PAR-DESSUS la mediatheque : echap doit fermer
  // celle du dessus, pas les deux d'un coup.
  if (e.key === "Escape" && !document.querySelector(".plein")
      && !document.querySelector("#mediatheque").hidden)
    fermerMediatheque();
});

/* ── la file, au survol et au clic ─────────────────────────────────────
   Le compteur disait « 3 demandes » sans dire lesquelles : impossible de
   savoir si l'attente venait d'une video de six minutes lancee par erreur, et
   impossible de la retirer. */
let fileOuverte = false, minuteurFile = null;

function fermerFile() {
  fileOuverte = false;
  document.querySelector("#panneauFile").classList.remove("ouvert");
  if (minuteurFile) { clearInterval(minuteurFile); minuteurFile = null; }
}

async function peindreFile() {
  const p = document.querySelector("#panneauFile");
  let d;
  try {
    d = await (await fetch("/api/file", { credentials: "same-origin" })).json();
  } catch (e) { return; }
  const lignes = d.lignes || [];
  if (!lignes.length) {
    p.innerHTML = `<h4>${ech(T("page.file.titre"))}</h4>`
                + `<div class="tache"><span class="quoi">${
                     ech(T("page.file.rien"))}</span></div>`;
    return;
  }
  p.innerHTML = `<h4>${ech(T("page.file.titre"))}`
    + (d.admin ? " — " + ech(T("page.file.vue_admin")) : "") + "</h4>";
  for (const t of lignes) {
    const el = document.createElement("div");
    el.className = "tache" + (t.a_moi ? "" : " autrui");
    /* Une demande armée n'a pas de rang : elle n'attend pas son tour, elle
       attend son propriétaire. Le « 0 » que servait l'API laissait croire
       qu'elle était première, donc imminente. */
    const rang = t.en_cours ? "▶" : (t.armee ? "⏸" : t.rang);
    /* LES CLES SONT DES VALEURS DE PROTOCOLE, LES VALEURS SONT DE L'IHM, et
       la table les ecrivait cote a cote en clair : « fini: ["fini",
       "terminé"] ». Une passe de traduction naive aurait touche les deux
       moities du meme litteral — la cle avec l'etiquette — et « t.etat ===
       "fini" » serait devenu muet sans lever la moindre erreur. Les cles
       viennent donc de ETAT, les etiquettes du dictionnaire ; la classe CSS,
       elle, est un nom de regle et reste ecrite ici. */
    const etats = {
      [ETAT.cours]: ["cours", "page.etat.cours"],
      [ETAT.fini]: ["termine", "page.etat.fini"],
      [ETAT.erreur]: ["rate", "page.etat.echec"],
      [ETAT.question]: ["attente", "page.etat.question.file"],
      // Analysée, sa machine est choisie, et cette machine travaille pour
      // quelqu'un d'autre. Ni file, ni calcul.
      [ETAT.attente_carte]: ["attente", "page.etat.attente_carte"],
      // Armée : ni dans la file, ni sur une carte. Elle attend qu'une machine
      // en pause revienne, et repartira seule. Sans cette entrée elle
      // s'affichait « en attente », comme celles qui partent dans deux
      // minutes.
      [ETAT.attente_machine]: ["attente", "page.etat.attente_machine"],
    };
    // Une demande porte l'etat « en cours » des sa creation : c'est l'etat de
    // la TACHE, pas sa place dans la file. Seule la ligne marquee en_cours
    // occupe vraiment la carte ; les autres attendaient en affichant
    // « en cours », ce qui rendait la file illisible.
    const attend = ["attente", "page.etat.attente"];
    const [classe, cleMot] = (!t.en_cours && t.etat === ETAT.cours)
      ? attend : (etats[t.etat] || attend);
    const mot = T(cleMot);
    // Le pourcentage vient de ComfyUI ; sans lui on montre l'etat seul.
    const pct = t.avance && t.avance.total
      ? Math.round(t.avance.fait * 100 / t.avance.total) : null;
    el.innerHTML = `<span class="rang">${rang}</span>
      <span class="quoi">${ech(t.demande)}
        <small>${ech(t.type)}${t.qui ? " · " + ech(t.qui) : ""}</small>
        <span class="etat-tache ${classe}">${ech(mot)}`
      + (pct !== null ? " — " + ech(T("page.pourcent", { n: pct })) : "")
      /* Le temps qu'il reste à une demande armée. Sans lui, « attend une
         machine en pause » ne dit pas si l'on parle de dix minutes ou de douze
         heures — donc pas si l'on peut aller se coucher. */
      + (t.armee && t.reste_h > 0
          ? " — " + ech(T("page.file.reste", { duree: dureeRestante(t.reste_h) }))
          : "")
      + (t.ou ? " · " + ech(t.ou) : "") + `</span>`
      + (pct !== null
          ? `<span class="avance"><i style="width:${pct}%"></i></span>` : "")
      + `</span>`;
    if (t.annulable) {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = t.en_cours ? T("page.interrompre") : T("page.retirer");
      b.onclick = async ev => {
        ev.stopPropagation();
        b.disabled = true;
        await fetch("/api/file/" + encodeURIComponent(t.tid),
                    { method: "DELETE", credentials: "same-origin" });
        peindreFile();
      };
      el.appendChild(b);
    }
    p.appendChild(el);
  }
}

function ouvrirFile() {
  if (fileOuverte) return;
  fileOuverte = true;
  document.querySelector("#panneauFile").classList.add("ouvert");
  peindreFile();
  // Rafraichi tant qu'il est ouvert : une file qui avance sous les yeux est la
  // seule facon de voir qu'elle avance.
  minuteurFile = setInterval(peindreFile, 3000);
}

document.addEventListener("click", e => {
  const compteur = e.target.closest("#etatFile");
  const dedans = e.target.closest("#panneauFile");
  if (compteur) { fileOuverte ? fermerFile() : ouvrirFile(); return; }
  if (!dedans && fileOuverte) fermerFile();
});
document.querySelector("#etatFile").addEventListener("mouseenter", ouvrirFile);
document.querySelector("#panneauFile").addEventListener("mouseleave", e => {
  // On ne referme au survol que si l'on n'a pas ouvert au clic : sur une
  // tablette, un doigt qui frole refermerait le panneau qu'on vient d'ouvrir.
  if (e.buttons === 0 && window.matchMedia("(hover: hover)").matches) fermerFile();
});

/* Les reglages restent replies, mais jamais silencieux : ce qui s'ecarte du
   defaut s'affiche en clair, et se retire d'un clic. Un reglage applique sans
   etre visible donne le sentiment de ne pas etre ecoute.

   LE LIBELLE COURT EST UN ATTRIBUT, PAS UN MORCEAU DU LIBELLE VISIBLE. Chaque
   entree portait son propre lecteur, et trois d'entre eux decoupaient le texte
   affiche d'une <option> sur le tiret cadratin : « o.textContent.split(" — ")
   [0] ». Le separateur d'un texte d'interface devenait ainsi le contrat d'un
   bout de code, sans que rien ne le dise nulle part — reformuler « rapide —
   moins d'étapes », ou l'ecrire avec un tiret ordinaire, et la pastille
   affichait la phrase entiere en silence.

   Plus de lecteur par entree, donc : un seul, courtDe(), et l'attribut
   « data-court » que chaque option porte (voir les menus, plus haut). Les deux
   menus construits en JavaScript le posent depuis le titre que le serveur SERT
   — /api/modeles, /api/machines — au lieu de redecouper ce qu'ils viennent
   d'assembler. banc_page.py exige les deux moities : l'attribut sur toute
   option qui porte une valeur, et une lecture qui ne recoupe plus rien. */
const REGLAGES = [
  // « nom » est une CLE du dictionnaire, plus un mot francais : la pastille
  // ecrivait « moteur FLUX.1 » avec le mot recopie ici, dans du code
  // d'interface.
  { sel: "#forcer", nom: "page.moteur" },
  { sel: "#machine", nom: "page.machine" },
  { sel: "#priorite", nom: "" },
  { sel: "#taille", nom: "" },
  // « geste » : ce menu-ci ne s'ecrit PAS sur la conversation. Il n'a ni entree
  // dans MENU_REGLAGE ni dans CLE_REGLAGE — les envoyer a
  // /api/conversation/{cid}/reglages serait poster une cle que le serveur ne
  // lit pas, et le murmure promis ne viendrait jamais. Il est ici pour une
  // seule raison : la pastille. Sans elle, « 4 variantes » ne se verrait que
  // le tiroir ouvert, et le tiroir est replie par defaut — on repartirait en
  // quatre exemplaires sans rien voir venir, ce qui est exactement le degat
  // que le serveur refuse de retenir sur la conversation.
  { sel: "#variantes", nom: "", geste: true },
];

/* Le libelle court d'une option. Le repli sur le libelle entier n'est pas une
   tolerance : c'est le seul comportement qui ne MENTE pas quand l'attribut
   manque. Une pastille vide dirait « aucun reglage actif », ce qui est faux, et
   c'est exactement le genre de silence qu'on ferme ici ; le libelle entier,
   lui, est laid et se voit. banc_page.py rougit sur l'attribut manquant, de
   sorte que ce repli ne serve jamais. */
function courtDe(o) {
  return (o && (o.dataset.court || o.textContent)) || "";
}

function peindreActifs() {
  const zone = document.querySelector("#actifs");
  zone.innerHTML = "";
  for (const r of REGLAGES) {
    const el = document.querySelector(r.sel);
    if (!el || !el.value) continue;
    const mot = document.createElement("span");
    mot.className = "oter";
    mot.textContent = (r.nom ? T(r.nom) + " " : "") + courtDe(el.selectedOptions[0]);
    mot.title = T("page.actifs.oter");
    mot.onclick = () => { el.value = ""; accorderTaille(); peindreActifs();
                          if (!r.geste) retenirReglages(CLE_REGLAGE[r.sel]); };
    zone.appendChild(mot);
  }
}
/* Choisir dans un menu, c'est deja decider : le reglage part tout de suite sur
   la conversation, sans attendre qu'une demande soit envoyee. Sans cette route,
   on ouvrait le tiroir, on prenait FLUX.1 en 1920x1080, on passait voir une
   autre conversation, et le choix n'existait plus au retour. */
/* La valeur d'un reglage, lue dans SON menu. Elle etait tiree de
   reglagesDemandes(), qui ne porte plus les reglages depuis qu'ils vivent sur
   la conversation : « modele », « taille » et « noeud » y valaient donc
   « undefined », JSON.stringify les supprimait, le serveur recevait un corps
   vide — rien n'etait retenu et rien n'etait murmure. Seule la priorite
   survivait, parce qu'elle etait ajoutee a part. Constate par l'utilisateur :
   « il n'y a que priorite soigne qui est apparu dans le chat ».

   Et reglagesDemandes() remet « moteurChoisi » a faux au passage : chaque
   changement de menu CONSOMMAIT donc le drapeau avant que la demande puisse
   s'en servir. Un effet de bord n'a rien a faire dans une lecture. */
const MENU_REGLAGE = { modele: "#forcer", noeud: "#machine",
                       priorite: "#priorite", taille: "#taille" };

function valeurReglage(cle) {
  const el = $(MENU_REGLAGE[cle]);
  if (!el) return null;
  return el.value || null;
}

function retenirReglages(cle) {
  if (!convActive) return;
  // SEULEMENT LA CLE QUI VIENT DE CHANGER. Envoyer les quatre a chaque geste
  // faisait deux degats : un second onglet reste ouvert sur la meme
  // conversation effaçait le moteur regle depuis le premier — le serveur
  // raisonne sur la PRESENCE, et une cle presente et vide efface — et il
  // ecrivait un murmure « moteur : automatique » que personne n'avait demande.
  const corps = cle
    ? { [cle]: valeurReglage(cle) }
    : Object.fromEntries(Object.keys(MENU_REGLAGE).map(k => [k, valeurReglage(k)]));
  reglagesVoulus = { ...reglagesVoulus, ...corps };
  const ou = convActive;
  reglageEnVol = fetch("/api/conversation/" + ou + "/reglages", {
    method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(corps)
  }).then(r => r.json()).then(d => {
    // Seulement si l'on est encore dans la meme conversation : le murmure
    // appartient a celle qu'on reglait, pas a celle qu'on regarde.
    if (d && d.murmure && ou === convActive) { ajouterMurmure(d.murmure); auBas(); }
  }).catch(() => {});   // du confort : la demande les reporte de toute facon
}

/* Le compteur de l'en-tete, et le releve des demandes armees qui va avec.
   Appele tout de suite ET toutes les 2,5 s : la premiere passe attendait le
   premier tour de minuteur, si bien qu'une page rechargee sur une demande armee
   la montrait « en cours », chronometre qui monte, pendant deux secondes et
   demie — juste assez pour la lire et la croire. */
async function releverFile() {
  try {
    const f = await (await fetch("/api/file")).json();
    // « occupe ? 1 : 0 » etait juste du temps ou un seul travail pouvait
    // courir. Depuis qu'il y en a plusieurs, le compteur annonçait « 1 en file »
    // pendant que le panneau en montrait trois.
    const n = (f.en_attente || 0) + (f.en_vol || 0);
    const moi = f.a_moi || 0;
    // Les demandes armees ne sont NI dans la file NI sur une carte : elles
    // attendent le retour d'une machine en pause, pendant des heures. Le
    // compteur les ignorait, donc il restait vide — et comme c'est lui qui
    // ouvre le panneau, et le panneau qui porte le bouton « retirer », une
    // demande armee toute seule etait invisible ET irretirable jusqu'au
    // lendemain. Le serveur sert « armees » exactement pour cette ligne.
    const dort = f.armees || 0;
    // Le ⏸ plutot qu'une phrase : c'est le signe que la meme demande porte deja
    // a la place de son rang dans le panneau, et l'en-tete tient sur une ligne
    // de telephone.
    const bouts = [];
    if (n) bouts.push(T("page.file.compteur", { n }));
    if (dort) bouts.push(`⏸ ${dort}`);
    if (moi && moi < n + dort) bouts.push(T("page.file.a_moi", { n: moi }));
    const etat = $("#etatFile");
    etat.innerHTML = bouts.length
      ? `<span class="file-vive">${ech(bouts.join(" · "))}</span>` : "";
    // « demande(s) attendent » : la page ecrivait les parentheses. La regle
    // du pluriel appartient a la langue.
    etat.title = dort ? T("page.file.armees.title", { n: dort }) : "";
    // Releve au passage : la bulle de la conversation s'en sert pour ne pas
    // faire courir un chronometre sur une demande qui ne calcule pas.
    armees.clear();
    for (const l of f.lignes || []) if (l.armee) armees.set(l.tid, l.reste_h || 0);
  } catch (e) { /* sans effet */ }
}
PRET.then(() => { releverFile(); setInterval(releverFile, 2500); });
